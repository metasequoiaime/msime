name: msime-desktop
options:
  bundleIdPrefix: com.metasequoiaime.client
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
packages:
  SwiftRs:
    url: https://github.com/Brendonovich/swift-rs
    revision: a83e2b2f196e3fa9605cb21c7d3b82652205c279
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: 水杉输入法
      PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  msime-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The settings host and keyboard extension intentionally share the
      # native App Group queue implementation. Keep these files in the Tauri
      # app target so WebView dictionary edits never touch Engine files while
      # the extension is active.
      - path: ../../../../../platforms/ios/SharedUI/dictionary/PersonalDictionaryBridge.swift
      - path: ../../../../../platforms/ios/SharedUI/dictionary/PersonalDictionaryImport.swift
      - path: ../../../../../platforms/ios/SharedUI/dictionary/PersonalDictionaryStore.swift
      - path: ../../../../../platforms/ios/SharedUI/dictionary/PersonalWordBridge.swift
      - path: ../../../../../platforms/ios/App/Sources/dictionary/TauriPersonalDictionaryBridge.swift
      # Tauri cloud-dictionary snapshots use the same validated wire format
      # and App Group queue as the native iOS keyboard worker.
      - path: ../../../../../platforms/ios/SharedUI/dictionary/DictionarySnapshotQueue.swift
      - path: ../../../../../shared/backend/account/BackendAccountClient.swift
      - path: ../../../../../shared/backend/clients/BackendSnapshotClient.swift
      - path: ../../../../../platforms/ios/App/Sources/dictionary/TauriDictionarySnapshotBridge.swift
      - path: Assets.xcassets
      - path: Externals
        excludes:
          - "**/libapp.a"
      - path: msime-desktop_iOS
      - path: ../../../../../target/ios/EngineResources
        buildPhase: resources
        type: folder
      # Staged by platforms/ios/stage-resources.sh beside EngineResources, where host-api looks for the Cantonese and Zhuyin dictionaries; empty when none were built or fetched, and those schemes are then not offered.
      - path: ../../../../../target/ios/language-dictionaries
        buildPhase: resources
        type: folder
        optional: true
      - path: ../../../../../platforms/ios/SharedResources/MLKit-NOTICES.txt
        buildPhase: resources
      - path: ../../../../../platforms/ios/SharedResources/MLKit-Dependencies.txt
        buildPhase: resources
      - path: ../../../../../platforms/ios/SharedResources/KeyboardBrand.png
        buildPhase: resources
      - path: ../../../../../platforms/ios/SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: msime-desktop_iOS/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "仅在你开始语音输入时录音，并发送到你配置的语音识别服务。"
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: msime-desktop_iOS/msime-desktop_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.msime.ios
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconForest AppIconSky AppIconDusk AppIconVermilion
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: true
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # The app target compiles the shared dictionary bridges listed above, so it needs the
        # same explicit language version the other two targets declare. Xcode used to supply a
        # default; Xcode 27 rejects the resulting empty SWIFT_VERSION and the archive fails
        # before a single file is compiled.
        SWIFT_VERSION: 5.0
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - target: MSIMESwiftRsRuntimeExports
        embed: false
        link: false
      - target: MSIMEKeyboardExtension
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  MSIMEKeyboardExtension:
    type: app-extension
    platform: iOS
    info:
      path: MSIMEKeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: 水杉输入法
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    sources:
      - path: ../../../../../platforms/ios/KeyboardExtension/Sources
        excludes:
          - KeyboardServiceFallback.swift
      - path: ../../../../../platforms/ios/SharedUI
      - path: ../../../../../shared/backend/account/BackendAccountClient.swift
      - path: ../../../../../shared/backend/clients/BackendChatClient.swift
      - path: ../../../../../shared/backend/account/BackendAccountSession.swift
      - path: ../../../../../shared/backend/account/BackendAnonymousAccount.swift
      - path: ../../../../../shared/backend/storage/BackendLocalStore.swift
      - path: ../../../../../shared/backend/clients/BackendSnapshotClient.swift
      - path: ../../../../../shared/backend/clients/BackendClipboardClient.swift
      - path: ../../../../../platforms/ios/App/Services/KeyboardAIService.swift
      - path: ../../../../../platforms/ios/KeyboardExtension/Sources/keyboard/KeyboardServiceFallback.swift
      - path: ../../../../../target/ios/EngineResources
        buildPhase: resources
        type: folder
      # Staged by platforms/ios/stage-resources.sh beside EngineResources, where host-api looks for the Cantonese and Zhuyin dictionaries; empty when none were built or fetched, and those schemes are then not offered.
      - path: ../../../../../target/ios/language-dictionaries
        buildPhase: resources
        type: folder
        optional: true
      - path: ../../../../../platforms/ios/SharedResources/KeyboardBrand.png
        buildPhase: resources
      - path: ../../../../../platforms/ios/SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client.keyboard
        PRODUCT_NAME: MSIMEKeyboardExtension
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        CODE_SIGN_ENTITLEMENTS: ../../../../../platforms/ios/KeyboardExtension/Resources/MSIMEKeyboardExtension.entitlements
        # The Tauri CLI applies APPLE_DEVELOPMENT_TEAM to its own app target only, so the
        # embedded targets have to pick it up themselves or a signed device build stops at
        # "Signing for MSIMEKeyboardExtension requires a development team". Xcode falls back
        # to the process environment for a setting the project leaves empty, so unsigned
        # simulator builds are unaffected.
        DEVELOPMENT_TEAM: LXCL4Z68GU
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../../../../../platforms/ios/KeyboardExtension/Sources/core/MetasequoiaKeyboard-Bridging-Header.h
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        ARCHS: [arm64]
        EXCLUDED_SOURCE_FILE_NAMES[sdk=iphoneos*]: HandwritingInputViewFallback.swift
        EXCLUDED_SOURCE_FILE_NAMES[sdk=iphonesimulator*]: HandwritingInputView.swift HandwritingDownloadSession.m
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lmsime_host_api"
          - "-lc++"
          - "-lsqlite3"
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../../../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../../../../target/ios/simulator"
  MSIMESwiftRsRuntimeExports:
    type: library.static
    platform: iOS
    sources:
      - path: SwiftRsRuntimeExports
    settings:
      base:
        PRODUCT_NAME: MSIMESwiftRsRuntimeExports
        PRODUCT_BUNDLE_IDENTIFIER: com.metasequoiaime.client.swift-rs-runtime-exports
        SKIP_INSTALL: true
        SWIFT_VERSION: 5.0
        ARCHS: [arm64]
    dependencies:
      - package: SwiftRs
