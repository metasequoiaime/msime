[package]
name = "msime-desktop"
description = "Tauri entry library and commands for the macOS, Linux and Windows settings shells."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# 不写 `name`：库名默认取包名，其他八个 crate 都靠这一点。写了它，这个 crate 就成了唯一一个库名与包名不一致的：`cargo -p msime-desktop` 和 `use msime_app` 指的是同一个东西。staticlib 和 cdylib 只给 Tauri 的 iOS、Android 工程用，那两个工程已经删掉，桌面外壳只链接 rlib。
[lib]
crate-type = ["rlib"]

[features]
telemetry-loopback = ["msime-client-services/telemetry-loopback", "msime-host-api/telemetry-loopback"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri.workspace = true
serde.workspace = true
msime-client-core = { path = "../../../crates/client-core" }
msime-client-providers = { path = "../../../crates/client-providers" }
msime-client-services = { path = "../../../crates/client-services" }
msime-host-api = { path = "../../../crates/host-api" }
msime-input-runtime = { path = "../../../crates/input-runtime" }
msime-path-trust = { path = "../../../crates/path-trust" }
hex = "0.4"
serde_json.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2.workspace = true
time = { workspace = true, features = ["local-offset"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
msime-host-macos = { path = "../../../crates/host-macos" }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
# Desktop shells reuse one settings process and hand off surface routes to it. On macOS only settings launches join it; panel launches stay one process per input session.
tauri-plugin-single-instance = "2.4"
# The platform's own open dialog for the 插件 page's pack import, driven from Rust only. Held below 2.8, which needs tauri 2.12.
tauri-plugin-dialog = "~2.8"

[target.'cfg(windows)'.dependencies]
# Foreground capture, synthetic input and shell access for the shared panels.
msime-host-windows = { path = "../../../crates/host-windows" }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
msime-path-trust = { path = "../../../crates/path-trust", features = ["test-support"] }

[lints]
workspace = true
