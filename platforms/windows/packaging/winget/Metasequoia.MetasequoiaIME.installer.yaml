# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
# Template: platforms/windows/packaging/render.py fills the @...@ fields from a windows-v release.
# The facts below are read from platforms/windows/installer/msime_setup.iss: AppId (the ProductCode is that GUID plus Inno's "_is1" suffix), PrivilegesRequired=admin, ArchitecturesAllowed=x64compatible, AppName and AppPublisher. A test (scripts/test-windows-package-managers.py) checks they still agree.

PackageIdentifier: Metasequoia.MetasequoiaIME
PackageVersion: "@VERSION@"
InstallerLocale: zh-CN
Platform:
  - Windows.Desktop
# The candidate window uses the Per-Monitor V2 DPI context, which needs Windows 10 1703.
MinimumOSVersion: 10.0.15063.0
InstallerType: inno
Scope: machine
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
  SilentWithProgress: /SP- /SILENT /SUPPRESSMSGBOXES /NORESTART
# The installer upgrades in place and keeps the user's data directory; uninstalling first would delete that directory, because the uninstaller removes the data directory it owns.
UpgradeBehavior: install
ElevationRequirement: elevatesSelf
# Neither ships in the installer, and a silent install continues without them (msime_setup.iss InitializeSetup only logs what is missing).
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.VCRedist.2015+.x64
    - PackageIdentifier: Microsoft.EdgeWebView2Runtime
ProductCode: "{A7C3E91F-4B2D-4E8A-9F1C-6D5E8B0A2C4D}_is1"
ReleaseDate: "@RELEASE_DATE@"
AppsAndFeaturesEntries:
  - DisplayName: Metasequoia IME 水杉输入法
    Publisher: Metasequoia
    DisplayVersion: "@VERSION@"
    ProductCode: "{A7C3E91F-4B2D-4E8A-9F1C-6D5E8B0A2C4D}_is1"
    InstallerType: inno
InstallationMetadata:
  DefaultInstallLocation: "%ProgramFiles%\\metasequoiaime"
Installers:
  - Architecture: x64
    InstallerUrl: "@INSTALLER_URL@"
    InstallerSha256: "@SHA256_UPPER@"
ManifestType: installer
ManifestVersion: 1.12.0
