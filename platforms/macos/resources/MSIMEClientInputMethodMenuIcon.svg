<?xml version="1.0" encoding="UTF-8"?>
<!--
  输入菜单的通用图标：水杉标志 C 的单色版，做成模板图，好让菜单栏在浅色、深色与高亮菜单行下各自着色。

  外形与各平台的标志 packages/ui/src/assets/msime.svg 相同：一整块圆角方形（外沿 2.5 到 107.5、圆角 24.5），折线从中间镂空。折线是母版 apps/desktop/app-icon.svg 那一笔以外框中心为原点缩到 80%、线宽 8 不变、round 端帽。

  viewBox 在圆角方形外四边各留边长的 1/32，与 platforms/macos/scripts/render_menu_icon.swift 的 drawLogo() 一致。改了这里的几何，就要同步那个脚本，再跑一次它重写 MSIMEClientInputMethodMenuIcon.tiff。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-1.0 -1.0 112.0 112.0">
  <title>水杉输入法 input menu icon</title>
  <defs>
    <mask id="stroke">
      <rect x="2.5" y="2.5" width="105" height="105" rx="24.5" fill="#fff"/>
      <path d="M70.7787 22.2L39.1201 34.3382L70.7787 43.4418L39.1201 58.6144C69.0496 63.672 97.1824 67.8192 37.4 87" fill="none" stroke="#000" stroke-linecap="round" stroke-width="8"/>
    </mask>
  </defs>
  <rect x="2.5" y="2.5" width="105" height="105" rx="24.5" fill="#000" mask="url(#stroke)"/>
</svg>
