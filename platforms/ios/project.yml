name: MSIMEClient
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: app.msime.ios
  # false，否则 xcodegen 会为 platforms/ios 之上的路径（../../shared、../../target）建一层中间 group，
  # 并用仓库根目录的名字命名它。那个名字是谁最后跑的 xcodegen、他的 worktree 叫什么——于是每个人重新
  # 生成一次，工程就变一次，object ID 跟着大面积重排。改成 false 之后，在任意目录名下生成的工程逐字节
  # 相同（实测两个不同名 worktree 的 project.pbxproj SHA-256 一致）。
  createIntermediateGroups: false
settings:
  base:
    SWIFT_VERSION: 5.0
    # shared/backend 里调用 Rust 的 Swift 代码经 `import CMSIMEClient` 看到 C 头文件的类型（shared/backend/rust/module.modulemap）；App 与测试 target 都链着 libmsime_host_api，iOS 直接拿 C 函数填 Rust 函数表。
    SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/../../shared/backend/rust"
    ALWAYS_SEARCH_USER_PATHS: NO
    # 本工程没有 AppIntents，跳过不适用的元数据提取任务。
    LM_SKIP_METADATA_EXTRACTION: YES
    # 语音框架已签名且保留其分发二进制，不再让 Xcode 尝试剥离。
    COPY_PHASE_STRIP: NO
    DEVELOPMENT_TEAM: LXCL4Z68GU
    MARKETING_VERSION: 0.53.0
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_NAME: "$(TARGET_NAME)"
schemes:
  MSIMEClientTests:
    build:
      targets:
        MSIMEKeyboardTests: all
        MSIMEServiceTests: all
        MSIMESharedTests: all
    test:
      targets:
        - MSIMEKeyboardTests
        - MSIMEServiceTests
        - MSIMESharedTests
  MSIMEDoubaoTransportTests:
    build:
      targets:
        MSIMEDoubaoTransportTests: all
    test:
      targets:
        - MSIMEDoubaoTransportTests
  MSIMEClientUITests:
    build:
      targets:
        MSIMEClientUITests: all
        MSIMEKeyboardTestHost: all
    test:
      targets:
        - MSIMEClientUITests
targets:
  MSIMEApp:
    type: application
    platform: iOS
    # 只放 INFOPLIST_KEY_* 表达不了的键：两个 URL scheme（键盘扩展里没有 UIApplication,它要打开本应用只能走一个自己注册的 scheme；另一个是 Google 登录的回调）、Google 登录的两个 client ID、ATS 的局域网例外、界面语言的声明和后台音频模式。
    # 其余的键仍由 GENERATE_INFOPLIST_FILE 和下面的 INFOPLIST_KEY_* 合进来。
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.msime.ios
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [msime]
          # Google 登录的回调 scheme，是下面 GIDClientID 倒过来写。
          - CFBundleURLName: app.msime.ios.google
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [com.googleusercontent.apps.237074057301-dam9p3icuapsr31tv85q35gn4erm1kmt]
        # GoogleSignIn 从这两个键读配置。GIDClientID 是 Google Cloud 项目 237074057301 里 bundle ID 为 app.msime.ios 的 iOS 类型 OAuth client；GIDServerClientID 是 Android 也在用的 web client，它决定 ID token 的 audience，后端认的是它。两个都不是机密。
        GIDClientID: 237074057301-dam9p3icuapsr31tv85q35gn4erm1kmt.apps.googleusercontent.com
        GIDServerClientID: 237074057301-q5av9h30kspkqnjat4i9hn9oer9ogfpp.apps.googleusercontent.com
        # AI 辅助可以连本机或局域网里的 http 模型服务（如 LM Studio），哪些地址能用由 SharedUI/core/AIEndpointPolicy.swift 判断，公网仍然只走 https。iOS 10 起 ATS 本来就不拦 IP 地址、无点主机名和 .local，这里显式写出来，免得以后有人加 ATS 配置时把它关掉；它不放开任何公网域名。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 界面只有中文，所以界面里内嵌的系统控件（Sign in with Apple、`ContentUnavailableView.search`、系统弹出面板）也要请求中文；不声明本地化时，不管设备语言是什么，它们都会回落到英文的开发区域。
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        # 按住空格说话：键盘扩展不能录音，App 在后台保持录音会话，替键盘录音识别（App/Services/VoiceSessionService.swift）。会话空闲 5 分钟自动关闭。
        UIBackgroundModes: [audio]
        NSFaceIDUsageDescription: 验证身份以查看打字统计
    sources:
      - path: App/Sources
      - path: App/Services
      - path: KeyboardExtension/Sources
        includes:
          - input/FourteenKeyLayout.swift
          - input/EighteenKeyLayout.swift
      - path: ../../shared/backend
        excludes:
          - Tests/**
          - Package.swift
          - .build/**
          # 只经 SWIFT_INCLUDE_PATHS 引用的模块定义和 C 头文件，不是这个 target 的源文件。
          - rust/**
      - path: ../../shared/backend-ui
      - path: SharedUI
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/LaunchScreen.storyboard
      - path: ../../target/ios/EngineResources/msime-dictionary-manifest.json
        buildPhase: resources
      - path: SharedResources/MLKit-NOTICES.txt
        buildPhase: resources
      - path: SharedResources/MLKit-Dependencies.txt
        buildPhase: resources
      # 通过 Google 登录用的 GoogleSignIn 及其依赖（CocoaPods 生成的 Pods-MSIMEApp 致谢文件，均为 Apache-2.0）。
      - path: SharedResources/GoogleSignIn-Dependencies.txt
        buildPhase: resources
      # Licences of the embedded SherpaOnnxC.xcframework below: sherpa-onnx (Apache-2.0) and the ONNX Runtime linked into it (MIT), plus the notices ONNX Runtime carries for what it bundles, shared with the desktops.
      - path: SharedResources/VoiceRuntime-NOTICES.txt
        buildPhase: resources
      - path: ../linux/data/licenses/onnxruntime-ThirdPartyNotices.txt
        buildPhase: resources
      # The input engine in libmsime_host_api, linked into this app and into the keyboard extension it embeds, carries the Korean Hanja table from libhangul's data/hanja/hanja.txt, whose BSD-3-Clause licence requires the notice in binary distributions.
      - path: ../../resources/licenses/libhangul-hanja-BSD-3-Clause.txt
        buildPhase: resources
      # 语法模型查询逻辑的移植声明随引擎分发，文件末尾附着双数组读取所依的 darts-clone（BSD-2-Clause）条款。
      - path: ../../resources/licenses/librime-octagram-BSD-3-Clause.txt
        buildPhase: resources
      # 引擎的 cxx_sort.rs 逐步复现了 libc++ 的排序算法，源码级翻译要按 Apache-2.0 第 4 条随附许可证（LLVM 例外不覆盖）。
      - path: ../../resources/licenses/libcxx-Apache-2.0-WITH-LLVM-exception.txt
        buildPhase: resources
      # 符号模式按它查命令名的 LaTeX 表是本项目自写的 MIT 数据，编进了引擎，MIT 全文随引擎分发。
      - path: ../../resources/licenses/latex-symbols-MIT.txt
        buildPhase: resources
      # 输入引擎本身（crates/engine、crates/path-trust，源码在本仓库）和它链接的 rink-core（单位换算，源码在 crates.io）是 MPL-2.0，二进制分发要附上许可证全文。
      - path: ../../resources/licenses/MPL-2.0.txt
        buildPhase: resources
      # The same engine's Cantonese and Zhuyin schemes take their syllables and words from data derived from rime-cantonese (CC BY 4.0) and libchewing-data (LGPL-2.1-or-later); their notices travel with every engine build even where those schemes are not offered.
      - path: ../../resources/licenses/rime-cantonese-CC-BY-4.0.txt
        buildPhase: resources
      - path: ../../resources/licenses/libchewing-data-LGPL-2.1.txt
        buildPhase: resources
      # The Stroke scheme's stroke orders come from rime-stroke (LGPL-3.0, with the CNS11643 attribution); its notice travels the same way.
      - path: ../../resources/licenses/rime-stroke-LGPL-3.0.txt
        buildPhase: resources
      # 同一个 Engine 的越南文和藏文方案编入了 vi crate（MIT）和 ewts crate（MIT OR Apache-2.0，按 MIT 使用），它们的许可证全文随每个 Engine 构建分发。
      - path: ../../resources/licenses/vi-MIT.txt
        buildPhase: resources
      - path: ../../resources/licenses/ewts-MIT.txt
        buildPhase: resources
      # 同一个 Engine 编入了拆字反查的部件拼音表，它改编自開放詞典的漢語拆字字典（CC BY 3.0），署名与改动说明随每个 Engine 构建分发。
      - path: ../../resources/licenses/kfcd-chaizi-CC-BY-3.0.txt
        buildPhase: resources
      # 这张表里每个字的读音、名次和繁体字形取自 Unicode 汉字数据库（Unihan 17.0.0），同一个 Engine 编入的符号模式（S 模式）分组表按 Unicode 字符数据库 17.0.0 挑选组员，Unicode License V3 要求随数据附上它的版权与许可声明。
      - path: ../../resources/licenses/Unicode-License-V3.txt
        buildPhase: resources
      # 世界时钟的城市目录和时间计算依赖随 App 分发许可。
      - path: ../../resources/licenses/world-clock-NOTICE.txt
        buildPhase: resources
      # 简繁转换内嵌的 OpenCC 词表许可证随 App 分发。
      - path: ../../resources/licenses/OpenCC-Apache-2.0.txt
        buildPhase: resources
      # 随 App 分发的词库里有 MIT 与 Apache-2.0 的数据，两种许可都要求随副本附上全文：msime-pinyin.db 的单字读音（mozillazg/pinyin-data）、msime-english.db 的中英释义（skywind3000/ECDICT）、msime-others.db 的颜文字（aoguai/rime_kaomoji_dict）与关键词整词读音（mozillazg/python-pinyin）、msime-wubi.db 的 86 码表（KyleBing/rime-wubi86-jidian，Apache-2.0）。
      - path: ../../resources/licenses/pinyin-data-MIT.txt
        buildPhase: resources
      - path: ../../resources/licenses/ECDICT-MIT.txt
        buildPhase: resources
      - path: ../../resources/licenses/rime_kaomoji_dict-MIT.txt
        buildPhase: resources
      - path: ../../resources/licenses/python-pinyin-MIT.txt
        buildPhase: resources
      - path: ../../resources/licenses/rime-wubi86-jidian-Apache-2.0.txt
        buildPhase: resources
      # msime-pinyin.db 与语言词库的 msime-stroke.db 里与 rime-wanxiang 共有的词条和单字，权重改编自 amzxyz/rime-wanxiang（CC BY 4.0），署名、改动说明与许可证全文随 App 分发。
      - path: ../../resources/licenses/rime-wanxiang-CC-BY-4.0.txt
        buildPhase: resources
      # 键盘扩展的 EngineResources 带着桌面词库（msime-pinyin.db、msime-wubi.db、msime-english.db、msime-others.db、msime-bigram.bin、msime-trigram.bin，日文词典按需下载），它们逐个来源的上游、提交与条款写在 msime-dictionary 的 NOTICE.md 里，这是它的副本，另有 msime 一侧加进同一批词库的来源：其中有 msime-bigram.bin 与 msime-trigram.bin 要求的中文维基百科（CC BY-SA 4.0）署名，以及 msime-wubi.db 各份码表的出处。
      - path: ../../resources/licenses/msime-engine-dictionary-NOTICE.md
        buildPhase: resources
      # 水杉输入法本身以 GPL-3.0-only 发布，键盘扩展 EngineResources 里的 msime-pinyin.db 含 rime-ice 的 GPL-3.0 数据；GPL-3.0 第 4、6 条要求随目标代码附上许可证全文，所以仓库根目录的 LICENSE 原样作为 App 资源分发（键盘扩展只随 App 一起安装），关于页列在第一项。Android 以 client-LICENSE.txt、HarmonyOS 以 resfile/licenses/GPL-3.0.txt 分发同一份文件。
      - path: ../../LICENSE
        buildPhase: resources
      - path: SharedResources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios
        PRODUCT_NAME: MSIMEApp
        # 明确声明手机和平板，避免不同版本的 XcodeGen 默认值变化把 iPad 降级成 iPhone 兼容模式；平板设置分栏和键盘形态只有在真实 iPad idiom 下才会运行。
        TARGETED_DEVICE_FAMILY: "1,2"
        # 发布时由 upload-testflight.sh 在命令行传入描述文件名，配合 CODE_SIGN_STYLE=Manual 让 App 与键盘各用各的 App Store 描述文件；本地开发不传，值为空，仍是自动签名。
        PROVISIONING_PROFILE_SPECIFIER: "$(MSIME_IOS_APP_PROFILE)"
        # 出口合规：只用系统提供的 HTTPS 等豁免加密。写进 Info.plist 后上传的构建自带答案，不会停在 App Store Connect 的「缺少合规信息」而无法分发给 TestFlight 测试组（此前每个构建都在网页上手动答「否」）。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/MSIMEApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # 主屏、设置和系统的应用列表都显示这个名字。没有它时 iOS 退回 CFBundleName,也就是 PRODUCT_NAME,装出来的图标底下写的是 MSIMEApp。
        INFOPLIST_KEY_CFBundleDisplayName: 水杉输入法
        # LaunchScreen.storyboard 一直被编进 bundle,但没有这个键就没人指向它,启动屏等于白打包。
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # App 同时支持 iPad（xcodegen 对 iOS 应用默认 TARGETED_DEVICE_FAMILY 为 1,2）。支持 iPad 分屏多任务必须声明全部四个方向，否则 App Store Connect 上传校验以 409 Invalid bundle 拒收（2026-10-02 首次自动上传 TestFlight 时）。iPhone 仍用上面三个方向。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "仅在你开始语音输入时录音：本地模型在本机识别，系统语音识别交由 iOS 处理，其他识别服务会把录音发送到你配置的服务。"
        # 语音服务选「系统语音识别」时由 Speech 框架识别录音，第一次使用前系统按这句话询问授权。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "仅在你选择“系统语音识别”并开始录音时，用 iOS 的语音识别把录音转成文字。"
        # AI 辅助连局域网里的模型服务（如另一台电脑上的 LM Studio）前，系统按这句话询问本地网络权限；连本机回环地址不会询问。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "仅在你把 AI 辅助的接口地址设成局域网里的服务（例如电脑上的 LM Studio）时，用来连接这台设备。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 下面 postBuildScripts 里的发布日期脚本要读 release-date.txt 和 .git，这些读取没法逐个声明成输入；打开沙盒后 git 会被拒绝，「关于」页就一直没有日期。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # VoicePolishPrompt.cpp includes shared/voice/PolishPrompt.h, which the desktop hosts build as C++17.
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconForest AppIconSky AppIconDusk AppIconVermilion
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # 没有这一条时 `Color.accentColor` 是系统蓝,而设置行的图标块、列表里的控件都取它。资源里的两个值就是 MetasequoiaTheme.forestUIColor 的浅色与深色两支。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app embeds SherpaOnnxC.framework (dynamic) in Frameworks/; without this runpath dyld only searches /usr/lib/swift and the app is killed at launch with "Library not loaded: @rpath/SherpaOnnxC.framework".
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # libmsime_host_api.a 必须排在 $(inherited) 和 -lsqlite3 前面：它带着 rusqlite 打包的 SQLite，而 $(inherited) 里有 MLKit pod 带进来的 -l"sqlite3"。排在后面时，用 Xcode 27 的 SDK 链接，62 个 sqlite3_* 全部绑到系统的 /usr/lib/libsqlite3.dylib；rusqlite 0.40 调用的 sqlite3_set_errmsg 在 iOS 27 之前的系统库里没有，App 和键盘扩展在 iOS 18 上一启动就被 dyld 杀掉。ProjectConfigurationTests 检查这个顺序，其余链接主机库的目标同理。
        OTHER_LDFLAGS:
          - "-lmsime_host_api"
          - "$(inherited)"
          - "-lc++"
          - "-lsqlite3"
          - "-framework"
          - Foundation
          - "-framework"
          - UIKit
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: "$(SRCROOT)/../../target/ios/device"
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: "$(SRCROOT)/../../target/ios/simulator"
      configs:
        # Without this the Debug build compiles out every `#if DEBUG` branch, which is where the
        # UI-test fixtures and preview screens live -- the suite then drives an app that cannot
        # show them.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG
    # 把发布日期写进已生成的 Info.plist（MSIMEReleaseDate），「关于」页读它。以 Info.plist 为输入，排在 Info.plist 生成之后、签名之前；日期随提交变化而不随文件变化，所以每次构建都跑。
    postBuildScripts:
      - name: Stamp release date
        script: bash "$SRCROOT/scripts/stamp-release-date.sh"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    dependencies:
      - target: MSIMEKeyboardExtension
      - sdk: Security.framework
      # 本地语音识别的 sherpa-onnx 运行时，只进主 App：键盘扩展的内存上限装不下任何一个模型。
      # 构建前由 scripts/fetch_voice_runtime.py --platform ios 下载校验到 target/，不入库。
      - framework: ../../target/voice-runtime/ios/SherpaOnnxC.xcframework
        embed: true
        codeSign: true
  MSIMEKeyboardExtension:
    type: app-extension
    platform: iOS
    info:
      path: KeyboardExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: 水杉输入法
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 与 App 相同：键盘里的 AI 候选和 AI 面板也会连本机或局域网的 http 模型服务，见 MSIMEApp 的说明。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 仅在你把 AI 辅助的接口地址设成局域网里的服务（例如电脑上的 LM Studio）时，用来连接这台设备。
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    sources:
      - path: KeyboardExtension/Sources
        excludes:
          - keyboard/KeyboardServiceFallback.swift
      - path: App/Services/BoundedFileReader.swift
      - path: SharedUI
      - path: ../../shared/backend/account/BackendAccountClient.swift
      - path: ../../shared/backend/clients/BackendChatClient.swift
      - path: ../../shared/backend/account/BackendAccountSession.swift
      - path: ../../shared/backend/account/BackendAnonymousAccount.swift
      - path: ../../shared/backend/storage/BackendLocalStore.swift
      - path: ../../shared/backend/storage/BackendBoundedFileReader.swift
      - path: ../../shared/backend/clients/BackendSnapshotClient.swift
      # The keyboard's 云端 clipboard tab.
      - path: ../../shared/backend/clients/BackendClipboardClient.swift
      - path: App/Services/KeyboardAIService.swift
      - path: KeyboardExtension/Sources/keyboard/KeyboardServiceFallback.swift
      - path: ../../target/ios/EngineResources
        buildPhase: resources
        type: folder
      # Staged by stage-resources.sh, empty unless offline gloss dictionaries were given to it.
      - path: ../../target/ios/offline-glosses
        buildPhase: resources
        type: folder
        optional: true
      # Staged by stage-resources.sh beside EngineResources, where host-api looks for the Cantonese and Zhuyin dictionaries; empty when none were built or fetched, and those schemes are then not offered.
      - path: ../../target/ios/language-dictionaries
        buildPhase: resources
        type: folder
        optional: true
      # Staged by stage-resources.sh beside EngineResources: the settings app reads 背单词's bundled wordbooks from the wordbooks/ sibling of the EngineResources it finds in the keyboard extension. Empty when none were built.
      - path: ../../target/ios/wordbooks
        buildPhase: resources
        type: folder
        optional: true
      # stage-resources.sh 暂存的内置按键音包（`mode = "keys"` 的那几个，连同各自的 plugin.toml 许可），键盘按选中的音效播放；设置 App 从内嵌的键盘扩展里读同一份来列出音效和试听。
      - path: ../../target/ios/sound-packs
        buildPhase: resources
        type: folder
        optional: true
      # stage-resources.sh 从 resources/rerank-model.lock.json 暂存的两档逐键重排模型（8x448 与 6x256，ONNX Runtime 的 ORT 格式），放在 EngineResources 旁边：host-api 在随包资源目录的兄弟目录里找它们，资源目录本身要与词库锁逐项相符。整句联想「增强」打开时加载，先自测大的、太慢换小的。
      - path: ../../target/ios/rerank-model
        buildPhase: resources
        type: folder
        optional: true
      - path: ../../target/ios/rerank-model-small
        buildPhase: resources
        type: folder
        optional: true
      - path: SharedResources/KeyboardBrand.png
        buildPhase: resources
      # 表情面板的水杉娘表情包：66 张 320px 透明 WebP 和清单，三个手机键盘共用仓库里的同一份。
      - path: ../../resources/stickers
        buildPhase: resources
        type: folder
