  MSIMEKeyboardTestHost:
    type: application
    platform: iOS
    sources:
      - path: KeyboardTestHost
      - path: ../../target/ios/EngineResources
        buildPhase: resources
        type: folder
      # Staged by stage-resources.sh, empty unless offline gloss dictionaries were given to it.
      - path: ../../target/ios/offline-glosses
        buildPhase: resources
        type: folder
        optional: true
      # Staged by stage-resources.sh beside EngineResources, where host-api looks for the Cantonese and Zhuyin dictionaries; empty when none were built or fetched, and those schemes are then not offered.
      - path: ../../target/ios/language-dictionaries
        buildPhase: resources
        type: folder
        optional: true
      # Staged by stage-resources.sh beside EngineResources: the settings app reads 背单词's bundled wordbooks from the wordbooks/ sibling of the EngineResources it finds in the keyboard extension. Empty when none were built.
      - path: ../../target/ios/wordbooks
        buildPhase: resources
        type: folder
        optional: true
      # 同键盘扩展：按键音包的测试经 `msime_client_key_sound_pack` 读这一份。
      - path: ../../target/ios/sound-packs
        buildPhase: resources
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.msime.ios.keyboard-test-host
        PRODUCT_NAME: MSIMEKeyboardTestHost
        # The keyboard under test reads its preferences from the App Group container, so the host
        # that loads it needs the same entitlement the extension ships with -- as the Apple
        # client's test host does. Without it the container is refused and the host is killed
        # partway through the suite, leaving most of it unreported.
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/Resources/MSIMEKeyboardExtension.entitlements
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
