# Depot CI Migration
# Source: .github/workflows/pr-triage.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Pull request triage

# Labels, title check and size for every pull request, forks included.
#
# pull_request_target runs with a write token so that fork pull requests can be labelled, and in exchange it must never check out or execute the pull request's code. None of these jobs checks anything out: the labeler reads .github/labeler.yml from the base branch through the API, and the title only ever reaches a script through the environment, never through ${{ }} interpolation.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  paths:
    name: Path labels
    # The title-only "edited" event cannot change which files the pull request touches.
    if: github.event.action != 'edited'
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Leave labels a maintainer added by hand alone; "documentation" in particular is also set from a docs: title.
          sync-labels: false

  title:
    name: Conventional title
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            // Squash merges use the pull request title as the commit subject, so the title is what lands in develop's history and in the release-please changelog.
            const marker = '<!-- pr-triage:title -->';
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\s]+\))?(!)?: \S/;
            const typeLabels = { feat: 'enhancement', fix: 'bug' };
            const title = process.env.TITLE;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            const match = pattern.exec(title);

            if (!match) {
              const body = [
                marker,
                '这个 PR 的标题不符合 Conventional Commits 格式。squash 合并时标题会原样成为提交信息，并进入 release-please 生成的更新日志，请改成 `type(scope): 摘要` 的形式，例如：',
                '',
                '- `fix(linux): 修复候选窗在多显示器下的定位`',
                '- `feat(android): 支持手写输入切换`',
                '- `docs: 补充本地构建说明`',
                '',
                '可用的 type：`feat` `fix` `docs` `style` `refactor` `perf` `test` `build` `ci` `chore` `revert`。破坏性改动在冒号前加 `!`。改好标题后这条评论会自动删除。',
              ].join('\n');
              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
              core.setFailed(`Title is not a Conventional Commit: ${title}`);
              return;
            }

            if (previous) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: previous.id });
            }

            // Keep exactly one type label in step with the title, so retitling feat -> fix does not leave "enhancement" behind. "breaking" follows the "!" marker the same way.
            const current = new Set(context.payload.pull_request.labels.map((l) => l.name));
            const wanted = new Set();
            if (typeLabels[match[1]]) wanted.add(typeLabels[match[1]]);
            if (match[3]) wanted.add('breaking');
            const managed = [...Object.values(typeLabels), 'breaking'];
            for (const name of managed) {
              if (current.has(name) && !wanted.has(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
              }
            }
            const add = [...wanted].filter((name) => !current.has(name));
            if (add.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: add });
            }

  size:
    name: Size label
    if: github.event.action != 'edited'
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Lock files and generated snapshots are left out of the count: a one-line dependency bump that rewrites Cargo.lock is still a small review.
            const ignored = [/(^|\/)Cargo\.lock$/, /(^|\/)pnpm-lock\.yaml$/, /(^|\/)oh-package-lock\.json5$/, /\.snap$/];
            const sizes = [['size/XS', 10], ['size/S', 100], ['size/M', 500], ['size/L', 1000], ['size/XL', Infinity]];
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const changed = files
              .filter((f) => !ignored.some((re) => re.test(f.filename)))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const label = sizes.find(([, limit]) => changed < limit)[0];
            core.info(`${changed} changed lines -> ${label}`);

            const current = context.payload.pull_request.labels.map((l) => l.name);
            for (const name of current.filter((n) => n.startsWith('size/') && n !== label)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name });
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [label] });
            }
