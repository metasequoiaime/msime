name: ONNX Runtime minimal (Windows)

# 按键重排后端链接的精简版 ONNX Runtime，Windows 的两种架构要用 MSVC 编，只能在 Windows 上编；其余平台在 macOS 与 Linux 容器里用 tools/onnxruntime-minimal/build.sh 编（见同目录 README）。改了算子清单或构建方式的 Pull Request 上自动跑，产物作为构建附件上传，由维护者核对后发布并写进 resources/onnxruntime-minimal.lock.json。它不发布任何东西。
on:
  pull_request:
    paths:
      - tools/onnxruntime-minimal/**
      - .github/workflows/onnxruntime-minimal.yml
  workflow_dispatch:

concurrency:
  group: onnxruntime-minimal-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            extra: ""
          - arch: arm64
            extra: "--arm64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch ONNX Runtime 1.24.4
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch v1.24.4 https://github.com/microsoft/onnxruntime.git "$env:RUNNER_TEMP\onnxruntime"
          $commit = git -C "$env:RUNNER_TEMP\onnxruntime" rev-parse HEAD
          # 与 README 写的提交对得上才编：标签被改过就停下。
          if ($commit -ne '2d924974ef147392ced8409d36bd6d2e7fcc8a74') { throw "v1.24.4 resolved to $commit" }
      - name: Build
        shell: pwsh
        env:
          ARCH_FLAGS: ${{ matrix.extra }}
        run: |
          python -m pip install --quiet flatbuffers
          $config = "$env:GITHUB_WORKSPACE\tools\onnxruntime-minimal\required_operators_and_types.config"
          $build = "$env:RUNNER_TEMP\build"
          $arguments = @('tools\ci_build\build.py', '--build_dir', $build, '--config', 'MinSizeRel', '--update', '--build', '--parallel',
            '--minimal_build', '--disable_ml_ops', '--disable_rtti', '--disable_exceptions', '--skip_tests',
            '--include_ops_by_config', $config, '--enable_reduced_operator_type_support',
            '--cmake_generator', 'Visual Studio 17 2022',
            '--cmake_extra_defines', 'CMAKE_POLICY_VERSION_MINIMUM=3.5', 'onnxruntime_BUILD_UNIT_TESTS=OFF')
          if ($env:ARCH_FLAGS) { $arguments += $env:ARCH_FLAGS }
          Push-Location "$env:RUNNER_TEMP\onnxruntime"
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "build.py failed with exit code $LASTEXITCODE" }
          Pop-Location
      - name: Merge into onnxruntime.lib
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $lib = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\lib.exe' | Select-Object -First 1
          if (-not $lib) { throw 'lib.exe not found' }
          $libraries = Get-ChildItem "$env:RUNNER_TEMP\build\MinSizeRel" -Recurse -Filter *.lib |
            Where-Object { $_.FullName -notmatch 'test|gtest|gmock|benchmark' } | ForEach-Object { $_.FullName }
          $out = "$env:RUNNER_TEMP\out\windows-$env:ARCH"
          New-Item -ItemType Directory -Force $out | Out-Null
          & $lib /NOLOGO "/OUT:$out\onnxruntime.lib" @libraries
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed with exit code $LASTEXITCODE" }
          python -c "import gzip, shutil, sys; f = gzip.GzipFile(sys.argv[1] + '.gz', 'wb', 9, mtime=0); shutil.copyfileobj(open(sys.argv[1], 'rb'), f); f.close()" "$out\onnxruntime.lib"
          Get-ChildItem $out | Format-Table Name, Length
          Get-FileHash -Algorithm SHA256 "$out\*" | Format-Table Hash, Path
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onnxruntime-minimal-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/windows-${{ matrix.arch }}/
          if-no-files-found: error
