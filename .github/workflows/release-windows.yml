name: Release Windows
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/windows/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the installer as a windows-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
      signpath_test: {description: Sign with the SignPath test-signing policy (untrusted test certificate) to exercise the signing jobs; such a run never publishes, required: false, default: false, type: boolean}
permissions: {contents: write}
# 签名测试不发布，单独一个并发组，不让它排在真正的发布前面。
concurrency: {group: "release-windows${{ inputs.signpath_test && '-signpath-test' || '' }}", cancel-in-progress: false}
jobs:
  # Resolves the dispatched commit up front, so every edition, the coexistence check and the publish job (tag target, release notes) use the same source even if the branch moves during the run.
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        shell: pwsh
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          # Build-Client.ps1 stamps this into the Tauri and Server metadata, which take three numeric components only.
          $v = if ($env:REQUESTED) {$env:REQUESTED.Trim()} else {(Get-Content platforms/windows/version.txt -Raw).Trim()}; if ($v -notmatch '^\d+\.\d+\.\d+$') {throw 'invalid version'}; "value=$v" >> $env:GITHUB_OUTPUT
          # The release tag and title carry the branch the run was dispatched from: none on main, -beta on develop, -alpha anywhere else. A suffixed release is always published as a prerelease, which the in-app update checks skip.
          $suffix = switch ($env:GITHUB_REF_NAME) {'main' {''} 'develop' {'-beta'} default {'-alpha'}}; "release=$v$suffix" >> $env:GITHUB_OUTPUT
      # SignPath 签名由本仓库的变量 WINDOWS_SIGNING_PROVIDER=signpath 打开；它不能建在组织级，否则别的仓库会一起打开。打开时其余配置缺一项就失败，不悄悄退回未签名；不设置时照旧发未签名安装包。只签 main 的正式版和 develop 的 beta：其他分支的 -alpha 是试验构建，不占用签名和审批，照旧不签名。
      # 输入 signpath_test 不看这个开关，在任何分支上用 test-signing 策略走一遍签名任务：测试证书不受系统信任，策略不需要审批，所以这种运行从不发布（publish 任务被跳过），只用来验证签名链路。签名流程见 docs/code-signing-policy.md。
      - id: signing
        env: {PROVIDER: "${{ vars.WINDOWS_SIGNING_PROVIDER }}", TEST: "${{ inputs.signpath_test }}", TOKEN_SET: "${{ secrets.SIGNPATH_TOKEN != '' }}", ORGANIZATION: "${{ vars.SIGNPATH_ORGANIZATION_ID }}", PROJECT: "${{ vars.SIGNPATH_PROJECT_SLUG }}", POLICY: "${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}"}
        run: |
          require() {
            missing=()
            [[ "$TOKEN_SET" == true ]] || missing+=(secrets.SIGNPATH_TOKEN)
            [[ -n "$ORGANIZATION" ]] || missing+=(vars.SIGNPATH_ORGANIZATION_ID)
            [[ -n "$PROJECT" ]] || missing+=(vars.SIGNPATH_PROJECT_SLUG)
            for name in "$@"; do missing+=("$name"); done
            if (( ${#missing[@]} )); then echo "::error::SignPath 签名缺少配置：${missing[*]}"; exit 1; fi
          }
          if [[ "$TEST" == true ]]; then
            require
            echo 'signpath=true' >> "$GITHUB_OUTPUT"
            echo 'policy=test-signing' >> "$GITHUB_OUTPUT"
            echo '::notice::signpath_test：用 SignPath test-signing 策略签名，安装包带不受信任的测试证书，本次运行不发布。'
            exit 0
          fi
          case "$PROVIDER" in
            '')
              echo 'signpath=false' >> "$GITHUB_OUTPUT"
              echo '::notice::WINDOWS_SIGNING_PROVIDER 未设置，本次发布未签名的安装包。' ;;
            signpath)
              if [[ -n "$POLICY" ]]; then require; else require vars.SIGNPATH_SIGNING_POLICY_SLUG; fi
              if [[ "$GITHUB_REF_NAME" != main && "$GITHUB_REF_NAME" != develop ]]; then
                echo 'signpath=false' >> "$GITHUB_OUTPUT"
                echo "::notice::$GITHUB_REF_NAME 不是 main 或 develop，本次发布未签名的 -alpha 安装包。"
              else
                echo 'signpath=true' >> "$GITHUB_OUTPUT"
                echo "policy=$POLICY" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "::error::未知的 WINDOWS_SIGNING_PROVIDER：$PROVIDER（只能是 signpath，或者不设置）"; exit 1 ;;
          esac
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
      policy: ${{ steps.signing.outputs.policy }}
      signpath: ${{ steps.signing.outputs.signpath }}
  # The Rust half of the client (host DLLs, MCP server, Tauri panel shell) does not depend on the edition, so it is built once per architecture here, in parallel, rather than six times over in every edition's job, where it was most of the build time.
  rust:
    needs: source
    # SignPath 的开源项目只接受签名请求之前的每个 job 都跑在 GitHub 托管 runner 上，所以签名时 rust、release、package 都换到 windows-2025（4 核，超时放宽）；不签名时留在 Depot 上。
    runs-on: ${{ needs.source.outputs.signpath == 'true' && 'windows-2025' || 'depot-windows-2025-8' }}
    timeout-minutes: ${{ needs.source.outputs.signpath == 'true' && 120 || 60 }}
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, x86, arm64]
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      # GitHub 托管 runner 没有 Depot Cache，sccache 改用 GitHub Actions 缓存。
      SCCACHE_GHA_ENABLED: ${{ needs.source.outputs.signpath == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      # Depot runners start with SCCACHE_WEBDAV_ENDPOINT pointing at Depot Cache, so with RUSTC_WRAPPER in the job env rustc output is cached across runs without a token. CARGO_INCREMENTAL=0 because sccache does not cache incremental compilation.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - if: matrix.arch == 'x64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24}
      # Reads the pnpm version from packageManager in package.json.
      - if: matrix.arch == 'x64'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Build the Rust half
        shell: pwsh
        env: {VERSION: "${{ needs.source.outputs.version }}", ARCH: "${{ matrix.arch }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          # rust-toolchain.toml pins the compiler; adding the target from the repository root installs that toolchain first.
          $triple = switch ($env:ARCH) { 'x64' { 'x86_64-pc-windows-msvc' } 'x86' { 'i686-pc-windows-msvc' } 'arm64' { 'aarch64-pc-windows-msvc' } }
          rustup target add $triple
          if ($LASTEXITCODE -ne 0) { throw 'rustup target add failed' }
          if ($env:ARCH -eq 'arm64' -and -not (Get-Command clang -ErrorAction SilentlyContinue)) {
            # ring, in the ARM64 host, compiles its ARM64 assembly with clang only.
            $clang = @(& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\Llvm\x64\bin\clang.exe')
            if ($clang.Count -lt 1) { throw 'no clang on PATH or in the Visual Studio installation' }
            $env:PATH = "$(Split-Path -Parent $clang[0]);$env:PATH"
          }
          ./platforms/windows/Build-RustOutputs.ps1 -Architecture $env:ARCH -OutputDirectory (Join-Path $env:RUNNER_TEMP 'msime-rust') -TargetVersion $env:VERSION
          Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "msime-rust/$env:ARCH") | Format-Table Name, Length
      # Not msime-windows-*: the coexistence and publish jobs download that pattern as the installers.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-rust-windows-${{ matrix.arch }}-${{ needs.source.outputs.version }}
          path: ${{ runner.temp }}/msime-rust/
          if-no-files-found: error
  # 每个版本（shared/contracts/editions.json 里有 Windows 段的 id）各打一个安装包，可以同时安装，也可以和 msime-windows 同时安装。full 的安装包名、AppId、目录和注册表键也是自己的，不再是 msime-windows 的那一组。
  release:
    needs: [source, rust]
    runs-on: ${{ needs.source.outputs.signpath == 'true' && 'windows-2025' || 'depot-windows-2025-8' }}
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        edition: [full, wubi, pinyin, japanese, vietnamese, tibetan]
    env:
      VCPKG_DISABLE_METRICS: '1'
      # Python on Windows otherwise decodes text as the ANSI code page, and the fetch and packaging scripts read UTF-8 sources.
      PYTHONUTF8: '1'
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
      SCCACHE_GHA_ENABLED: ${{ needs.source.outputs.signpath == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - id: version
        shell: pwsh
        env: {VERSION: "${{ needs.source.outputs.version }}", RELEASE: "${{ needs.source.outputs.release }}"}
        run: |
          "value=$env:VERSION" >> $env:GITHUB_OUTPUT
          "release=$env:RELEASE" >> $env:GITHUB_OUTPUT
          $baseline = (Get-Content platforms/windows/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'; "vcpkg-baseline=$baseline" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24}
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Each architecture's Rust outputs land in msime-rust/<arch>, the layout Build-Client.ps1 -RustOutputs reads.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-rust-windows-*-${{ needs.source.outputs.version }}
          path: ${{ runner.temp }}/msime-rust
          merge-multiple: true
      - name: Fetch offline candidate glosses and language dictionaries
        # bash 在第一条失败的命令处停下，多行的 pwsh 步骤只报告最后一条的结果。粤拼和注音词库要等 resources/language-dictionaries.lock.json 锁定发布版本后才下载。落定重排模型和手写模型不进安装包，由设置应用按需下载。
        shell: bash
        run: |
          python scripts/fetch_offline_glosses.py
          python scripts/fetch_language_dictionaries.py
      # Build-Client.ps1 takes installed dependency prefixes rather than a vcpkg toolchain, so the manifest is installed into one prefix per architecture: x64 for the Server, Watchdog and 64-bit TSF DLL, x86 for the 32-bit TSF DLL.
      # Restore and save separately so a run that fails after this point still keeps the installed dependencies for the retry.
      - id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msime-deps
          key: windows-deps-${{ hashFiles('platforms/windows/vcpkg.json') }}-${{ steps.version.outputs.vcpkg-baseline }}
      - name: Install native dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env: {BASELINE: "${{ steps.version.outputs.vcpkg-baseline }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          git -C $vcpkg checkout --quiet $env:BASELINE
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline checkout failed' }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          foreach ($triplet in @('x64-windows', 'x86-windows')) {
            & (Join-Path $vcpkg 'vcpkg.exe') install --triplet $triplet --x-manifest-root=platforms/windows "--x-install-root=$(Join-Path $env:RUNNER_TEMP "msime-deps/$triplet")"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed for $triplet" }
          }
      - if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msime-deps
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Download desktop resources
        shell: pwsh
        run: |
          # Fetches and verifies the files resources/desktop-dictionary.lock.json pins; prints the directory holding them.
          $resources = cargo run --quiet --locked -p msime-client-core --example install_resources -- (Join-Path $env:RUNNER_TEMP 'desktop-resources')
          if ($LASTEXITCODE -ne 0) { throw 'desktop resource download failed' }
          "MSIME_DESKTOP_RESOURCES=$(@($resources)[-1].Trim())" >> $env:GITHUB_ENV
      - name: Build Windows client
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'msime-deps'
          # Build-Client.ps1 defaults to the Visual Studio 2022 generator; the runner image moves between Visual Studio releases, so name the one it has.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $major = ([version](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion)).Major
          # vswhere reports the product line as the major version from Visual Studio 2026 on, so take the full generator name from CMake's own list.
          $generator = @(cmake --help | Select-String -Pattern "Visual Studio $major \d{4}" -AllMatches | ForEach-Object { $_.Matches.Value } | Select-Object -Unique)
          if ($generator.Count -ne 1) { throw "no single CMake generator for Visual Studio $major" }
          $generator = $generator[0]
          Write-Output "CMake generator: $generator"
          # Build-Client.ps1 builds the WinUI 3 settings project with msbuild, which a Developer PowerShell has on PATH and the runner's plain pwsh does not; take it from the same Visual Studio installation.
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe')
          if ($msbuild.Count -lt 1) { throw 'no MSBuild in the Visual Studio installation' }
          $env:PATH = "$(Split-Path -Parent $msbuild[0]);$env:PATH"
          Write-Output "MSBuild: $($msbuild[0])"
          # Every edition but full renames the host DLL and makes its import library with lib.exe (Build-Client.ps1), which a Developer PowerShell also has on PATH and the plain pwsh does not; without it those five editions fail with "The term 'lib' is not recognized" (run 37274616998). The x64-hosted lib.exe writes the X86 import library as well, given /MACHINE:X86.
          $lib = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\lib.exe')
          if ($lib.Count -lt 1) { throw 'no lib.exe in the Visual Studio installation' }
          $env:PATH = "$(Split-Path -Parent $lib[-1]);$env:PATH"
          Write-Output "lib: $($lib[-1])"
          # The Arm64X TIP links an ARM64 and an ARM64EC pass (Build-Client.ps1). Require both tool sets up front rather than fail deep into the build.
          foreach ($component in 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64EC') {
            if (-not (& $vswhere -latest -products * -requires $component -property installationPath)) { throw "Visual Studio lacks $component" }
          }
          # The Rust half comes from the rust job; nothing is compiled by cargo or pnpm here.
          ./platforms/windows/Build-Client.ps1 -X64Dependencies (Join-Path $deps 'x64-windows/x64-windows') -X86Dependencies (Join-Path $deps 'x86-windows/x86-windows') -TargetVersion $env:VERSION -Generator $generator -Edition $env:EDITION -RustOutputs (Join-Path $env:RUNNER_TEMP 'msime-rust')
      - name: Collect third-party notices
        shell: pwsh
        env: {EDITION: "${{ matrix.edition }}"}
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'msime-deps'
          # The Rust crates linked into the host DLL, the MCP server and the settings binary, and the npm packages bundled into its frontend, carry notices the vcpkg prefixes do not. Run on this runner, cargo resolves the Windows dependency graph.
          $supplemental = Join-Path $env:RUNNER_TEMP 'msime-supplemental-notices'
          $rust = Join-Path $supplemental 'rust-crates-NOTICES.txt'
          $frontend = Join-Path $supplemental 'frontend-npm-NOTICES.txt'
          python -X utf8 platforms/linux/collect-notices.py cargo $rust msime-host-api msime-engine msime-mcp-server msime-desktop:tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Rust crate notice collection failed' }
          # The npm collector reads the installed node_modules, which the rust job, not this one, installed.
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          python -X utf8 platforms/linux/collect-notices.py npm $frontend apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'npm notice collection failed' }
          # An empty dependency graph still produces a non-empty file (title plus "0 packages"), which Collect-Notices.ps1 would accept, so require at least one package and log the counts as release evidence.
          foreach ($notice in $rust, $frontend) {
            $count = [regex]::Match((Get-Content -LiteralPath $notice -TotalCount 4) -join "`n", '(?m)^(\d+) packages\.').Groups[1].Value
            if (-not $count -or [int]$count -eq 0) { throw "No packages collected into $notice" }
            Write-Output "$([IO.Path]::GetFileName($notice)): $count packages"
          }
          ./platforms/windows/Collect-Notices.ps1 -DependencyPrefixes (Join-Path $deps 'x64-windows/x64-windows'), (Join-Path $deps 'x86-windows/x86-windows') -SupplementalNotices $rust, $frontend -Edition $env:EDITION
      - name: Stage package files
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        # The same arguments Package-SimplySign.ps1 passes.
        run: >-
          ./platforms/windows/installer/Prepare-PackageFiles.ps1 -TargetVersion $env:VERSION
          -Edition $env:EDITION
          -NoticesDirectory target/windows-notices
          -DesktopResourcesDirectory $env:MSIME_DESKTOP_RESOURCES
          -ServerReleaseDirectory target/windows-$env:EDITION/x64/bin
          -Tsf32ReleaseDirectory target/windows-$env:EDITION/x86/bin
          -Tsf64ReleaseDirectory target/windows-$env:EDITION/x64/bin
          -TsfArm64ReleaseDirectory target/windows-$env:EDITION/arm64/bin
          -DesktopExecutable target/windows-$env:EDITION/x64/bin/msime-client-settings.exe
      # 安装包不带 PDB（msime_setup.iss），这次构建的符号作为单独的发布资产放在安装包旁边，收集逻辑和布局见 Collect-Symbols.ps1。SignPath 签名不改动 PE 的调试目录，签名前收集的符号照样对得上签名后的二进制。不经 SignPath 签名时，维护者用 Package-SimplySign.ps1 打出签名安装包，同一脚本会写出对应的符号包，连同安装包一起替换到发布上。
      - name: Collect debug symbols
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          ./platforms/windows/installer/Collect-Symbols.ps1 -Edition $env:EDITION -Version $env:VERSION -OutputDirectory dist-symbols
          Get-ChildItem dist-symbols | Format-Table Name, Length
      # 单独的产物，名字不匹配下面的 msime-windows-* 模式，所以 coexistence 任务不会下载符号；publish 两个都取。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-symbols-windows-${{ matrix.edition }}-${{ steps.version.outputs.value }}
          path: dist-symbols/
          if-no-files-found: error
      # 本项目自己的二进制按版本放进 <edition>/ 目录，由 sign-payload 把六个版本合成一次签名请求，一次发版只需批准两次（这一次和安装包那一次）。认定规则见 SignPath-PackageBinaries.ps1。
      - name: Stage first-party binaries for SignPath
        if: needs.source.outputs.signpath == 'true'
        shell: pwsh
        env: {EDITION: "${{ matrix.edition }}"}
        run: ./platforms/windows/installer/SignPath-PackageBinaries.ps1 -Mode Stage -Edition $env:EDITION -Directory (Join-Path $env:RUNNER_TEMP 'signpath-payload')
      - if: needs.source.outputs.signpath == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-signpath-payload-windows-${{ matrix.edition }}-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/signpath-payload/
          if-no-files-found: error
      # 暂存包交给 package 任务编译安装包：签名要等这个任务结束、六个版本一起提交，所以编译不能留在这里。上传的是 .gitignore 列出的那些暂存内容，加上 msime_setup.iss：Prepare-PackageFiles.ps1 把版本号就地写进了这个受版本控制的文件，package 任务检出的那份还是 0.0.1，不带上它编出的安装包名和版本资源都是 0.0.1。安装包不收 PDB 和 .ilk（msime_setup.iss），符号已经进了上面的符号包，这里不再传。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-staged-windows-${{ matrix.edition }}-${{ steps.version.outputs.value }}
          path: |
            platforms/windows/installer/server_exe/
            platforms/windows/installer/tsf_dll/
            platforms/windows/installer/app_data/
            platforms/windows/installer/MetasequoiaIME.ico
            platforms/windows/installer/THIRD_PARTY_NOTICES.txt
            platforms/windows/installer/LICENSE.txt
            platforms/windows/installer/msime_setup.iss
            !platforms/windows/installer/**/*.pdb
            !platforms/windows/installer/**/*.ilk
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
  # 六个版本的本项目二进制合成一次 SignPath 签名请求。SignPath Foundation 的发布签名每个请求都要人工批准，这个任务会一直等到批准或超时。
  sign-payload:
    needs: [source, release]
    if: needs.source.outputs.signpath == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # SignPath 的 action 用 GITHUB_TOKEN 读取本任务的信息并下载要签的 artifact。
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-signpath-payload-windows-*-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/signpath-payload
          merge-multiple: true
      - id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-signpath-request-payload-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/signpath-payload/
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ needs.source.outputs.policy }}
          artifact-configuration-slug: msime-payload
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4800
          output-artifact-directory: ${{ runner.temp }}/signpath-payload-signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-signed-payload-windows-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/signpath-payload-signed/
          if-no-files-found: error
  # 签名时先把签好的二进制放回暂存包，再编译安装包；不签名时 sign-payload 被跳过，这里直接编译。!failure() 让被跳过的 sign-payload 不连带跳过本任务。
  package:
    needs: [source, release, sign-payload]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ${{ needs.source.outputs.signpath == 'true' && 'windows-2025' || 'depot-windows-2025-8' }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        edition: [full, wubi, pinyin, japanese, vietnamese, tibetan]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msime-staged-windows-${{ matrix.edition }}-${{ needs.release.outputs.version }}
          path: platforms/windows/installer
      - if: needs.source.outputs.signpath == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msime-signed-payload-windows-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/signpath-payload-signed
      - name: Put the signed binaries back
        if: needs.source.outputs.signpath == 'true'
        shell: pwsh
        env: {EDITION: "${{ matrix.edition }}", POLICY: "${{ needs.source.outputs.policy }}"}
        # test-signing 的测试证书链不到受信任的根，见脚本里 -TestCertificate 的说明。
        run: ./platforms/windows/installer/SignPath-PackageBinaries.ps1 -Mode Restore -Edition $env:EDITION -Directory (Join-Path $env:RUNNER_TEMP 'signpath-payload-signed') -TestCertificate:($env:POLICY -eq 'test-signing')
      - name: Compile installer
        shell: pwsh
        env: {VERSION: "${{ needs.release.outputs.version }}", EDITION: "${{ matrix.edition }}"}
        # 安装包本身在 sign-installers 里签名；不签名时它就是发布出去的那一份，维护者可以用 installer/Package-SimplySign.ps1 在本地打出签名版替换。
        run: |
          $ErrorActionPreference = 'Stop'
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path -LiteralPath "$inno\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          # msime_setup.iss uses compiler:Languages\ChineseSimplified.isl, which is a user-contributed translation that the Inno Setup installer does not ship; take it from the is-6_7_1 tag.
          $isl = "$inno\Languages\ChineseSimplified.isl"
          if (-not (Test-Path -LiteralPath $isl)) {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/cfdf48923178df4b4f040e038b423aa555a61ffc/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $isl
            if ((Get-FileHash -LiteralPath $isl -Algorithm SHA256).Hash -ne '7D544B9BB1D142CFA11F2E5D3CC8ABE2E55F8E066C5124E3772675AA236E1278') { throw 'ChineseSimplified.isl digest mismatch' }
          }
          ./platforms/windows/installer/Compile-Installer.ps1 -Edition $env:EDITION
          # 安装包名前缀按版本取（full 是 MetasequoiaIME-Full_Setup，五笔版是 MetasequoiaIME-Wubi_Setup），与更新检查认的名字一致。
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'edition installer name lookup failed' }
          $installer = "platforms/windows/installer/Output/${base}_v$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "installer missing: $installer" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $installer -Destination dist/
          $name = Split-Path -Leaf $installer
          $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "dist/$name.sha256"), "$hash  $name`n")
          Get-ChildItem dist | Format-Table Name, Length
      # 签名时这一份还要交给 sign-installers，名字不能匹配下游取安装包用的 msime-windows-* 模式；不签名时它就是最终的安装包。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.source.outputs.signpath == 'true' && 'msime-unsigned-installer-windows' || 'msime-windows' }}-${{ matrix.edition }}-${{ needs.release.outputs.version }}
          path: dist/
          if-no-files-found: error
      # The runner is a disposable elevated Windows machine, so install the built package on it and uninstall it again before anything is published. The artifact is uploaded first so a failing package can still be inspected.
      - name: Install and uninstall the package
        shell: pwsh
        env: {VERSION: "${{ needs.release.outputs.version }}", EDITION: "${{ matrix.edition }}"}
        run: |
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'edition installer name lookup failed' }
          ./platforms/windows/installer/tests/install-smoke.ps1 -Installer "dist/${base}_v$env:VERSION.exe" -Edition $env:EDITION
  # 六个版本的安装包合成一次 SignPath 签名请求，签好后重算 .sha256，作为一个 msime-windows-signed-<版本> 产物交给下游：它匹配 msime-windows-* 模式，coexistence 和 publish 不用区分签没签名。
  sign-installers:
    needs: [source, release, package]
    if: ${{ !cancelled() && !failure() && needs.source.outputs.signpath == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-unsigned-installer-windows-*-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/installers
          merge-multiple: true
      - id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-signpath-request-installers-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/installers/*.exe
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ needs.source.outputs.policy }}
          artifact-configuration-slug: msime-installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 4800
          output-artifact-directory: ${{ runner.temp }}/installers-signed
      - name: Check the signatures and record the digests
        shell: pwsh
        env: {POLICY: "${{ needs.source.outputs.policy }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          $unsigned = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'installers') -File -Filter '*.exe')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($installer in $unsigned) {
            $signed = Join-Path $env:RUNNER_TEMP "installers-signed/$($installer.Name)"
            if (-not (Test-Path -LiteralPath $signed -PathType Leaf)) { throw "SignPath 没有返回 $($installer.Name)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $signed
            # test-signing 的测试证书链不到受信任的根，只要求确实带签名，见 SignPath-PackageBinaries.ps1 的 -TestCertificate。
            $accepted = $signature.Status -eq 'Valid' -or ($env:POLICY -eq 'test-signing' -and $signature.Status -eq 'UnknownError' -and $null -ne $signature.SignerCertificate)
            if (-not $accepted) { throw "SignPath 返回的 $($installer.Name) 签名状态是 $($signature.Status)：$($signature.StatusMessage)" }
            Copy-Item -LiteralPath $signed -Destination dist/
            $hash = (Get-FileHash -LiteralPath "dist/$($installer.Name)" -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText((Join-Path $PWD "dist/$($installer.Name).sha256"), "$hash  $($installer.Name)`n")
            Write-Output "$($installer.Name) 已签名：$($signature.SignerCertificate.Subject)"
          }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-windows-signed-${{ needs.release.outputs.version }}
          path: dist/
          if-no-files-found: error
  # 几个版本的安装包装在同一台机器上：各自的 TIP、COM 注册、HKLM 键、看门狗任务和数据目录同时存在，卸掉一个版本不碰 full；机器上还伪造了一份 msime-windows 的注册表键和数据目录，没有哪个版本接管或删除它。runner 是一次性的管理员环境。
  coexistence:
    needs: [source, release, package, sign-installers]
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-windows-*-${{ needs.release.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Install the editions side by side
        shell: pwsh
        env: {VERSION: "${{ needs.release.outputs.version }}"}
        run: |
          $installers = @{}
          foreach ($edition in (python platforms/windows/scripts/edition_windows.py editions).Trim().Split(',')) {
            $base = (python platforms/windows/scripts/edition_windows.py field --edition $edition installer_base_name).Trim()
            $installers[$edition] = "dist/${base}_v$env:VERSION.exe"
          }
          ./platforms/windows/installer/tests/coexistence-smoke.ps1 -Installers $installers
  # 同一个安装包装在 Windows on Arm 上：装的是 Arm64X TIP 和 ARM64 宿主，原生 ARM64 进程和模拟的 x64 进程都能经 COM 注册创建 TIP，卸载照样干净。
  arm64:
    needs: [source, release, package, sign-installers]
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        edition: [full, wubi, pinyin, japanese, vietnamese, tibetan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      # 签名时六个安装包在同一个 msime-windows-signed-<版本> 产物里，每个任务取整份、只装自己那个。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msime-windows-${{ needs.source.outputs.signpath == 'true' && 'signed' || matrix.edition }}-${{ needs.release.outputs.version }}
          path: dist
      - name: Install and uninstall the package
        shell: pwsh
        env: {VERSION: "${{ needs.release.outputs.version }}", EDITION: "${{ matrix.edition }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows on Arm has no x64 PowerShell, and the runner's pwsh is ARM64; an x64 one, run emulated, creates the TIP from an x64 process.
          $zip = Join-Path $env:RUNNER_TEMP 'pwsh-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne '02FE458BE20493FBDF43F61EA20610B811EE6C738AB1676C61B9CFCD1A33C860') { throw 'PowerShell x64 digest mismatch' }
          $pwshX64 = Join-Path $env:RUNNER_TEMP 'pwsh-x64'
          Expand-Archive -LiteralPath $zip -DestinationPath $pwshX64 -Force
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'edition installer name lookup failed' }
          ./platforms/windows/installer/tests/install-smoke.ps1 -Installer "dist/${base}_v$env:VERSION.exe" -Edition $env:EDITION -X64PowerShell (Join-Path $pwshX64 'pwsh.exe')
  publish:
    needs: [source, release, coexistence, arm64]
    if: ${{ inputs.publish && !inputs.signpath_test && !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-windows-*-${{ needs.release.outputs.version }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-symbols-windows-*-${{ needs.release.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Publish independent Windows release
        shell: bash
        # RELEASE_PUBLISH_TOKEN (org secret, a fine-grained token with Contents and Workflows write) creates the tag: GitHub refuses GITHUB_TOKEN a new ref whose .github/workflows differs from the default branch, which is the case whenever develop takes a workflow change while the release builds (Release Linux run 37259338700, 403 Resource not accessible by integration). Without the secret, as on a fork, it falls back to GITHUB_TOKEN.
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ needs.release.outputs.version }}", RELEASE: "${{ needs.release.outputs.release }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          tag="windows-v${RELEASE}"
          [[ "$RELEASE" == "$VERSION" ]] || export PRERELEASE=true
          # A re-run for the same version overwrites its release (scripts/publish-release.sh), so the notes start at the release before it rather than at its own tag. A final release starts at the previous final release, a -beta or -alpha one at the latest release of either kind.
          stable='^windows-v[0-9]+\.[0-9]+\.[0-9]+$'; [[ "$RELEASE" == "$VERSION" ]] || stable=.
          start=$(git tag --list 'windows-v*' --sort=-v:refname | grep -vxF "$tag" | grep -E "$stable" | head -1 || true)
          python3 scripts/generate-release-notes.py --platform windows --version "$RELEASE" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output release-notes.md
          bash scripts/publish-release.sh "$tag" "$(git rev-parse HEAD)" "Windows ${RELEASE}" release-notes.md dist/*
