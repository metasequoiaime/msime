name: Release Windows
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/windows/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the installer as a windows-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
permissions: {contents: write}
concurrency: {group: release-windows, cancel-in-progress: false}
jobs:
  # Resolves the dispatched commit up front, so every edition, the coexistence check and the publish job (tag target, release notes) use the same source even if the branch moves during the run.
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
  # 每个版本（shared/contracts/editions.json 里有 Windows 段的 id）各打一个安装包，可以同时安装。full 的安装包名、AppId、目录和注册表键与引入版本之前相同。
  release:
    needs: source
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        edition: [full, wubi, pinyin, japanese, vietnamese, tibetan]
    env:
      VCPKG_DISABLE_METRICS: '1'
      # Python on Windows otherwise decodes text as the ANSI code page, and the fetch and packaging scripts read UTF-8 sources.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      - id: version
        shell: pwsh
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          # Build-Client.ps1 stamps this into the Tauri and Server metadata, which take three numeric components only.
          $v = if ($env:REQUESTED) {$env:REQUESTED.Trim()} else {(Get-Content platforms/windows/version.txt -Raw).Trim()}; if ($v -notmatch '^\d+\.\d+\.\d+$') {throw 'invalid version'}; "value=$v" >> $env:GITHUB_OUTPUT
          $baseline = (Get-Content platforms/windows/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'; "vcpkg-baseline=$baseline" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24}
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Rust MSVC targets
        shell: pwsh
        # rust-toolchain.toml pins the compiler; adding targets from the repository root installs that toolchain first.
        run: rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - name: Fetch the settled-rerank model, offline candidate glosses and language dictionaries
        # bash stops at the first failing command; a multi-line pwsh step only reports the last one. The Cantonese and Zhuyin dictionaries are skipped until resources/language-dictionaries.lock.json pins a release.
        shell: bash
        run: |
          python scripts/fetch_settled_model.py
          python scripts/fetch_offline_glosses.py
          python scripts/fetch_language_dictionaries.py
      # Build-Client.ps1 takes installed dependency prefixes rather than a vcpkg toolchain, so the manifest is installed into one prefix per architecture: x64 for the Server, Watchdog and 64-bit TSF DLL, x86 for the 32-bit TSF DLL.
      # Restore and save separately so a run that fails after this point still keeps the installed dependencies for the retry.
      - id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msime-deps
          key: windows-deps-${{ hashFiles('platforms/windows/vcpkg.json') }}-${{ steps.version.outputs.vcpkg-baseline }}
      - name: Install native dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env: {BASELINE: "${{ steps.version.outputs.vcpkg-baseline }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          git -C $vcpkg checkout --quiet $env:BASELINE
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline checkout failed' }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          foreach ($triplet in @('x64-windows', 'x86-windows')) {
            & (Join-Path $vcpkg 'vcpkg.exe') install --triplet $triplet --x-manifest-root=platforms/windows "--x-install-root=$(Join-Path $env:RUNNER_TEMP "msime-deps/$triplet")"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed for $triplet" }
          }
      - if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msime-deps
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Download desktop resources
        shell: pwsh
        run: |
          # Fetches and verifies the files resources/desktop-dictionary.lock.json pins; prints the directory holding them.
          $resources = cargo run --quiet --locked -p msime-client-core --example install_resources -- (Join-Path $env:RUNNER_TEMP 'desktop-resources')
          if ($LASTEXITCODE -ne 0) { throw 'desktop resource download failed' }
          "MSIME_DESKTOP_RESOURCES=$(@($resources)[-1].Trim())" >> $env:GITHUB_ENV
      - name: Build Windows client
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'msime-deps'
          # Build-Client.ps1 defaults to the Visual Studio 2022 generator; the runner image moves between Visual Studio releases, so name the one it has.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $major = ([version](& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion)).Major
          # vswhere reports the product line as the major version from Visual Studio 2026 on, so take the full generator name from CMake's own list.
          $generator = @(cmake --help | Select-String -Pattern "Visual Studio $major \d{4}" -AllMatches | ForEach-Object { $_.Matches.Value } | Select-Object -Unique)
          if ($generator.Count -ne 1) { throw "no single CMake generator for Visual Studio $major" }
          $generator = $generator[0]
          Write-Output "CMake generator: $generator"
          # Build-Client.ps1 builds the WinUI 3 settings project with msbuild, which a Developer PowerShell has on PATH and the runner's plain pwsh does not; take it from the same Visual Studio installation.
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe')
          if ($msbuild.Count -lt 1) { throw 'no MSBuild in the Visual Studio installation' }
          $env:PATH = "$(Split-Path -Parent $msbuild[0]);$env:PATH"
          Write-Output "MSBuild: $($msbuild[0])"
          ./platforms/windows/Build-Client.ps1 -X64Dependencies (Join-Path $deps 'x64-windows/x64-windows') -X86Dependencies (Join-Path $deps 'x86-windows/x86-windows') -TargetVersion $env:VERSION -Generator $generator -Edition $env:EDITION
      - name: Collect third-party notices
        shell: pwsh
        env: {EDITION: "${{ matrix.edition }}"}
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'msime-deps'
          # The Rust crates linked into the host DLL, the MCP server and the settings binary, and the npm packages bundled into its frontend, carry notices the vcpkg prefixes do not. Run on this runner, cargo resolves the Windows dependency graph.
          $supplemental = Join-Path $env:RUNNER_TEMP 'msime-supplemental-notices'
          $rust = Join-Path $supplemental 'rust-crates-NOTICES.txt'
          $frontend = Join-Path $supplemental 'frontend-npm-NOTICES.txt'
          python -X utf8 platforms/linux/collect-notices.py cargo $rust msime-host-api msime-engine msime-mcp-server msime-desktop:tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Rust crate notice collection failed' }
          python -X utf8 platforms/linux/collect-notices.py npm $frontend apps/desktop
          if ($LASTEXITCODE -ne 0) { throw 'npm notice collection failed' }
          # An empty dependency graph still produces a non-empty file (title plus "0 packages"), which Collect-Notices.ps1 would accept, so require at least one package and log the counts as release evidence.
          foreach ($notice in $rust, $frontend) {
            $count = [regex]::Match((Get-Content -LiteralPath $notice -TotalCount 4) -join "`n", '(?m)^(\d+) packages\.').Groups[1].Value
            if (-not $count -or [int]$count -eq 0) { throw "No packages collected into $notice" }
            Write-Output "$([IO.Path]::GetFileName($notice)): $count packages"
          }
          ./platforms/windows/Collect-Notices.ps1 -DependencyPrefixes (Join-Path $deps 'x64-windows/x64-windows'), (Join-Path $deps 'x86-windows/x86-windows') -SupplementalNotices $rust, $frontend -Edition $env:EDITION
      - name: Stage package files
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        # The same arguments Package-SimplySign.ps1 passes.
        run: >-
          ./platforms/windows/installer/Prepare-PackageFiles.ps1 -TargetVersion $env:VERSION
          -Edition $env:EDITION
          -NoticesDirectory target/windows-notices
          -DesktopResourcesDirectory $env:MSIME_DESKTOP_RESOURCES
          -ServerReleaseDirectory target/windows-$env:EDITION/x64/bin
          -Tsf32ReleaseDirectory target/windows-$env:EDITION/x86/bin
          -Tsf64ReleaseDirectory target/windows-$env:EDITION/x64/bin
          -DesktopExecutable target/windows-$env:EDITION/x64/bin/msime-client-settings.exe
      - name: Compile installer
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        # Unsigned: the code-signing certificate is a Certum SimplySign card that only exists on the release machine, so signing stays a local step (installer/Package-SimplySign.ps1). This job produces the installer that step would sign.
        run: |
          $ErrorActionPreference = 'Stop'
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path -LiteralPath "$inno\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          # msime_setup.iss uses compiler:Languages\ChineseSimplified.isl, which is a user-contributed translation that the Inno Setup installer does not ship; take it from the is-6_7_1 tag.
          $isl = "$inno\Languages\ChineseSimplified.isl"
          if (-not (Test-Path -LiteralPath $isl)) {
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/cfdf48923178df4b4f040e038b423aa555a61ffc/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $isl
            if ((Get-FileHash -LiteralPath $isl -Algorithm SHA256).Hash -ne '7D544B9BB1D142CFA11F2E5D3CC8ABE2E55F8E066C5124E3772675AA236E1278') { throw 'ChineseSimplified.isl digest mismatch' }
          }
          ./platforms/windows/installer/Compile-Installer.ps1 -Edition $env:EDITION
          # 安装包名前缀按版本取（full 是 MetasequoiaIME_Setup，五笔版是 MetasequoiaIME-Wubi_Setup），与更新检查认的名字一致。
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'edition installer name lookup failed' }
          $installer = "platforms/windows/installer/Output/${base}_v$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "installer missing: $installer" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $installer -Destination dist/
          $name = Split-Path -Leaf $installer
          $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "dist/$name.sha256"), "$hash  $name`n")
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-windows-${{ matrix.edition }}-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
      # The runner is a disposable elevated Windows machine, so install the built package on it and uninstall it again before anything is published. The artifact is uploaded first so a failing package can still be inspected.
      - name: Install and uninstall the package
        shell: pwsh
        env: {VERSION: "${{ steps.version.outputs.value }}", EDITION: "${{ matrix.edition }}"}
        run: |
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'edition installer name lookup failed' }
          ./platforms/windows/installer/tests/install-smoke.ps1 -Installer "dist/${base}_v$env:VERSION.exe" -Edition $env:EDITION
    outputs:
      version: ${{ steps.version.outputs.value }}
  # 几个版本的安装包装在同一台机器上：各自的 TIP、COM 注册、HKLM 键、看门狗任务和数据目录同时存在，卸掉一个版本不碰 full。runner 是一次性的管理员环境。
  coexistence:
    needs: [source, release]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-windows-*-${{ needs.release.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Install the editions side by side
        shell: pwsh
        env: {VERSION: "${{ needs.release.outputs.version }}"}
        run: |
          $installers = @{}
          foreach ($edition in (python platforms/windows/scripts/edition_windows.py editions).Trim().Split(',')) {
            $base = (python platforms/windows/scripts/edition_windows.py field --edition $edition installer_base_name).Trim()
            $installers[$edition] = "dist/${base}_v$env:VERSION.exe"
          }
          ./platforms/windows/installer/tests/coexistence-smoke.ps1 -Installers $installers
  publish:
    needs: [source, release, coexistence]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-windows-*-${{ needs.release.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Publish independent Windows release
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ needs.release.outputs.version }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          tag="windows-v${VERSION}"; flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          start=$(git tag --list 'windows-v*' --sort=-v:refname | head -1)
          python3 scripts/generate-release-notes.py --platform windows --version "$VERSION" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output release-notes.md
          gh release create "$tag" dist/* --target "$(git rev-parse HEAD)" --title "Windows ${VERSION}" --notes-file release-notes.md "${flags[@]}"
