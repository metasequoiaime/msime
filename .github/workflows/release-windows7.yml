name: Release Windows 7

on:
  workflow_dispatch:
    inputs:
      edition:
        description: '要构建的 Windows 版本'
        required: false
        default: full
        type: choice
        options: [full, wubi, pinyin, japanese, vietnamese, tibetan]
      publish:
        description: '发布正式版到 GitHub Release（仅 full，必须从 main 触发）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-windows7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  official-plugins:
    name: 构建官方插件包
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 构建并校验官方插件包
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          bash scripts/build-official-plugins.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-plugin-packs-windows7
          path: target/plugin-packs/
          if-no-files-found: error

  runtime:
    name: 构建 Win7 ${{ matrix.architecture }} 核心和语音运行库
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    # 留在 GitHub 的 windows-2022：Win7 二进制的兼容性（CRT 转发审计、真机验收）是在这个镜像的 MSVC 和 Windows SDK 上核对的，Depot 的 Windows runner 只有 2025 镜像，换工具链要重新在 Win7 上验收；打包 job 同理。
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链和 Win7 标准库源码
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链安装失败' }
          rustup component add rust-src
          if ($LASTEXITCODE -ne 0) { throw 'rust-src 安装失败' }

      - name: 准备 MSVC 和 Windows SDK 工具
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) | Select-Object -First 1
          if (-not $vs) { throw '找不到 Visual Studio 安装目录' }
          $vc = @(Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64' } | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'dumpbin.exe') } | Select-Object -First 1)
          $sdk = @(Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64' } | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'rc.exe') } | Select-Object -First 1)
          if ($vc.Count -ne 1 -or $sdk.Count -ne 1) { throw '找不到 dumpbin、lib 或 rc 工具' }
          $vc[0] >> $env:GITHUB_PATH
          $sdk[0] >> $env:GITHUB_PATH

      - name: 恢复 Win7 核心和语音编译缓存
        id: runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/windows7-compat/${{ matrix.architecture }}
            target/windows7-voice/${{ matrix.architecture }}
            target/x86_64-win7-windows-msvc
            target/i686-win7-windows-msvc
          key: windows7-runtime-${{ matrix.architecture }}-windows-2022-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'platforms/windows/Build-Windows7Core.ps1', 'platforms/windows/Build-Windows7VoiceRuntime.ps1', 'platforms/windows/compat/**') }}
          restore-keys: |
            windows7-runtime-${{ matrix.architecture }}-windows-2022-

      - name: 构建 Win7 核心和语音运行库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.architecture }}'
          ./platforms/windows/Build-Windows7Core.ps1 -Architecture $arch -OutputDirectory "$PWD/target/windows7-core"
          ./platforms/windows/Build-Windows7VoiceRuntime.ps1 -Architecture $arch -Parallel 4

      - name: 保存 Win7 核心和语音编译缓存
        if: success() && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/tooling/onnxruntime-windows7-1.28.2
            target/tooling/sherpa-onnx-windows7-1.13.8
            target/windows7-compat/${{ matrix.architecture }}
            target/windows7-voice/${{ matrix.architecture }}
            target/x86_64-win7-windows-msvc
            target/i686-win7-windows-msvc
          key: windows7-runtime-${{ matrix.architecture }}-windows-2022-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'platforms/windows/Build-Windows7Core.ps1', 'platforms/windows/Build-Windows7VoiceRuntime.ps1', 'platforms/windows/compat/**') }}

      - name: 整理 Win7 运行库产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.architecture }}'
          $stage = Join-Path $PWD 'target/windows7-runtime-artifact'
          $core = Join-Path $stage "windows7-core/$arch"
          $voice = Join-Path $stage "windows7-voice/$arch/bin"
          New-Item -ItemType Directory -Force -Path $core, $voice | Out-Null
          Copy-Item -Path (Join-Path $PWD "target/windows7-core/$arch/*") -Destination $core -Recurse -Force
          Copy-Item -Path (Join-Path $PWD "target/windows7-voice/$arch/bin/*") -Destination $voice -Recurse -Force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows7-runtime-${{ matrix.architecture }}
          path: target/windows7-runtime-artifact/
          if-no-files-found: error

  package:
    name: Windows 7 安装包（${{ github.event.inputs.edition || 'full' }}）
    needs: [official-plugins, runtime]
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      EDITION: ${{ github.event.inputs.edition || 'full' }}
      CARGO_INCREMENTAL: '0'
      VCPKG_DISABLE_METRICS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: official-plugin-packs-windows7
          path: target/plugin-packs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows7-runtime-*
          path: target/windows7-runtime
          merge-multiple: true

      - name: 整理 Win7 核心和语音运行库
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in @('x64', 'x86')) {
            $core = Join-Path $PWD "target/windows7-runtime/windows7-core/$arch"
            $voice = Join-Path $PWD "target/windows7-runtime/windows7-voice/$arch"
            if (-not (Test-Path -LiteralPath $core -PathType Container)) { throw "缺少 Win7 核心产物：$arch" }
            if (-not (Test-Path -LiteralPath $voice -PathType Container)) { throw "缺少 Win7 语音产物：$arch" }
            New-Item -ItemType Directory -Force -Path "target/windows7-core/$arch", "target/windows7-voice/$arch" | Out-Null
            Copy-Item -Path (Join-Path $core '*') -Destination "target/windows7-core/$arch" -Recurse -Force
            Copy-Item -Path (Join-Path $voice '*') -Destination "target/windows7-voice/$arch" -Recurse -Force
          }

      - name: 安装 Rust 工具链和 Win7 标准库源码
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链安装失败' }
          rustup component add rust-src
          if ($LASTEXITCODE -ne 0) { throw 'rust-src 安装失败' }

      - name: 准备 MSVC 和 Windows SDK 工具
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) | Select-Object -First 1
          if (-not $vs) { throw '找不到 Visual Studio 安装目录' }
          $vc = @(Get-ChildItem -LiteralPath (Join-Path $vs 'VC\Tools\MSVC') -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64' } | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'dumpbin.exe') } | Select-Object -First 1)
          $sdk = @(Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64' } | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'rc.exe') } | Select-Object -First 1)
          if ($vc.Count -ne 1 -or $sdk.Count -ne 1) { throw '找不到 dumpbin、lib 或 rc 工具' }
          $vc[0] >> $env:GITHUB_PATH
          $sdk[0] >> $env:GITHUB_PATH

      - name: 准备 vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content platforms/windows/compat/vcpkg.json -Raw | ConvertFrom-Json)."builtin-baseline"
          "baseline=$baseline" >> $env:GITHUB_OUTPUT
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkg
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg 克隆失败' }
          git -C $vcpkg checkout --quiet $baseline
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg 基线检出失败' }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg 引导失败' }

      - name: 恢复 vcpkg 依赖缓存
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msime-win7-deps
          key: windows7-deps-${{ hashFiles('platforms/windows/compat/vcpkg.json', 'platforms/windows/settings/win7/vcpkg.json') }}-${{ steps.vcpkg.outputs.baseline }}

      - name: 安装 Win7 原生依赖
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg/vcpkg.exe'
          $root = Join-Path $env:RUNNER_TEMP 'msime-win7-deps'
          foreach ($triplet in @('x64-windows-static-md', 'x86-windows-static-md')) {
            $installRoot = Join-Path $root $triplet
            & $vcpkg install --triplet $triplet --x-manifest-root=platforms/windows/compat "--x-install-root=$installRoot"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg 安装失败：$triplet" }
          }

      - name: 下载安装包锁定资源
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = cargo run --quiet --locked -p msime-client-core --example install_resources -- (Join-Path $env:RUNNER_TEMP 'windows7-desktop-resources')
          if ($LASTEXITCODE -ne 0) { throw '桌面资源下载失败' }
          "MSIME_DESKTOP_RESOURCES=$(@($resources)[-1].Trim())" >> $env:GITHUB_ENV
          python scripts/fetch_offline_glosses.py
          if ($LASTEXITCODE -ne 0) { throw '离线释义下载失败' }
          python scripts/fetch_gloss_tables.py
          if ($LASTEXITCODE -ne 0) { throw '英文释义表下载失败' }
          python scripts/fetch_language_dictionaries.py
          if ($LASTEXITCODE -ne 0) { throw '语言词库下载失败' }
          python scripts/fetch_wordbooks.py
          if ($LASTEXITCODE -ne 0) { throw '内置词书下载失败' }

      - name: 保存 vcpkg 依赖缓存
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msime-win7-deps
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: 构建 Win7 原生产品
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Join-Path $env:RUNNER_TEMP 'msime-win7-deps'
          $x64 = Join-Path $deps 'x64-windows-static-md/x64-windows-static-md'
          $x86 = Join-Path $deps 'x86-windows-static-md/x86-windows-static-md'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = @(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) | Select-Object -First 1
          if (-not $vs) { throw '找不到 Visual Studio 安装目录' }
          $vcRoot = Join-Path $vs 'VC\Redist\MSVC'
          $vc64 = @(Get-ChildItem -LiteralPath $vcRoot -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1)
          $vc86 = @(Get-ChildItem -LiteralPath $vcRoot -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x86\Microsoft.VC143.CRT' } | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1)
          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Redist'
          $ucrt64 = @(Get-ChildItem -LiteralPath $kitsRoot -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'ucrt\DLLs\x64' } | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1)
          $ucrt86 = @(Get-ChildItem -LiteralPath $kitsRoot -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'ucrt\DLLs\x86' } | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1)
          if ($vc64.Count -ne 1 -or $vc86.Count -ne 1 -or $ucrt64.Count -ne 1 -or $ucrt86.Count -ne 1) { throw '找不到 Win7 所需的 VC/UCRT 运行库目录' }
          ./platforms/windows/Build-Windows7Client.ps1 -X64Dependencies $x64 -X86Dependencies $x86 -X64RuntimeDirectories @($ucrt64[0], $vc64[0]) -X86RuntimeDirectories @($ucrt86[0], $vc86[0]) -VcpkgRoot (Join-Path $env:RUNNER_TEMP 'vcpkg') -Edition $env:EDITION -CoreOutputs "$PWD/target/windows7-core" -VoiceOutputs "$PWD/target/windows7-voice"

      - name: 收集 Win7 安装包声明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./platforms/windows/Collect-Notices.ps1 -DependencyPrefixes "$env:RUNNER_TEMP/msime-win7-deps/x64-windows-static-md/x64-windows-static-md", "$env:RUNNER_TEMP/msime-win7-deps/x86-windows-static-md/x86-windows-static-md" -OutputDirectory "$PWD/target/windows7-notices" -Edition $env:EDITION

      - name: 准备并编译 Win7 x64、x86 安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content platforms/windows/version-win7.txt -TotalCount 1).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Win7 version-win7.txt 不是有效的语义版本' }
          # Win7 包固定用 Inno Setup 6.2.2：Inno 6.3.0 起（改用 Delphi 11.3 编译）打出的安装包，在 CPUID 厂商为 CentaurHauls 的兆芯 CPU 上一启动就报 Runtime error 255，崩在 Setup 的 32 位启动程序里。2026-11-01 在 pve9 的 Win7 x64 虚拟机上用 -cpu host,vendor=CentaurHauls 对照过官方安装程序：6.2.2 正常进入向导，6.3.3、6.4.3、6.7.1 都立即以 255 退出；只换成兆芯 YongFeng 的指令集、厂商仍为 GenuineIntel 时正常。Chocolatey 没有旧版本，从官方 GitHub Release 下载并校验摘要，装进独立目录，不碰镜像预装的版本，并显式传 -IsccPath。
          $innoSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.2.2.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_2_2/innosetup-6.2.2.exe' -OutFile $innoSetup
          if ((Get-FileHash -LiteralPath $innoSetup -Algorithm SHA256).Hash -ne '8117D10D00A2AD33A1390978EA3872861C330E087914410A6377B22C4C5B8563') { throw 'Inno Setup 6.2.2 安装程序摘要不匹配' }
          $inno = Join-Path $env:RUNNER_TEMP 'InnoSetup-6.2.2'
          $innoInstall = Start-Process -FilePath $innoSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', "/DIR=`"$inno`"") -Wait -PassThru
          if ($innoInstall.ExitCode -ne 0) { throw "Inno Setup 安装失败，退出码：$($innoInstall.ExitCode)" }
          $iscc = Join-Path $inno 'ISCC.exe'
          # ISCC.exe 的版本资源读不出版本；安装程序摘要已经锁定 6.2.2，编译日志的 Compiler engine version 也会打出来。
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "找不到 ISCC.exe：$iscc" }
          # 中文消息文件取 6.2.2 标签里的那一份，与编译器的消息条目一致。
          $isl = "$inno\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/is-6_2_2/Files/Languages/Unofficial/ChineseSimplified.isl' -OutFile $isl
          if ((Get-FileHash -LiteralPath $isl -Algorithm SHA256).Hash -ne '8897D1DC319935D359FC52A27CD18BC7FF4C7B7660C58CB23B3893EB99C9DB23') { throw 'ChineseSimplified.isl 摘要不匹配' }
          foreach ($arch in @('x64', 'x86')) {
            $env:MSIME_REQUIRE_OFFICIAL_PLUGINS = '1'
            $env:MSIME_REQUIRE_WORDBOOKS = '1'
            $env:MSIME_REQUIRE_LANGUAGE_DICTIONARIES = '1'
            ./platforms/windows/installer/Prepare-PackageFiles.ps1 -Edition $env:EDITION -Windows7Architecture $arch -TargetVersion $version -NoticesDirectory "$PWD/target/windows7-notices" -DesktopResourcesDirectory $env:MSIME_DESKTOP_RESOURCES -PackageDirectory "$PWD/target/windows7-package/$env:EDITION/$arch"
            if ('${{ inputs.publish }}' -ne 'true') {
              ./platforms/windows/installer/Sign-PackageBinaries-Local.ps1 -PackageDirectory "$PWD/target/windows7-package/$env:EDITION/$arch"
            }
            ./platforms/windows/installer/Compile-Installer.ps1 -IsccPath $iscc -Edition $env:EDITION -Windows7Architecture $arch -TargetVersion $version -SourceDirectory "$PWD/target/windows7-package/$env:EDITION/$arch" -OutputDirectory "$PWD/target/windows7-installer"
          }
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          if ($LASTEXITCODE -ne 0) { throw '安装包名称读取失败' }
          foreach ($arch in @('x64', 'x86')) {
            $installer = Join-Path $PWD "target/windows7-installer/${base}_v${version}_win7_${arch}.exe"
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "安装包不存在：$installer" }
            if ('${{ inputs.publish }}' -ne 'true') {
              ./platforms/windows/installer/Sign-Installer-Local.ps1 -InstallerPath $installer
            }
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$installer.sha256", "$hash  $([IO.Path]::GetFileName($installer))`n")
          }

      # 安装包不带 PDB；Win7 核心与原生宿主来自不同构建，按架构把实际配套的模块和 PDB（含 TSF 与 WER helper）打成单独的符号包，用来符号化 Win7 崩溃记录里的「模块+偏移」。符号包放在单独的 artifact 里，发布作业只按名字下载安装包 artifact，其文件数量校验不受影响。
      - name: 收集 Win7 调试符号
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./platforms/windows/installer/Collect-Windows7Symbols.ps1 -Edition $env:EDITION -Version (Get-Content platforms/windows/version-win7.txt -TotalCount 1).Trim() -OutputDirectory "$PWD/target/windows7-symbols"

      - name: 上传 Win7 调试符号
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-windows7-${{ github.event.inputs.edition || 'full' }}-symbols-${{ github.sha }}
          path: target/windows7-symbols/*.zip
          if-no-files-found: error

      - name: 验证 Win7 x64 安装包布局
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content platforms/windows/version-win7.txt -TotalCount 1).Trim()
          $base = (python platforms/windows/scripts/edition_windows.py field --edition $env:EDITION installer_base_name).Trim()
          $identity = (Get-Content shared/contracts/editions.json -Raw | ConvertFrom-Json).editions | Where-Object { $_.id -ceq $env:EDITION } | Select-Object -ExpandProperty platforms | Select-Object -ExpandProperty windows
          $xml = New-Object System.Xml.XmlDocument
          $root = $xml.CreateElement('windows')
          foreach ($name in @('registry_key','install_dir','clsid','watchdog_task','host_dll','name_suffix')) { $root.SetAttribute($name, [string]$identity.$name) }
          $root.SetAttribute('user_data_dir', [string]$identity.user_data_directory)
          [void]$xml.AppendChild($root)
          $identityPath = Join-Path $env:RUNNER_TEMP 'windows7-identity.xml'
          $xml.Save($identityPath)
          $installer = "target/windows7-installer/${base}_v${version}_win7_x64.exe"
          $skipSignature = '${{ inputs.publish }}' -eq 'true'
          ./platforms/windows/installer/tests/windows7-install-smoke.ps1 -Installer $installer -IdentityFile $identityPath -Architecture x64 -SkipSignatureCheck:$skipSignature

      - name: 上传 Win7 安装包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-windows7-${{ github.event.inputs.edition || 'full' }}-${{ github.sha }}
          path: |
            target/windows7-installer/*.exe
            target/windows7-installer/*.sha256
            target/windows7-notices/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    name: 发布 Win7 正式版
    needs: package
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msime-windows7-full-${{ github.sha }}
          path: dist

      - name: 整理安装包 artifact 目录
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f \( -name '*.exe' -o -name '*.exe.sha256' \) -print)
          [[ ${#files[@]} -eq 4 ]] || { echo "安装包 artifact 文件数量错误：${#files[@]}" >&2; exit 1; }
          for file in "${files[@]}"; do cp -- "$file" "dist/$(basename -- "$file")"; done

      - name: 校验并发布 Win7 安装包
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo '正式版只能从 main 发布' >&2; exit 1; }
          [[ '${{ inputs.edition }}' == full ]] || { echo '正式版只支持 full' >&2; exit 1; }
          version="$(tr -d '\r\n' < platforms/windows/version-win7.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Win7 版本号无效' >&2; exit 1; }
          base="$(python3 platforms/windows/scripts/edition_windows.py field --edition full installer_base_name)"
          for arch in x64 x86; do
            installer="dist/${base}_v${version}_win7_${arch}.exe"
            [[ -s "$installer" && -f "$installer.sha256" ]] || { echo "缺少安装包或摘要：$arch" >&2; exit 1; }
          done
          installers=(dist/*.exe)
          [[ ${#installers[@]} -eq 2 ]] || { echo '安装包数量不是两个' >&2; exit 1; }
          (cd dist && sha256sum -- *.exe > SHA256SUMS && sha256sum -c SHA256SUMS)
          for installer in "${installers[@]}"; do
            name="$(basename "$installer")"
            [[ "$(cat "$installer.sha256")" == "$(grep -F "  $name" dist/SHA256SUMS)" ]] || { echo "$name 摘要不一致" >&2; exit 1; }
          done
          tag="windows7-v$version"
          cat > release-notes.md <<EOF
          # 水杉输入法 Windows 7 v$version

          Windows 7 SP1 64 位系统下载 x64 安装包；32 位系统下载 x86 安装包。安装前可用 SHA256SUMS 核对文件。

          此版本未使用受信任代码签名。Windows 若显示未知发布者，请确认下载地址和 SHA-256 摘要后再安装。
          EOF
          python3 scripts/release-build-marker.py "$version" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" >> release-notes.md
          bash scripts/publish-release.sh "$tag" "$(git rev-parse HEAD)" "Windows 7 v$version" release-notes.md dist/*.exe dist/SHA256SUMS dist/*.exe.sha256
