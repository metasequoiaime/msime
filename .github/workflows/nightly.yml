name: Nightly builds

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly-builds
  cancel-in-progress: false

jobs:
  android:
    name: Android nightly
    uses: ./.github/workflows/release-android.yml
    with:
      prerelease: true
      publish: false
    secrets: inherit

  ios:
    name: iOS nightly
    uses: ./.github/workflows/release-ios.yml
    with:
      prerelease: true
      publish: false
      testflight: true
      testflight_external: true
    secrets: inherit

  macos:
    name: macOS nightly
    uses: ./.github/workflows/release-macos.yml
    with:
      prerelease: true
      publish: false
      # 不传 build_number；复用 workflow 由所构建提交的时间算出九位以内的构建号，没有新提交的日子编出的是同一个构建。
      # 这次构建的 Sparkle 更新发到每日构建通道：输入法和设置应用里选了「每日构建」的用户读 macos-appcast 上的 appcast-nightly-*（见 release-macos.yml 的「Update the Sparkle appcasts」）。只有跑在 develop 上（定时触发总是如此）时才更新它，从其他分支手动触发只产出 workflow artifact。
      appcast_channel: nightly
    secrets: inherit

  linux:
    name: Linux nightly
    uses: ./.github/workflows/release-linux.yml
    with:
      prerelease: true
      publish: false
      legacy: false
    secrets: inherit

  harmony:
    name: HarmonyOS nightly
    uses: ./.github/workflows/release-harmony.yml
    with:
      prerelease: true
      publish: false
    secrets: inherit

  windows:
    name: Windows nightly
    uses: ./.github/workflows/release-windows.yml
    with:
      prerelease: true
      publish: false
      signpath_test: false
    secrets: inherit

  publish:
    name: Publish rolling nightly release
    needs: [android, ios, macos, linux, harmony, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # 只取构建和验收成功的平台；某个平台下载失败也不阻止其他平台更新。
      - name: Download Android artifacts
        id: android
        if: ${{ needs.android.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-android-*-*
          path: nightly-assets/android
          merge-multiple: false
      - name: Download macOS artifacts
        id: macos
        if: ${{ needs.macos.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-macos-*
          path: nightly-assets/macos
          merge-multiple: false
      - name: Download Linux artifacts
        id: linux
        if: ${{ needs.linux.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-linux-*-*
          path: nightly-assets/linux
          merge-multiple: false
      - name: Download HarmonyOS artifacts
        id: harmony
        if: ${{ needs.harmony.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-harmony-*
          path: nightly-assets/harmony
          merge-multiple: false
      - name: Download Windows artifacts
        id: windows
        if: ${{ needs.windows.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-windows-*-*
          path: nightly-assets/windows
          merge-multiple: false
      - name: Update successful platforms and retain previous downloads
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          SOURCE_SHA: ${{ github.sha }}
          NEEDS_RESULTS: ${{ toJSON(needs) }}
          DOWNLOAD_RESULTS: ${{ toJSON(steps) }}
        run: python3 scripts/publish-nightly.py nightly-assets dist
