name: Nightly builds

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nightly-builds
  cancel-in-progress: false

jobs:
  android:
    name: Android nightly
    uses: ./.github/workflows/release-android.yml
    with:
      prerelease: true
      publish: false
    secrets: inherit

  ios:
    name: iOS nightly
    uses: ./.github/workflows/release-ios.yml
    with:
      prerelease: true
      publish: false
      testflight: true
      testflight_external: true
    secrets: inherit

  macos:
    name: macOS nightly
    uses: ./.github/workflows/release-macos.yml
    with:
      prerelease: true
      publish: false
    secrets: inherit

  linux:
    name: Linux nightly
    uses: ./.github/workflows/release-linux.yml
    with:
      prerelease: true
      publish: false
      legacy: false
    secrets: inherit

  harmony:
    name: HarmonyOS nightly
    uses: ./.github/workflows/release-harmony.yml
    with:
      prerelease: true
      publish: false
    secrets: inherit

  windows:
    name: Windows nightly
    uses: ./.github/workflows/release-windows.yml
    with:
      prerelease: true
      publish: false
      signpath_test: false
    secrets: inherit

  publish:
    name: Publish rolling nightly release
    needs: [android, ios, macos, linux, harmony, windows]
    if: ${{ always() && needs.android.result == 'success' && needs.ios.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.harmony.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 每个平台的发布 workflow 已经上传了经过自身校验的 artifact；这里按平台分目录下载，避免同名的 SHA256SUMS 互相覆盖。
      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-android-*-*
          path: nightly-assets/android
          merge-multiple: false
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-macos-*
          path: nightly-assets/macos
          merge-multiple: false
      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-linux-*-*
          path: nightly-assets/linux
          merge-multiple: false
      - name: Download HarmonyOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-harmony-*
          path: nightly-assets/harmony
          merge-multiple: false
      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: msime-windows-*-*
          path: nightly-assets/windows
          merge-multiple: false
      - name: Stage native nightly downloads
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/package-nightly.py nightly-assets dist "$SOURCE_SHA"
      - name: Replace the rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create nightly dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title '水杉输入法 nightly' \
            --notes-file dist/README.txt
