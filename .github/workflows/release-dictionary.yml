name: Release Dictionary
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version of the dictionary release (dict-vX.Y.Z), required: true, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a dict-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-dictionary, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got '$REQUESTED'" >&2; exit 1; }
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
      # Installs the toolchain rust-toolchain.toml pins.
      - name: Install Rust
        run: rustup toolchain install
      - name: Build msime-dict-build
        run: cargo build --release --locked -p msime-dict-builder
      # Downloads every input resources/dictionary-sources.lock.json pins (about 500 MB, including the base lexicons and custom dictionary from msime-dictionary) and verifies each by size and SHA-256 before any stage reads it. No --include-unlicensed: inputs without a redistribution grant must never reach a release.
      - name: Build dictionary artifacts
        run: target/release/msime-dict-build --cache target/dictionary-sources --out target/dictionary-release
      # The builder writes dictionary-manifest.json and SHA256SUMS.txt only after its release checks pass; the release carries them exactly as written.
      - name: Verify dictionary artifacts
        run: |
          out=target/dictionary-release
          for name in msime.db english.db others.db dict_japanese.dat bigram.bin trigram.bin mozc_dictionary_oss_README.txt dictionary-manifest.json SHA256SUMS.txt; do
            [[ -s "$out/$name" ]] || { echo "missing $out/$name" >&2; exit 1; }
          done
          (cd "$out" && sha256sum -c SHA256SUMS.txt)
          jq -e '.licensing.includes_unlicensed_inputs == false and .source.dirty == false' "$out/dictionary-manifest.json" > /dev/null || { echo "the manifest records unlicensed inputs or a dirty checkout" >&2; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-dictionary-${{ steps.version.outputs.value }}
          path: target/dictionary-release/
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.value }}
  publish:
    needs: [build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "msime-dictionary-${{ needs.build.outputs.version }}", path: dist}
      # workflow_dispatch runs on whatever ref it is given, so publishing has to be asked for rather than implied. Without the gate a dispatch on a feature branch cuts a real public release.
      - name: Publish dictionary release
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", VERSION: "${{ needs.build.outputs.version }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          dist=dist
          (cd "$dist" && sha256sum -c SHA256SUMS.txt)
          # The notes state where the data came from instead of --generate-notes, which would describe the diff since whichever platform tag is newest.
          jq -r '"Built by msime-dict-build from metasequoiaime/msime \(.source.commit).\n\nCustom dictionary: \(.custom_dictionary_repository) \(.custom_dictionary_commit).\n\nPinned inputs: resources/dictionary-sources.lock.json at that commit. Checksums: SHA256SUMS.txt."' "$dist/dictionary-manifest.json" > notes.md
          tag="dict-v${VERSION}"; flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$tag" "$dist"/msime.db "$dist"/english.db "$dist"/others.db "$dist"/dict_japanese.dat "$dist"/bigram.bin "$dist"/trigram.bin "$dist"/mozc_dictionary_oss_README.txt "$dist"/dictionary-manifest.json "$dist"/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Dictionary ${VERSION}" --notes-file notes.md "${flags[@]}"
