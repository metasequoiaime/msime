name: Release HarmonyOS
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/harmony/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a harmony-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-harmony, cancel-in-progress: false}
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/harmony/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
      # The settings page is built from packages/ui for every HAP rather than committed (see platforms/harmony/stage-settings.sh), with the Node the rest of the repository pins.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build the HarmonyOS settings page
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          bash platforms/harmony/stage-settings.sh
      - name: Build HarmonyOS native host
        run: bash platforms/harmony/build-native.sh arm64-v8a
      - name: Stage the sherpa-onnx HAR
        run: bash platforms/harmony/stage-voice-runtime.sh
      - name: Build HarmonyOS HAP
        working-directory: platforms/harmony
        run: ./hvigorw assembleHap --no-daemon
      - id: hap
        name: Locate the packaged HAP
        run: |
          set -euo pipefail
          hap=$(find platforms/harmony -type f -name '*.hap' | head -1)
          test -n "$hap"
          echo "path=$hap" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-harmony-${{ steps.version.outputs.value }}
          path: ${{ steps.hap.outputs.path }}
          if-no-files-found: error
      # workflow_dispatch runs on whatever ref it is given, so publishing has to be asked for rather
      # than implied. Without the gate a dispatch on a feature branch cuts a real public release.
      - name: Publish independent HarmonyOS release
        if: ${{ inputs.publish }}
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.version.outputs.value }}", PRERELEASE: "${{ inputs.prerelease }}", HAP: "${{ steps.hap.outputs.path }}"}
        run: |
          # --generate-notes otherwise starts from whichever tag in the repository is newest, and the six platforms interleave prefixes, so a macOS release could be described by the diff since an ios-v tag. fetch-depth: 0 above is what makes this list complete.
          start=$(git tag --list 'harmony-v*' --sort=-v:refname | head -1)
          tag="harmony-v${VERSION}"; flags=(); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          [[ -n "$start" ]] && flags+=(--notes-start-tag "$start")
          gh release create "$tag" "$HAP" --target "$GITHUB_SHA" --title "HarmonyOS ${VERSION}" --generate-notes "${flags[@]}"
