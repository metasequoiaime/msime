name: Release msime-script-sdk

# 把脚本插件的 Rust SDK（crates/script-sdk，crates.io 上的 msime-script-sdk）发到 crates.io。版本号取 crates/script-sdk/Cargo.toml：先经普通 PR 改好版本号合进 main，再在那个提交上推 script-sdk-vX.Y.Z tag（AGENTS.md「发版」）。scripts/release-ref.py 先核对 tag 的版本号等于 Cargo.toml 的、被打 tag 的提交在 origin/main 上，只接受正式版。在别的 ref 上手动触发只做 cargo publish --dry-run（打包并在打包后的源码上编译一遍），tag 的运行才上传，上传后在这个 tag 上建 script-sdk-vX.Y.Z release 记下源码提交。
#
# crates.io 上发出去的版本不能替换，只能 yank：这个版本已经在 crates.io 上时直接失败，要修正就改版本号再发。上传用 crates.io 的 Trusted Publishing：crates.io 上 msime-script-sdk 只信任这个仓库的这个 workflow 在 crates-io environment 里运行，上传前用 GitHub 的 OIDC 换一个临时令牌，只交给上传那一步，仓库和组织里不存任何 crates.io 令牌；dry-run 不换令牌。release 从不标为 latest，仓库的「最新发布」留给应用；tag 以 script-sdk-v 开头，应用内的更新检查只认 <平台>-v 前缀（crates/client-services/src/update_check.rs），不会把它当成某个平台的版本。
on:
  push:
    tags: ['script-sdk-v*']
  workflow_dispatch:
    inputs:
      publish: {description: "On a script-sdk-v tag, upload to crates.io and create its release (a run on any other ref only does cargo publish --dry-run)", required: false, default: true, type: boolean}
permissions: {contents: read}
concurrency: {group: release-script-sdk, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # crates.io 的 Trusted Publishing 按 environment 认人，这里的名字要和 crates.io 上登记的一致。
    environment: crates-io
    permissions: {contents: write, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - id: version
        name: Read the version and check crates.io
        env: {PUBLISH_INPUT: "${{ inputs.publish }}"}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path crates/script-sdk/Cargo.toml | jq -r '.packages[] | select(.name == "msime-script-sdk") | .version')
          # release-ref.py appends version, release, tag, prerelease and publish to GITHUB_OUTPUT itself.
          python3 scripts/release-ref.py --prefix script-sdk-v --tree-version "$version" --stable-only
          # crates.io 要求带联系方式的 User-Agent。404 表示这个 crate 还没有任何版本。
          status=$(curl -sS -o "$RUNNER_TEMP/crate.json" -w '%{http_code}' -A "msime release-script-sdk (https://github.com/${GITHUB_REPOSITORY})" "https://crates.io/api/v1/crates/msime-script-sdk/$version")
          if [[ "$status" == 200 ]]; then echo "msime-script-sdk $version is already on crates.io; published versions are never replaced, bump the version in crates/script-sdk/Cargo.toml" >&2; exit 1; fi
          [[ "$status" == 404 ]] || { echo "crates.io answered $status for msime-script-sdk $version" >&2; exit 1; }
      - name: Dry run
        run: cargo publish -p msime-script-sdk --locked --dry-run
      - id: auth
        name: Get a temporary crates.io token
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Upload to crates.io
        if: ${{ steps.version.outputs.publish == 'true' }}
        env: {CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"}
        run: cargo publish -p msime-script-sdk --locked
      - name: Create the release
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          VERSION: "${{ steps.version.outputs.version }}"
          SHA: "${{ github.sha }}"
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "msime-script-sdk $VERSION 已发到 crates.io：https://crates.io/crates/msime-script-sdk/$VERSION"
            echo
            echo "水杉输入法桌面脚本插件的 Rust SDK（no_std、零依赖、MIT），附 C 头文件 msime_script.h。用法见 [docs/plugins.md 的「从零写一个插件」](https://github.com/metasequoiaime/msime/blob/$SHA/docs/plugins.md)。源码是提交 $SHA。"
          } > "$notes"
          # The release goes on the pushed tag; --verify-tag refuses to create a tag that is not there.
          gh release create "script-sdk-v$VERSION" --verify-tag --title "msime-script-sdk $VERSION" --notes-file "$notes" --latest=false
