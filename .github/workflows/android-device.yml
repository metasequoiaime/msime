name: Android device
# 在真正的 Android 模拟器上跑：client-base、client-core、client-providers 和 client-services 单测整套，再装 APK 走首次启动、词库准备和输入验收。ci-platforms.yml 在动到 Android 或共享代码的 develop、main 推送上调用它，PR 改了键盘或设置界面时只在 API 35 上调用一次，release-android.yml 在发布前调用它，失败就不发。
#
# 为什么要有这一步：编译、lint 和 JVM 测试全绿的 0.3.0 在设备上「词库准备失败」（私有目录从 / 起逐级以只读打开，Android 不给应用读 /data）、匿名账号写不进（SELinux 禁止应用建硬链接），Android 9 一打开就崩溃（开屏光晕的径向渐变带主题属性）。这三类问题只有在 Android 上运行才看得见。
#
# API 28 是 minSdk（Android 9），35 是这里跑的最高级别；targetSdk 已是 36，API 36 的镜像还没接进来。API 28 只跑 smoke.sh --core：那里 UiAutomation 拿不到「更多」面板的节点，其余套件驱动不了，原因见 DeviceSmoke.java。
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test; defaults to the commit that triggered the caller.
        required: false
        type: string
        default: ''
      matrix:
        description: 要跑的 API 级别及各自的 smoke.sh 参数（JSON 数组）；缺省是 API 28 的 --core 加 API 35 整套。PR 上只传 API 35。
        required: false
        type: string
        default: '[{"api": 28, "smoke": "--core"}, {"api": 35, "smoke": ""}]'
permissions:
  contents: read
jobs:
  device:
    name: Android device (API ${{ matrix.api }})
    # 模拟器需要 KVM；普通 Depot GitHub Actions runner 不提供 /dev/kvm，不能用单台探测结果代替平台能力保证。见 .agents/notes/implemented/process/2026-10-30-android-device-kvm-runner.md。此 job 不接触 secrets，APK 使用开发密钥。
    runs-on: ubuntu-24.04
    # 冷构建后整套验收已接近 90 分钟；验收步骤单独限时，给日志上传和退出留出余量。
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      # 模拟器镜像是 x86_64（start-emulator.sh 按主机架构选），APK 和单测程序跟着打 x86_64。
      MSIME_ANDROID_ABIS: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::Android 设备验收需要 /dev/kvm 字符设备，请检查 runner 的 KVM 支持。"
            exit 1
          fi
          # 设备已可访问时直接使用，否则由 udev 规则开放当前 runner 的权限。
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --settle --name-match=/dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      # GitHub 托管镜像的剩余空间每次不同：装完 NDK、SDK 和系统镜像后，模拟器开机要为 userdata 分区留出 7.2 GB，之后的 Rust 与 APK 构建还要在同一块盘上写。2026-11-01 develop 推送的 API 28 两次只剩 6.7 GB，模拟器报 Not enough space 退出，开机步骤空等 10 分钟超时（#10516）。先删掉这个 job 用不到的预装工具链；python3 用的是系统自带的，不在这些目录里。
      - name: Free disk space for the emulator
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install tools, the pinned NDK and the emulator image
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils
          rustup toolchain install
          rustup target add x86_64-linux-android
          # NDK 用发版和 OCR 模块构建共用的 install-ndk.sh：下载偶发损坏时清掉 sdkmanager 的半截下载和没装完的目录再重装，最多三次，以固定版本和编译器都已落盘为准。2026-10-27 夜间 API 28 就是在这里报「Error on ZipFile unknown archive」后整个 job 失败的。
          bash platforms/android/install-ndk.sh
          # sdkmanager 退出后 yes 再写会收到 SIGPIPE（退出码 141），在 pipefail 下让整步失败；它的退出码不算数，装没装上由后面的核对判断。
          { yes || true; } | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            'build-tools;35.0.0' 'platforms;android-35' 'platforms;android-36' \
            emulator platform-tools 'system-images;android-${{ matrix.api }};default;x86_64' >/dev/null
          grep -q '28.2.13676358' "$ANDROID_SDK_ROOT/ndk/28.2.13676358/source.properties"
          test -f "$ANDROID_SDK_ROOT/system-images/android-${{ matrix.api }}/default/x86_64/package.xml"
      - name: Boot the dedicated AVD
        run: |
          set -euo pipefail
          mkdir -p target/android
          nohup bash platforms/android/tests/device/start-emulator.sh ${{ matrix.api }} > target/android/emulator.log 2>&1 &
          serial="emulator-$((5580 - 2 * (35 - ${{ matrix.api }})))"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 600 "$adb" -s "$serial" wait-for-device
          timeout 600 bash -c "until [ \"\$('$adb' -s $serial shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do sleep 5; done"
          "$adb" -s "$serial" shell getprop ro.build.version.sdk
          # 整套跑一个多小时，默认缓冲只留得住最后十几分钟；2026-10-28 剪贴板导出的间歇失败发生在 00:51，失败后收的 logcat 从 01:07 才开始，输入法那段日志已被冲掉。调大主缓冲，收日志时还看得到中途失败的那一段。
          "$adb" -s "$serial" logcat -G 32M || true
      - name: Run the client-base, client-core, client-providers and client-services unit tests on the AVD
        run: MSIME_ANDROID_TEST_SERIAL="$SERIAL" bash platforms/android/tests/device/build-core-test.sh x86_64
      - name: Build the APK
        # 两个 API 级别的 NumberPadDeviceSmoke 都会切换笔画和注音键面，测试包必须具备锁定的语言词库；缺失时产品会正常回退到拼音。背单词的设备验收（SettingsDeviceSmoke -e vocabulary true）要读 APK 里的内置词书，所以也生成词书并要求它们进包。
        env:
          MSIME_REQUIRE_LANGUAGE_DICTIONARIES: '1'
          MSIME_REQUIRE_WORDBOOKS: '1'
        run: |
          set -euo pipefail
          if [[ "$MSIME_REQUIRE_LANGUAGE_DICTIONARIES" == 1 ]]; then
            python3 scripts/fetch_language_dictionaries.py
          fi
          python3 scripts/fetch_wordbooks.py
          bash platforms/windows/bootstrap-vcpkg.sh
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources --locked -- target/resources)"
          bash platforms/android/build-apk.sh "$resource_dir"
      - name: Install, prepare resources and accept input on the AVD
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p target/android
          bash platforms/android/tests/device/smoke.sh "$SERIAL" ${{ matrix.smoke }} 2>&1 | tee target/android/device-smoke.log
      - name: Collect device logs
        if: (failure() || cancelled()) && env.SERIAL != ''
        run: |
          mkdir -p target/android
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 30 "$adb" -s "$SERIAL" logcat -d > target/android/logcat.txt 2>&1 || true
          timeout 30 "$adb" -s "$SERIAL" logcat -d -b crash > target/android/crash.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: android-device-api${{ matrix.api }}-logs
          path: |
            target/android/emulator.log
            target/android/logcat.txt
            target/android/crash.txt
            target/android/device-smoke.log
          if-no-files-found: ignore
      - name: Stop the AVD
        if: always() && env.SERIAL != ''
        run: 'timeout 15 "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$SERIAL" emu kill || true'
