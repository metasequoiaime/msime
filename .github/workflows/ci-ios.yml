name: iOS CI

# iOS 的模拟器套件与手写识别。iOS 的改动不该让 macOS 的编译器跑起来,反过来也一样 —— 这两半原来同在 ci.yml 里,任何一次改动都要两边都编一遍。
#
# 触发条件不按路径过滤,而是文件内部先算一遍改动范围,再决定重活跑不跑。分支保护是按 job 名字要求检查的:workflow 整个没被触发时它什么都不上报,PR 就永远卡在等一个不会来的检查上;而在 workflow 内部被 `if:` 跳过的 job 会上报 skipped,那是算通过的。

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - CHANGELOG.md
      - PRIVACY.md
      - README.md
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - PRIVACY.md
      - README.md
  workflow_dispatch:

  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Decide whether iOS needs building
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed paths
        id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # 手动触发和合并队列一律构建:前者是有人明确要这一次,后者是合并前最后一道,两种情况都不该由路径来猜。
          if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 推到 develop 不构建，理由同 ci-macos.yml：PR 上已经跑过，合并后再跑一遍只是抢 macOS runner。推到 main 照常构建。
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/develop ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "推到 develop，跳过构建。"; exit 0
          fi
          # 拿不到可比的两端时也构建。范围算不出来不等于没有改动,而少构建一次的代价是把问题放过去。
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR 要比的是它自己从分叉点起改了什么（三个点）。base.sha 是事件发生时目标分支的最新提交，PR 分支往往从更早的 develop 切出；两个点的 diff 比的是两棵树，会把分叉之后 develop 合进来的改动也算成本 PR 的，于是只改一个 workflow 的 PR 也被判成要编译全部平台（2026-10-02 #2902）。push 的 BASE_SHA 是推送前的提交，两个点正好是这次推送带来的改动。
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          else
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          printf '改动文件:\n%s\n' "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              platforms/ios/*)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "iOS 改动: $path"; exit 0 ;;
              shared/*|.github/workflows/ci-ios.yml)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "共享输入改动: $path"; exit 0 ;;
              # 同 ci-macos.yml:工作区清单与工具链,以及 build-native.sh 的 cargo build -p msime-host-api
              # 和它依赖的三个 crate(client-core 的 example 也由本工作流运行)。
              Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|crates/host-api/*|crates/client-core/*|crates/engine/*|crates/input-runtime/*)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "Rust 输入改动: $path"; exit 0 ;;
              # 同 ci-macos.yml:scripts/ 下只有真正进得了这条构建的才触发。run_ui_tests.sh 在 platforms/ios/scripts/ 下,已由 platforms/ios/* 覆盖。
              # fetch_voice_runtime.py 与它读的 lock 决定 MSIMEApp 嵌入的 sherpa-onnx 运行时。
              scripts/fetch_voice_runtime.py|resources/voice-runtime.lock.json)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "构建脚本改动: $path"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "本次改动不涉及iOS,跳过构建。"

  ios:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    name: iOS Simulator
    # Everything except the three handwriting cases, on arm64, always. Only MLKitDigitalInkRecognition
    # needs an Intel runner -- its arm64 slice is built for devices, so there is none to link against
    # on an Apple Silicon Simulator -- and only MetasequoiaKeyboardTests/HandwritingTests needs it.
    # The interface suite does not, and used to be dragged onto Intel with it: a twenty-five minute
    # test build before a case ran, then thirty-seven cases on a Simulator half the speed of an arm64
    # one. The handwriting cases are their own job now, so neither waits on the other.
    runs-on: macos-15
    # 这个上限盖住整个 job,比里面那一步还先到期 —— 2026-09-18 砍掉一次 `all` 范围的运行就是它:job 跑到 60 分 24 秒被砍,而那一步自己才 58 分。两处要一起调,只改里面那个不起作用。
    timeout-minutes: 95
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MSIME_IOS_SKIP_HANDWRITING: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install project generator
        run: |
          brew install xcodegen
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Test shared account transport and session lifecycle
        run: swift test --package-path shared/backend
      - name: Validate keyboard configuration
        run: |
          python3 platforms/ios/tests/settings/ProjectConfigurationTests.py
          if [[ -f platforms/ios/tests/DictionaryPackagingTests.py ]]; then python3 platforms/ios/tests/DictionaryPackagingTests.py; fi
          # 提交 TestFlight 审核那段只在发布当天跑,而那一天出错的代价是一次失败的发布。缺 pyjwt 时它自己跳过。
          if [[ -f platforms/ios/tests/TestFlightSubmissionTests.py ]]; then python3 platforms/ios/tests/TestFlightSubmissionTests.py; fi
      - name: Package iOS dictionary
        run: |
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources -- target/resources)"
          bash platforms/ios/stage-resources.sh "$resource_dir"
      # project.yml gives the unit targets `LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/../../target/ios/simulator` and `-lmsime_host_api`, and nothing in this job produced that directory, so the test build reached the linker and stopped at "library 'msime_host_api' not found". build-native.sh is what fills it; it needs only the Rust simulator target installed. Not added to the Intel handwriting job: that simulator is x86_64 and build-native.sh's simulator variant is aarch64-apple-ios-sim.
      - name: Build the iOS host library
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios-sim
          bash platforms/ios/build-native.sh simulator
          test -f target/ios/simulator/libmsime_host_api.a
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          # MSIMEApp embeds the sherpa-onnx runtime for on-device dictation; it is fetched and verified against resources/voice-runtime.lock.json, never committed.
          python3 scripts/fetch_voice_runtime.py --platform ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root platforms/ios
          if [ "${MSIME_IOS_SKIP_HANDWRITING}" != "1" ]; then
            pod install --deployment --project-directory=platforms/ios
          fi
      - name: Test native iOS keyboard and settings
        # The full interface suite runs where it gates something: the pull request that promotes
        # develop to main, and main itself. Everywhere else runs the unit suites and the handful of
        # interface cases in the pr scope.
        #
        # It used to run on every push to develop, which is after the merge -- 29 minutes of walking
        # the app to tell us something a dozen times a day, blocking nothing, while the promotion
        # that actually ships ran the cheap scope. The expensive scope belongs at the gate.
        #
        # The interface suite dominates either way -- each case is a cold launch and a walk through
        # the app -- so it runs its classes across cloned Simulators rather than one after another.
        # The runner has the cores; a single Simulator was leaving most of them idle.
        #
        # The cap is what the whole suite took on arm64 before that, with room to spare, rather than
        # a number the suite has to fit inside. The 110 it used to carry was for an Intel runner
        # doing this work on a Simulator half the speed, and a 25-minute build in front of it.
        #
        # The cap has to cover the build as well: run_ui_tests.sh does build-for-testing and test-without-building in the one step, so a compile from cold is inside the budget along with the whole suite.
        #
        # 90 rather than 60, because 60 stopped catching hangs and started catching the suite. The `all` scope measured 38m43s, then 48m00s, then ran past 58 minutes and was killed with the tests still going -- and a killed run prints nothing at all, because xcodebuild only flushes its per-case lines at the end. So the cost of a tight cap is not a slower gate, it is a red run that says nothing about why. A hang is open-ended and 90 catches it just as well.
        env:
          # 全量只跑在进 main 的 PR 上。push 到 main 是紧接着的第二遍,内容和刚绿的那个 PR 头一模一样 —— 一次发布为此付两轮,而第二轮没有任何一条是新的。
          MSIME_TEST_SCOPE: ${{ github.base_ref == 'main' && 'all' || 'pr' }}
          MSIME_TEST_SHARD: ${{ github.base_ref == 'main' && 'rest' || '' }}
        timeout-minutes: 90
        run: bash platforms/ios/scripts/run_ui_tests.sh
      - name: Upload iOS test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: build/ios-derived/Logs/Test/*.xcresult
          retention-days: 7


  # 全量套件的另一半。分成两个 job 而不是一个 matrix:分支保护按 job 名认必需检查,而 matrix 的 job 被 job 级 if 跳过时上报的是没展开的名字(#519 就是栽在这上面),`iOS Simulator` 这个名字必须原样留着。
  #
  # 切在哪里见 run_ui_tests.sh 的 MSIME_TEST_SHARD:实测 SettingsUITests 743.8s 加 SkinUITests 706.6s 合 1451 秒,其余全部加起来 1173 秒。两边各跑一半,墙钟从一小时出头降到半小时上下,一条用例都不少。
  ios-heavy-interface:
    needs: changes
    # 整片只在进 main 的 PR 上有事做,其余情况连构建都不必起。job 级的条件在非 matrix 的 job 上是安全的 —— #519 那个「跳过时上报没展开的名字」只发生在 matrix 上。
    if: ${{ needs.changes.outputs.build == 'true' && github.base_ref == 'main' }}
    name: iOS Simulator (settings and skins)
    # Everything except the three handwriting cases, on arm64, always. Only MLKitDigitalInkRecognition
    # needs an Intel runner -- its arm64 slice is built for devices, so there is none to link against
    # on an Apple Silicon Simulator -- and only MetasequoiaKeyboardTests/HandwritingTests needs it.
    # The interface suite does not, and used to be dragged onto Intel with it: a twenty-five minute
    # test build before a case ran, then thirty-seven cases on a Simulator half the speed of an arm64
    # one. The handwriting cases are their own job now, so neither waits on the other.
    runs-on: macos-15
    # 这个上限盖住整个 job,比里面那一步还先到期 —— 2026-09-18 砍掉一次 `all` 范围的运行就是它:job 跑到 60 分 24 秒被砍,而那一步自己才 58 分。两处要一起调,只改里面那个不起作用。
    timeout-minutes: 95
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MSIME_IOS_SKIP_HANDWRITING: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install project generator
        run: |
          brew install xcodegen
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Test shared account transport and session lifecycle
        run: swift test --package-path shared/backend
      - name: Validate keyboard configuration
        run: |
          python3 platforms/ios/tests/settings/ProjectConfigurationTests.py
          if [[ -f platforms/ios/tests/DictionaryPackagingTests.py ]]; then python3 platforms/ios/tests/DictionaryPackagingTests.py; fi
          # 提交 TestFlight 审核那段只在发布当天跑,而那一天出错的代价是一次失败的发布。缺 pyjwt 时它自己跳过。
          if [[ -f platforms/ios/tests/TestFlightSubmissionTests.py ]]; then python3 platforms/ios/tests/TestFlightSubmissionTests.py; fi
      - name: Package iOS dictionary
        run: |
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources -- target/resources)"
          bash platforms/ios/stage-resources.sh "$resource_dir"
      # project.yml gives the unit targets `LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/../../target/ios/simulator` and `-lmsime_host_api`, and nothing in this job produced that directory, so the test build reached the linker and stopped at "library 'msime_host_api' not found". build-native.sh is what fills it; it needs only the Rust simulator target installed. Not added to the Intel handwriting job: that simulator is x86_64 and build-native.sh's simulator variant is aarch64-apple-ios-sim.
      - name: Build the iOS host library
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios-sim
          bash platforms/ios/build-native.sh simulator
          test -f target/ios/simulator/libmsime_host_api.a
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          # MSIMEApp embeds the sherpa-onnx runtime for on-device dictation; it is fetched and verified against resources/voice-runtime.lock.json, never committed.
          python3 scripts/fetch_voice_runtime.py --platform ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root platforms/ios
          if [ "${MSIME_IOS_SKIP_HANDWRITING}" != "1" ]; then
            pod install --deployment --project-directory=platforms/ios
          fi
      - name: Test native iOS keyboard and settings
        # The full interface suite runs where it gates something: the pull request that promotes
        # develop to main, and main itself. Everywhere else runs the unit suites and the handful of
        # interface cases in the pr scope.
        #
        # It used to run on every push to develop, which is after the merge -- 29 minutes of walking
        # the app to tell us something a dozen times a day, blocking nothing, while the promotion
        # that actually ships ran the cheap scope. The expensive scope belongs at the gate.
        #
        # The interface suite dominates either way -- each case is a cold launch and a walk through
        # the app -- so it runs its classes across cloned Simulators rather than one after another.
        # The runner has the cores; a single Simulator was leaving most of them idle.
        #
        # The cap is what the whole suite took on arm64 before that, with room to spare, rather than
        # a number the suite has to fit inside. The 110 it used to carry was for an Intel runner
        # doing this work on a Simulator half the speed, and a 25-minute build in front of it.
        #
        # The cap has to cover the build as well: run_ui_tests.sh does build-for-testing and test-without-building in the one step, so a compile from cold is inside the budget along with the whole suite.
        #
        # 90 rather than 60, because 60 stopped catching hangs and started catching the suite. The `all` scope measured 38m43s, then 48m00s, then ran past 58 minutes and was killed with the tests still going -- and a killed run prints nothing at all, because xcodebuild only flushes its per-case lines at the end. So the cost of a tight cap is not a slower gate, it is a red run that says nothing about why. A hang is open-ended and 90 catches it just as well.
        env:
          # 全量只跑在进 main 的 PR 上。push 到 main 是紧接着的第二遍,内容和刚绿的那个 PR 头一模一样 —— 一次发布为此付两轮,而第二轮没有任何一条是新的。
          MSIME_TEST_SCOPE: ${{ github.base_ref == 'main' && 'all' || 'pr' }}
          MSIME_TEST_SHARD: ${{ github.base_ref == 'main' && 'heavy' || '' }}
        timeout-minutes: 90
        run: bash platforms/ios/scripts/run_ui_tests.sh
      - name: Upload iOS test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results-settings-and-skins
          path: build/ios-derived/Logs/Test/*.xcresult
          retention-days: 7

  ios-handwriting:
    needs: changes
    name: iOS Handwriting
    # The three cases that need MLKitDigitalInkRecognition, which has no arm64 Simulator slice, and therefore the only ones that still need an Intel runner. They are here rather than in the job above so that the interface suite does not wait behind an Intel build for a dependency it does not use.
    #
    # It used to say three and run seven: the runner skipped the whole HandwritingTests class on arm64, so the four cases in it that never touch recognition -- hit testing, panel height, stroke undo -- only ever ran here, behind a twenty-five minute Intel build, and never on a pull request at all. They run on arm64 now, in two and a half seconds, and this job is the three that are left.
    #
    # Deferred to the gate rather than to merge, which is where the interface suite already sits for the same reason. On a develop push this was the critical path by a wide margin -- 25 to 31 minutes against 19 for the next longest job -- and it gated nothing: the pull request run is the gate, and this job was skipped there. A regression in the ML Kit integration now surfaces on the promotion to main rather than on the merge that caused it.
    if: ${{ needs.changes.outputs.build == 'true' && (github.base_ref == 'main' || github.ref_name == 'main') }}
    runs-on: macos-15-intel
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MSIME_IOS_SKIP_HANDWRITING: '0'
      MSIME_TEST_SCOPE: handwriting
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install project generator
        run: |
          brew install xcodegen
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
      - name: Package iOS dictionary
        run: |
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources -- target/resources)"
          bash platforms/ios/stage-resources.sh "$resource_dir"
      - name: Generate Xcode project
        run: |
          mkdir -p build/ios
          # MSIMEApp embeds the sherpa-onnx runtime for on-device dictation; it is fetched and verified against resources/voice-runtime.lock.json, never committed.
          python3 scripts/fetch_voice_runtime.py --platform ios
          xcodegen generate --spec platforms/ios/project.yml --project build/ios --project-root platforms/ios
          pod install --deployment --project-directory=platforms/ios
      - name: Test handwriting recognition
        run: bash platforms/ios/scripts/run_ui_tests.sh
      - name: Upload handwriting test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-handwriting-test-results
          path: build/ios-derived/Logs/Test/*.xcresult
          retention-days: 7
