name: macOS package

# macOS 发布包的打包检查：发布包只带核心词库，日文词典、五笔码表、粤拼/注音词库和手写模型由 App 按需下载。这里确认核心词库的暂存规则、按需资源包仍能按锁文件下载，并在 Apple 芯片的 runner 上真打一次未签名的 universal pkg 安装包、展开核对它的结构，让打包脚本的问题在发布当天之前暴露出来。
#
# 这不是分支保护要求的检查，也不在 PR 上跑：打包是合进 develop 之后的事，功能分支只需要编译和测试（见 .agents/notes/implemented/process/2026-10-09-no-packaging-on-pull-requests.md）。推到 develop 时在文件内部算这次推送的改动范围，没碰打包输入的推送里后面的 job 被 `if:` 跳过、上报 skipped。每周一次的定时运行不看路径，资源包地址失效最多隔一周就会报出来。

on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * 0"

# 不设 concurrency：develop 上一次推送碰了打包输入、紧接着的推送没碰时，取消前一次就等于这次改动从没打过包。没碰打包输入的运行十几秒就结束。

permissions:
  contents: read

jobs:
  changes:
    name: Decide whether the macOS package needs checking
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.decide.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed paths
        id: decide
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 手动触发和定时运行一律检查：前者是有人明确要这一次，后者要发现的正是与改动无关的资源包地址失效。
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo "package=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 拿不到可比的两端时也检查，范围算不出来不等于没有改动。
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null || ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
            echo "package=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # push 的 BASE_SHA 是推送前的提交，两个点正好是这次推送带来的改动。
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf '改动文件:\n%s\n' "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              # 打包输入：打包脚本、安装包的模板和渲染脚本、Tauri 的 macOS 资源声明、核心词库和三个资源包的锁、决定暂存与下载的 client-core、client-providers 代码和示例、发布工作流和这个文件。scripts/test-macos-package-resources.py 核对这份清单覆盖了每个打包输入。
              platforms/macos/package-release.sh|platforms/macos/scripts/settings_updater.py|platforms/macos/stage-resources.sh|apps/desktop/src-tauri/tauri.macos.conf.json)
                echo "package=true" >> "$GITHUB_OUTPUT"; echo "打包脚本改动: $path"; exit 0 ;;
              platforms/macos/scripts/installer_package.py|platforms/macos/scripts/edition_bundle.py|platforms/macos/resources/installer/*)
                echo "package=true" >> "$GITHUB_OUTPUT"; echo "打包脚本改动: $path"; exit 0 ;;
              resources/desktop-dictionary.lock.json|resources/language-dictionaries.lock.json|resources/handwriting-model.lock.json|resources/offline-glosses.lock.json|resources/voice-runtime-macos.lock.json|resources/wordbook.lock.json|scripts/fetch_wordbooks.py)
                echo "package=true" >> "$GITHUB_OUTPUT"; echo "资源锁改动: $path"; exit 0 ;;
              crates/client-core/src/resources.rs|crates/client-providers/src/resource_packs.rs|crates/client-providers/src/voice/local_models.rs)
                echo "package=true" >> "$GITHUB_OUTPUT"; echo "资源代码改动: $path"; exit 0 ;;
              crates/client-core/examples/install_resources.rs|crates/client-core/examples/verify_resources.rs|crates/client-providers/examples/install_resource_pack.rs)
                echo "package=true" >> "$GITHUB_OUTPUT"; echo "资源示例改动: $path"; exit 0 ;;
              .github/workflows/release-macos.yml|.github/workflows/ci-macos-package.yml)
                echo "package=true" >> "$GITHUB_OUTPUT"; echo "工作流改动: $path"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "package=false" >> "$GITHUB_OUTPUT"
          echo "本次改动不涉及 macOS 打包输入，跳过。"

  layout:
    name: Core-only resource layout
    needs: changes
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # install_resources 发现目录里已有校验通过的文件就不再下载；按锁文件的哈希做键，锁一变就重新下载。
      - name: Cache the pinned desktop resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/desktop-resources
          key: desktop-resources-${{ runner.os }}-${{ hashFiles('resources/desktop-dictionary.lock.json') }}
      # Installs the toolchain rust-toolchain.toml pins.
      - name: Install Rust
        run: rustup toolchain install
      - name: Install the pinned desktop resources
        run: |
          set -euo pipefail
          mkdir -p target/desktop-resources
          resources="$(cargo run --quiet --locked -p msime-client-core --example install_resources -- "$PWD/target/desktop-resources" | tail -n 1)"
          test -d "$resources"
          echo "MSIME_DESKTOP_RESOURCES=$resources" >> "$GITHUB_ENV"
      - name: Stage the core-only resources
        run: MSIME_MACOS_OMIT_ON_DEMAND=1 bash platforms/macos/stage-resources.sh "$MSIME_DESKTOP_RESOURCES"
      - name: Check the staged layout
        run: |
          set -euo pipefail
          staged=target/macos/EngineResources
          test ! -e "$staged/msime-japanese.dat"
          test ! -e "$staged/msime-mozc_dictionary_oss_README.txt"
          test ! -e "$staged/msime-mozc_LICENSE.txt"
          test ! -e "$staged/msime-wubi.db"
          test -f "$staged/msime-pinyin.db"
          test -f "$staged/msime-scowl_Copyright.txt"
          test -f "$staged/helpcodes/helpcode.txt"
          cargo run --quiet --locked -p msime-client-core --example verify_resources -- --omit-on-demand --platform macos "$staged"
          du -sk "$staged"
      - name: Check the packaging contract
        run: python3 scripts/test-macos-package-resources.py
      # 与 App 运行时同一个安装器、同一组 URL 和 SHA-256：macOS 会下载的资源包都要能装上，发布出去的 App 才能补齐它们。重签的语音运行库在 resources/voice-runtime-macos.lock.json 固定之后才有，也一起装。离线释义和 Android 的语音运行库只给 Android 按需下载，不在这里装。这里的未签名包照旧内置运行库（package-release.sh 只在签名的 Team ID 与锁文件相同时省略），所以下载的那份只能在这里查。
      - name: Install every macOS on-demand resource pack
        run: |
          set -euo pipefail
          packs=(japanese wubi language-dictionaries handwriting settled-model)
          if python3 -I -c 'import json, sys; sys.exit(0 if json.load(open("resources/voice-runtime-macos.lock.json"))["archive"] else 1)'; then
            packs+=(voice-runtime-macos)
          fi
          cargo run --quiet --locked -p msime-client-providers --example install_resource_pack -- "$RUNNER_TEMP/resource-pack-check" "${packs[@]}"

  package:
    name: Unsigned universal package
    needs: [changes, layout]
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: depot-macos-26
    timeout-minutes: 120
    env:
      # 与 release-macos.yml 同一个 Xcode，打出来的才是发布那个包。
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Install dependencies
        run: brew install nlohmann-json
      # 与 release-macos.yml 相同的 Sparkle 版本、摘要和缓存键。
      - name: Cache the pinned Sparkle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle-archive
          key: sparkle-2.9.6-${{ runner.os }}-${{ hashFiles('platforms/macos/CMakeLists.txt') }}
      - name: Prepare pinned Sparkle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-archive"
          archive="$RUNNER_TEMP/sparkle-archive/Sparkle-2.9.6.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
              --output "$archive"
          fi
          printf '%s  %s\n' \
            '52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192' \
            "$archive" | shasum -a 256 --check
          rm -rf "$RUNNER_TEMP/sparkle"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"
          test -d "$RUNNER_TEMP/sparkle/Sparkle.framework"
          echo "MSIME_SPARKLE_ROOT=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Enable pnpm
        run: corepack enable
      - name: Add the Rust targets for the universal package
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Fetch the locked offline candidate glosses
        run: python3 scripts/fetch_offline_glosses.py
      - name: Fetch the locked English gloss tables
        run: python3 scripts/fetch_gloss_tables.py
      # 背单词的内置词书：从锁定的 ECDICT 提交生成到 target/wordbooks，MSIME_REQUIRE_WORDBOOKS=1 让缺了它们的包打不出来。
      - name: Build the bundled wordbooks
        run: python3 scripts/fetch_wordbooks.py
      # 不签名、不公证：没有 MACOS_SIGNING_IDENTITY 和 MACOS_INSTALLER_IDENTITY 时 package-release.sh 用 ad-hoc 签名应用、出未签名的 pkg，其余步骤和发布完全相同，包括编译前的资源包可下载检查、check_app 的缺席与体积检查，以及展开安装包后对分发文件、PackageInfo（安装到 /Applications、没有可重定位的组件）、Bom（只在应用目录下）、postinstall 和载荷里的应用的检查。
      - name: Build the macOS package
        env:
          MSIME_REQUIRE_WORDBOOKS: '1'
        run: bash platforms/macos/package-release.sh "$(tr -d '[:space:]' < platforms/macos/version.txt)" "$RUNNER_TEMP/dist"
      # 结构已由 package-release.sh 的 finish_edition 核对过；这里把 PackageInfo 和分发文件打进日志和摘要，改动安装包时不用下载 artifact 也能看到实际内容。
      - name: Report the package
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/dist"
          expanded="$RUNNER_TEMP/expanded"
          rm -rf "$expanded"
          pkgutil --expand "$RUNNER_TEMP/dist/msime-macos-$(tr -d '[:space:]' < platforms/macos/version.txt)-universal.pkg" "$expanded"
          cat "$expanded/Distribution" "$expanded"/*.pkg/PackageInfo
          {
            echo '### macOS package (unsigned)'
            echo
            echo '```'
            ls -l "$RUNNER_TEMP/dist"
            echo '```'
            echo
            echo '```xml'
            cat "$expanded"/*.pkg/PackageInfo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-macos-package-${{ github.run_id }}
          path: ${{ runner.temp }}/dist/
          retention-days: 7
          if-no-files-found: error
