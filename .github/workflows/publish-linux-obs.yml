name: Publish Linux to OBS

# 把已发布的 linux-vX.Y.Z 提交到 openSUSE OBS（项目 home:<OBS_USER>），由 OBS 按发行版构建、签名并托管 apt、dnf 与 zypper 软件源，用户添加源之后就能 apt/dnf/zypper install msime（见 platforms/linux/README.md「包管理器」）。Release Linux 发布成功后调用它；提交失败时也可以单独手动触发，重新提交同一个版本，不用重新发版。
#
# 包定义取自 linux-vX.Y.Z 那个提交，由 render-definitions.sh 现场渲染，两个源码 tarball 从发布页下载并对着 SHA256SUMS 核对；上传和项目配置在 platforms/linux/packaging/obs/publish.sh。
# 凭据是组织 secret OBS_USER 与 OBS_PASSWORD；没有配置时只留一条警告，不让发版失败。
on:
  workflow_call:
    inputs:
      version: {required: true, type: string}
    secrets:
      OBS_USER: {required: false}
      OBS_PASSWORD: {required: false}
  workflow_dispatch:
    inputs:
      version: {description: "Version of an existing linux-vX.Y.Z release (X.Y.Z)", required: true, type: string}
permissions: {contents: read}
concurrency: {group: publish-linux-obs, cancel-in-progress: false}
jobs:
  obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check credentials and version
        id: check
        env: {OBS_USER: "${{ secrets.OBS_USER }}", OBS_PASSWORD: "${{ secrets.OBS_PASSWORD }}", VERSION: "${{ inputs.version }}"}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got '$VERSION'" >&2; exit 1; }
          if [[ -z "$OBS_USER" || -z "$OBS_PASSWORD" ]]; then
            echo "::warning::OBS_USER or OBS_PASSWORD is not set; linux-v$VERSION was not submitted to OBS."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.check.outputs.skip == 'false' }}
        with: {ref: "linux-v${{ inputs.version }}", persist-credentials: false}
      # 发布脚本和 OBS 配置取自触发这次运行的提交，不是发布的那个提交：linux-vX.Y.Z 可能早于这些文件出现。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.check.outputs.skip == 'false' }}
        with: {path: tools, sparse-checkout: platforms/linux/packaging/obs, persist-credentials: false}
      - name: Install osc
        if: ${{ steps.check.outputs.skip == 'false' }}
        run: pipx install osc==1.27.3
      # 口令只写进 runner 临时目录里仅本用户可读的配置文件，不出现在命令行或日志里。
      - name: Configure osc
        if: ${{ steps.check.outputs.skip == 'false' }}
        env: {OBS_USER: "${{ secrets.OBS_USER }}", OBS_PASSWORD: "${{ secrets.OBS_PASSWORD }}"}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/oscrc"
          umask 077
          printf '[general]\napiurl = https://api.opensuse.org\n\n[https://api.opensuse.org]\nuser = %s\npass = %s\ncredentials_mgr_class = osc.credentials.PlaintextConfigFileCredentialsManager\n' "$OBS_USER" "$OBS_PASSWORD" > "$config"
          echo "OSC_CONFIG=$config" >> "$GITHUB_ENV"
      # 渲染脚本对着 SHA256SUMS 核对 MSIME_RELEASE_DIR 里的文件，上传用的就是核对过的这两个 tarball。两个架构的 .rpm 给 Arch 仓库：OBS 的 Arch 配方会跑 makepkg --allsource，PKGBUILD 列出的每个架构的 source 都要在包里（见 publish.sh）。0.11.0 之前的发布没有 aarch64 的 .rpm，匹配不到的模式 gh 不报错。
      - name: Download the release's source tarballs
        if: ${{ steps.check.outputs.skip == 'false' }}
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", VERSION: "${{ inputs.version }}"}
        run: gh release download "linux-v$VERSION" --dir target/release --pattern SHA256SUMS --pattern "msime-$VERSION.tar.xz" --pattern "msime-$VERSION-vendor.tar.xz" --pattern "msime-linux-$VERSION-1.x86_64.rpm" --pattern "msime-linux-$VERSION-1.aarch64.rpm"
      - name: Render the RPM, Debian and Arch definitions
        if: ${{ steps.check.outputs.skip == 'false' }}
        env: {VERSION: "${{ inputs.version }}", MSIME_DEFINITIONS: "rpm,debian,arch", MSIME_RELEASE_DIR: target/release}
        run: bash platforms/linux/packaging/render-definitions.sh "$VERSION" target/package-definitions
      - name: Submit to OBS
        if: ${{ steps.check.outputs.skip == 'false' }}
        env: {VERSION: "${{ inputs.version }}"}
        run: bash tools/platforms/linux/packaging/obs/publish.sh "$VERSION" target/package-definitions target/release
