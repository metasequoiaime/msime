name: Release Android
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/android/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as an android-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
      play_track: {description: 正式版的 AAB 上传到哪条 Google Play 轨道（alpha 是封闭测试）；none 只留 workflow artifact，Play 上第一个包要手动上传时用它, required: false, default: alpha, type: choice, options: [none, internal, alpha, beta, production]}
      play_status: {description: 在 Play 上建成的版本状态：draft 要有人在 Play Console 里点发布，completed 直接推给这条轨道的用户（应用还没通过过审核时 Play 只接受 draft）, required: false, default: draft, type: choice, options: [draft, completed]}
  workflow_call:
    inputs:
      version: {description: Semantic version, required: false, default: '', type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build, required: false, default: false, type: boolean}
      play_track: {description: Google Play track for the final release bundle (none skips the upload), required: false, default: none, type: string}
      play_status: {description: Status of the Google Play release (draft or completed), required: false, default: draft, type: string}
permissions: {contents: write}
concurrency: {group: release-android, cancel-in-progress: false}
jobs:
  # Resolves the dispatched commit up front, so every edition and the publish job (tag target, release notes) use the same source even if the branch moves during the run.
  source:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
  # 每个版本（shared/contracts/editions.json 里有 Android 段的 id，也是 gradle-app 的 flavor 名）各打一个 APK，applicationId 各不相同，可以同时装在一台设备上。full 的 applicationId 与引入版本之前相同，已安装的应用照常原地升级；APK 名是 msime-android.apk（各版本是 msime-android-<id>.apk）。
  release:
    needs: source
    # 留在 GitHub 托管的 runner 上，不要搬到 Depot：这个 job 不论 publish 与否都会解码发版签名密钥。APK 经 GitHub release 分发、靠应用内更新，没有 Play App Signing 托底，这把钥匙泄露后无法更换，换了现有用户就收不到更新。只做构建、不碰长期凭据的 job 才放 Depot。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        edition: [full, wubi, pinyin, japanese, vietnamese, tibetan]
    # full 和拼音版打瘦包（build-apk.sh 的 MSIME_ANDROID_OMIT_ON_DEMAND）：日文词典、五笔码表、粤拼注音笔画语言词库、非英文离线释义和本地语音运行库都不进 APK，由应用在用户需要时作为资源包下载。日文版的主词库就是日文词典，五笔版的默认方案离不开五笔码表，其余版本没有这些附加资源，照旧按自己的资源锁打包。
    env:
      MSIME_ANDROID_OMIT_ON_DEMAND: "${{ (matrix.edition == 'full' || matrix.edition == 'pinyin') && '1' || '0' }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      # The packages keep the plain X.Y.Z (Info.plist, versionName, Tauri, deb and rpm metadata take nothing else); the release tag and title carry the branch the run was dispatched from: none on main, -beta on develop, -alpha anywhere else. A suffixed release is always published as a prerelease, which the in-app update checks skip.
      - id: version
        env: {REQUESTED: "${{ inputs.version }}", EDITION: "${{ matrix.edition }}", PUBLISH: "${{ inputs.publish }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/android/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in main) suffix= ;; develop) suffix=-beta ;; *) suffix=-alpha ;; esac; echo "release=${version}${suffix}" >> "$GITHUB_OUTPUT"
          # 只有发布的正式版另打一份给 Google Play 的 AAB（只有 full 上架 Play）。beta、alpha 的 versionCode 与随后的正式版相同，Play 不接受重复的 versionCode，所以它们不进 Play。
          if [[ "$EDITION" == full && "$PUBLISH" == true && -z "$suffix" ]]; then echo "bundle=true" >> "$GITHUB_OUTPUT"; else echo "bundle=false" >> "$GITHUB_OUTPUT"; fi
      # build-apk.sh takes the directory install_resources verified and unpacked, not the repository's
      # resources/ directory -- that one holds the lock files install_resources reads.
      # build-apk.sh packs target/offline-glosses when it is there. full 和拼音版的瘦包改为按需下载离线释义，只有其余版本还要取；粤拼、注音和笔画词库原先只有 full 随包，现在也按需下载，没有版本再需要它们，所以不再取。
      - name: Fetch the locked offline candidate glosses
        if: env.MSIME_ANDROID_OMIT_ON_DEMAND != '1'
        run: python3 scripts/fetch_offline_glosses.py
      # 瘦包不带的资源包只能靠锁文件里的地址补齐：发布之前用 App 运行时的同一个安装器、同一组 URL 和 SHA-256 把这个版本会下载的资源包装一遍，地址失效或内容漂移就停在这里。拼音版不提供五笔、粤拼、注音和笔画，不用五笔码表和语言词库。
      - name: Install the on-demand resource packs the slim APK downloads
        if: env.MSIME_ANDROID_OMIT_ON_DEMAND == '1'
        run: |
          set -euo pipefail
          packs=(japanese offline-glosses voice-runtime pronunciations target-pronunciations)
          if [ "${{ matrix.edition }}" = full ]; then packs+=(language-dictionaries wubi); fi
          cargo run --quiet -p msime-client-providers --example install_resource_pack -- "$RUNNER_TEMP/resource-pack-check" "${packs[@]}" >/dev/null
      # 背单词的内置词书：从锁定的 ECDICT 提交生成到 target/wordbooks，build-apk.sh 打进 assets/wordbooks。词书不是按需资源包，每个版本（包括瘦包）都带；MSIME_REQUIRE_WORDBOOKS=1 让缺了它们的 APK 打不出来。
      - name: Build the bundled wordbooks
        run: python3 scripts/fetch_wordbooks.py
      # build-native.sh 需要固定提交的 vcpkg（只用来装 nlohmann-json）和 arm64 的 Android Rust target（build-apk.sh 默认只打 arm64-v8a）；runner 上都没有。bootstrap-vcpkg.sh 放在 platforms/windows 下但不限平台，装到 build-native.sh 默认读取的 target/tooling/vcpkg。
      # build-native.sh 只认固定的 NDK 28.2.13676358。此前一直靠 ubuntu-24.04 镜像碰巧预装它，镜像 20261002 起不再带这个版本，Android 0.2.1 第一次发布就因此失败。缺了就用 runner 自带的 sdkmanager 装上，装完再核对一次版本。
      - name: Install the pinned Android NDK
        run: bash platforms/android/install-ndk.sh
      - name: Prepare pinned vcpkg and Rust targets
        run: |
          set -euo pipefail
          bash platforms/windows/bootstrap-vcpkg.sh
          rustup target add aarch64-linux-android
      - name: Build native Android host
        # 发布包必须用仓库 secrets 里的发布密钥签名：此前用的是 runner 上临时生成的开发密钥，每次发版签名都不同，用户无法覆盖升级。缺少 secrets 时直接失败，不退回开发密钥。
        env:
          MSIME_ANDROID_VERSION: "${{ steps.version.outputs.value }}"
          MSIME_EDITION: "${{ matrix.edition }}"
          MSIME_REQUIRE_WORDBOOKS: '1'
          # build-apk.sh 把 GitHub APK 的体积和预警线、上限写到这里，下面不论构建成败都上传，nightly 的 android-size 据此开关体积跟踪 issue。
          MSIME_ANDROID_SIZE_REPORT: "${{ github.workspace }}/target/apk-size/${{ matrix.edition }}.json"
          PUBLISH: "${{ inputs.publish }}"
          BUNDLE: "${{ steps.version.outputs.bundle }}"
          RELEASE_KEYSTORE_BASE64: "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}"
          MSIME_ANDROID_RELEASE_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}"
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$MSIME_ANDROID_RELEASE_KEYSTORE_PASSWORD" ]] || { echo "ANDROID_RELEASE_KEYSTORE_BASE64 and ANDROID_RELEASE_KEYSTORE_PASSWORD must be provided together" >&2; exit 1; }
            export MSIME_ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/msime-release.p12"
            trap 'rm -f "$MSIME_ANDROID_RELEASE_KEYSTORE"' EXIT
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$MSIME_ANDROID_RELEASE_KEYSTORE"
          else
            echo '::notice::nightly/non-published Android build uses the local development keystore'
          fi
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources -- target/resources)"
          bash platforms/android/build-apk.sh "$resource_dir"
          # 按版本取 APK 名（full 是 msime-android，五笔版是 msime-android-wubi），放进 dist/ 交给汇总发布的那一步。
          apk_name="$(python3 platforms/android/scripts/edition_android.py field --edition "$MSIME_EDITION" apk_name)"
          mkdir -p dist
          cp "target/android/$apk_name.apk" dist/
          # Play 版：同一份资源再打一次，不带自更新、带着语音运行库，输出 AAB（build-apk.sh 的 MSIME_ANDROID_DISTRIBUTION）。放进单独的 artifact，不进 GitHub 发布页。
          if [[ "$BUNDLE" == true ]]; then
            MSIME_ANDROID_DISTRIBUTION=play bash platforms/android/build-apk.sh "$resource_dir"
            mkdir -p play
            cp "target/android/$apk_name.aab" play/
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-android-${{ matrix.edition }}-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
      - name: 保存原生调试符号和构建清单
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-symbols-android-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/android-symbols/*.zip
          if-no-files-found: error
          retention-days: 90
      - name: 长期保存发布构建的原生符号
        if: ${{ inputs.publish }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: bash scripts/publish-crash-symbols.sh android target/android-symbols/*.zip
      # 超过上限而失败的构建也上传它的体积报告，所以条件是没被取消且报告存在。名字不以 msime-android- 开头，理由同下。
      - name: Upload the APK size report
        if: ${{ !cancelled() && hashFiles(format('target/apk-size/{0}.json', matrix.edition)) != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-size-${{ matrix.edition }}
          path: target/apk-size/${{ matrix.edition }}.json
          if-no-files-found: error
      # 名字故意不以 msime-android- 开头：publish 按 msime-android-*-<版本> 收集发布页上的 APK。
      - if: steps.version.outputs.bundle == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: google-play-msime-android-${{ steps.version.outputs.value }}
          path: play/
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
  # 发布前在模拟器上装同一个提交打出的包跑一遍（API 28 和 35），不过就不发。0.3.0 编译、lint 全绿，装到设备上却准备不了词库。这里用开发密钥另打 x86_64 包，不接触发版密钥。
  device:
    needs: source
    uses: ./.github/workflows/android-device.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
  publish:
    needs: [source, release, device]
    # The build takes the dispatched commit, so publishing has to be asked for rather than implied. Without the gate a build of a feature branch cuts a real public release.
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-android-*-${{ needs.release.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Publish independent Android release
        # RELEASE_PUBLISH_TOKEN (org secret, a fine-grained token with Contents and Workflows write) creates the tag: GitHub refuses GITHUB_TOKEN a new ref whose .github/workflows differs from the default branch, which is the case whenever develop takes a workflow change while the release builds (Release Linux run 37259338700, 403 Resource not accessible by integration). Without the secret, as on a fork, it falls back to GITHUB_TOKEN.
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ needs.release.outputs.version }}", RELEASE: "${{ needs.release.outputs.release }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          # 每个版本的 APK 都要在，也不能多：少一个就不发，免得版本页上缺了某个版本的包。
          editions="$(python3 platforms/android/scripts/edition_android.py editions)"
          IFS=, read -r -a edition_list <<< "$editions"
          for edition in "${edition_list[@]}"; do
            apk_name="$(python3 platforms/android/scripts/edition_android.py field --edition "$edition" apk_name)"
            [[ -f "dist/$apk_name.apk" ]] || { echo "dist/$apk_name.apk for edition $edition is missing" >&2; exit 1; }
          done
          apks=(dist/*.apk)
          [[ ${#apks[@]} -eq ${#edition_list[@]} ]] || { echo "expected ${#edition_list[@]} APKs in dist, found ${#apks[@]}" >&2; exit 1; }
          # 版本发布页的 SHA256SUMS 只列这些 APK；新版本的应用内更新（UpdateApi）先读它。在 dist 里面算，行里写的才是不带路径的文件名。
          (cd dist && sha256sum -- *.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
          # 0.2.0 到 0.4.2 的应用内更新只认与 APK 同名的 <apk>.sha256，地址按新版本自己的 tag 拼（releases/download/<tag>/<apk>.sha256），缺了就拒绝更新；滚动 release 接不住这个地址，所以每个 APK 仍附一行 sha256sum 输出，什么时候撤掉由维护者看读 SHA256SUMS 的安装够多了再定，见 .agents/notes/implemented/process/2026-10-20-android-release-page-sha256sums.md。
          (cd dist && for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done)
          tag="android-v${RELEASE}"
          [[ "$RELEASE" == "$VERSION" ]] || export PRERELEASE=true
          # A re-run for the same version overwrites its release (scripts/publish-release.sh), so the notes start at the release before it rather than at its own tag. A final release starts at the previous final release, a -beta or -alpha one at the latest release of either kind.
          stable='^android-v[0-9]+\.[0-9]+\.[0-9]+$'; [[ "$RELEASE" == "$VERSION" ]] || stable=.
          start=$(git tag --list 'android-v*' --sort=-v:refname | grep -vxF "$tag" | grep -E "$stable" | head -1 || true)
          python3 scripts/generate-release-notes.py --platform android --version "$RELEASE" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output changes.md
          # 发布说明开头是从版本表生成的下载指引：六个 APK 各是什么、大多数人该下哪个。
          prerelease=(); [[ "$PRERELEASE" == true ]] && prerelease=(--prerelease)
          python3 platforms/android/scripts/edition_android.py download-guide --editions "$editions" \
            --download-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/" ${prerelease[@]+"${prerelease[@]}"} > release-notes.md
          { echo; cat changes.md; } >> release-notes.md
          # 重跑同一版本时 publish-release.sh 会删掉发布页上不在这份清单里的资产。
          bash scripts/publish-release.sh "$tag" "$(git rev-parse HEAD)" "Android ${RELEASE}" release-notes.md dist/*.apk dist/SHA256SUMS dist/*.apk.sha256
  pgyer:
    needs: [source, release, device, publish]
    if: inputs.publish
    strategy:
      fail-fast: false
      matrix:
        edition: [full, wubi, pinyin, japanese, vietnamese, tibetan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msime-android-${{ matrix.edition }}-${{ needs.release.outputs.version }}
          path: dist
      - name: Locate Android package
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/*.apk)
          [[ ${#apks[@]} -eq 1 ]] || { echo "expected one APK, found ${#apks[@]}" >&2; exit 1; }
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
      - name: Check Pgyer credentials
        id: pgyer-secret
        env:
          PGYER_API_KEY: "${{ secrets.PGYER_API_KEY }}"
        run: |
          if [[ -n "$PGYER_API_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Skip Pgyer upload when the repository secret is absent
        if: steps.pgyer-secret.outputs.configured != 'true'
        run: echo '::notice::PGYER_API_KEY is not configured; skipping Pgyer upload'
      - name: Upload Android package to Pgyer
        if: steps.pgyer-secret.outputs.configured == 'true'
        id: pgyer
        uses: PGYER/pgyer-upload-app-action@2cc249560d09c8b804607524fd1ebf0c84315879 # v2.0.0
        with:
          _api_key: "${{ secrets.PGYER_API_KEY }}"
          appFilePath: "${{ steps.package.outputs.path }}"
          buildUpdateDescription: "Android ${{ needs.release.outputs.version }} (${{ matrix.edition }})"
      - name: Record Pgyer download page
        if: steps.pgyer.outcome == 'success'
        run: |
          echo "${{ matrix.edition }}: ${{ steps.pgyer.outputs.appBuildURL }}" >> "$GITHUB_STEP_SUMMARY"
  # 把正式版的 AAB 传到 Google Play（只有 full 上架）。排在 GitHub 发布之后：发布页是权威的版本，它没发出去就不往 Play 传。条件与 release job 里打 AAB 的条件相同（发布的、不带后缀的正式版），另加选了轨道。
  play:
    needs: [source, release, publish]
    if: inputs.publish && inputs.play_track != 'none' && needs.release.outputs.release == needs.release.outputs.version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: google-play-msime-android-${{ needs.release.outputs.version }}
          path: play
      - name: Upload the bundle to Google Play
        # GOOGLE_PLAY_SERVICE_ACCOUNT_JSON 是 Google Cloud 里一个 service account 的 JSON 密钥，这个账号要在 Play Console 的「用户和权限」里有这个应用的发布权限。依赖装进临时 venv：runner 的系统 Python 是 externally-managed（PEP 668）。
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}"
          TRACK: "${{ inputs.play_track }}"
          STATUS: "${{ inputs.play_status }}"
          VERSION: "${{ needs.release.outputs.version }}"
        run: |
          set -euo pipefail
          [[ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]] || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON must be set to upload to Google Play" >&2; exit 1; }
          key="$RUNNER_TEMP/google-play-service-account.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$key"
          python3 -m venv "$RUNNER_TEMP/google-play"
          "$RUNNER_TEMP/google-play/bin/pip" install --quiet --disable-pip-version-check 'google-api-python-client==2.201.0' 'google-auth==2.62.0'
          package="$(python3 platforms/android/scripts/edition_android.py field --edition full application_id)"
          apk_name="$(python3 platforms/android/scripts/edition_android.py field --edition full apk_name)"
          "$RUNNER_TEMP/google-play/bin/python" platforms/android/scripts/upload_play.py --package "$package" --bundle "play/$apk_name.aab" \
            --track "$TRACK" --status "$STATUS" --name "$VERSION" --key-path "$key"
