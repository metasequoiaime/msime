name: Release Language Dictionaries
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version of the language dictionary release (tagged langdict-vX.Y.Z), required: true, type: string}
      publish: {description: Publish the build as a langdict-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-language-dictionaries, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got '$REQUESTED'" >&2; exit 1; }
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
      # Installs the toolchain rust-toolchain.toml pins.
      - name: Install Rust
        run: rustup toolchain install
      - name: Build msime-dict-build
        run: cargo build --release --locked -p msime-dict-builder
      # 只下载 resources/dictionary-sources.lock.json 在 yue/、tw/、stroke/ 下固定的 msime-dictionary 附件（rime-cantonese、libchewing-data 与 rime-stroke 的原样副本）和笔画排序用的 cn/SingleCharsAllV1.txt，逐个校验大小与 SHA-256，低于 verify 下限即失败。锁文件还没固定 stroke/stroke.dict.yaml 时构建会失败，因为全新的缓存目录里没有它；先发布 msime-dictionary 的 sources release 并更新锁文件。不碰桌面词库产品（release-dictionary.yml）。
      - name: Build language dictionaries
        run: target/release/msime-dict-build languages --cache target/dictionary-sources --out target/language-dictionaries
      - name: Verify language dictionaries
        run: |
          out=target/language-dictionaries
          for name in cantonese.db zhuyin.db stroke.db rime_cantonese_LICENSE.txt libchewing_data_LICENSE.txt rime_stroke_LICENSE.txt language-dictionaries-SHA256SUMS; do
            [[ -s "$out/$name" ]] || { echo "missing $out/$name" >&2; exit 1; }
          done
          (cd "$out" && sha256sum -c language-dictionaries-SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-language-dictionaries-${{ steps.version.outputs.value }}
          path: target/language-dictionaries/
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.value }}
  publish:
    needs: [build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "msime-language-dictionaries-${{ needs.build.outputs.version }}", path: dist}
      # workflow_dispatch runs on whatever ref it is given, so publishing has to be asked for rather than implied. Without the gate a dispatch on a feature branch cuts a real public release.
      # 已发布的 macOS App 在运行时按 language-dictionaries.lock.json 从这里下载粤拼、注音与笔画词库，所以发布出去的 release 不能删除，附件也不能替换。
      - name: Publish language dictionary release
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", VERSION: "${{ needs.build.outputs.version }}"}
        run: |
          dist=dist
          (cd "$dist" && sha256sum -c language-dictionaries-SHA256SUMS)
          printf '%s\n' "Built by msime-dict-build languages from ${GITHUB_REPOSITORY} ${GITHUB_SHA}." "" "cantonese.db is derived from rime/rime-cantonese (CC BY 4.0, rime_cantonese_LICENSE.txt), zhuyin.db from chewing/libchewing-data (LGPL-2.1-or-later, libchewing_data_LICENSE.txt) and stroke.db from rime/rime-stroke (LGPL-3.0, ranked by the rime-ice character frequencies of msime-dictionary's cn/SingleCharsAllV1.txt, rime_stroke_LICENSE.txt), at the commits resources/dictionary-sources.lock.json pins at that commit. Checksums: language-dictionaries-SHA256SUMS." > notes.md
          tag="langdict-v${VERSION}"
          gh release create "$tag" "$dist"/cantonese.db "$dist"/zhuyin.db "$dist"/stroke.db "$dist"/rime_cantonese_LICENSE.txt "$dist"/libchewing_data_LICENSE.txt "$dist"/rime_stroke_LICENSE.txt "$dist"/language-dictionaries-SHA256SUMS --target "$GITHUB_SHA" --title "Language dictionaries ${VERSION}" --notes-file notes.md
