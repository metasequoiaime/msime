name: Release macOS
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/macos/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a macos-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
  workflow_call:
    inputs:
      version: {description: Semantic version, required: false, default: '', type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build, required: false, default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: release-macos, cancel-in-progress: false}
jobs:
  # 随桌面安装包分发的官方插件包（plugins/official-packs.json），只在这里构建一次，打包作业下载同一份：scripts/build-official-plugins.sh 编出 wasm，并和锁定的内容哈希比对（授权绑定在它上面），所以装进安装包的就是评审过的那一份；锁以这台 ubuntu 的构建为准，和 CI 的 Script plugins 作业一致。打包的 runner 不用装 wasm 目标。
  official-plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Build the official plugin packs
        run: |
          set -euo pipefail
          # 安装 rust-toolchain.toml 钉住的工具链，再给它加上 wasm 目标。
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          bash scripts/build-official-plugins.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-plugin-packs-macos
          path: target/plugin-packs/
          if-no-files-found: error
  release:
    needs: official-plugins
    # 发布包是 universal 的（arm64 + x86_64），在 Apple 芯片的 runner 上交叉编出 x86_64。Rust 引擎不再链接只有 arm64 的 Homebrew 库，C/C++ 部分只用系统 SDK，所以一台机器就能编出两种架构。
    # 留在 GitHub 托管的 runner 上，不要搬到 Depot：这个 job 用到Developer ID 证书、公证用的 Apple ID 密码这些长期凭据。只做构建、不碰长期凭据的 job 才放 Depot。
    runs-on: macos-15
    timeout-minutes: 120
    # Mapped here because secrets.* cannot appear in a step's if:. All are optional; see the signing comment below and platforms/macos/README.md (发布包). The names are the ones the repository's Developer ID secrets were stored under; reading any other name gives an empty string, which silently turns every release into an ad-hoc, un-notarized package.
    #   MACOS_DEVELOPER_ID_CERTIFICATE_BASE64    base64 of the Developer ID Application certificate and key, exported as .p12
    #   MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD  the .p12 export password
    #   MACOS_DEVELOPER_ID_APPLICATION           the identity name, e.g. "Developer ID Application: Name (TEAMID)"
    #   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_APP_SPECIFIC_PASSWORD  notarization credentials for xcrun notarytool
    #   HOMEBREW_TAP_TOKEN                       a token that can push to metasequoiaime/homebrew-tap, for the cask update after a release
    #   SPARKLE_ED_PRIVATE_KEY                   Sparkle's EdDSA private key for platforms/macos/sparkle-public-key.txt (rotated 2026-10-15; the maintainer keeps a backup, and replacing it strands every installed copy); with it the input method updates itself through Sparkle from the macos-appcast release
    env:
      # 钉死 Xcode 26.3（macOS 26 SDK），与 ci-macos.yml、ci-macos-package.yml 和 iOS 的 CI、发布同一个版本；不钉就是镜像默认的 Xcode 16.4，CI 测的就不是发出去的构建。
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # 一次发布打出的版本（shared/contracts/editions.json 的 id）：每个版本一个 DMG、一个 cask，可以同时安装。full 的 DMG 名、cask 和 bundle id 与引入版本之前相同。
      MACOS_EDITIONS: full,wubi,pinyin,japanese,vietnamese,tibetan
      # Signing and notarization follow the secrets, not the publish input: the nightly calls this workflow with publish off, and an ad-hoc DMG is not just quarantined but never registers its input method, so the nightly macOS download was unusable. Publishing the release and pushing the Homebrew casks keep their own publish gates below.
      MACOS_CERTIFICATE_P12_BASE64: "${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}"
      MACOS_CERTIFICATE_PASSWORD: "${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}"
      MACOS_SIGNING_IDENTITY: "${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      # The packages keep the plain X.Y.Z (Info.plist, versionName, Tauri, deb and rpm metadata take nothing else); the release tag and title carry the branch the run was dispatched from: none on main, -beta on develop, -alpha anywhere else. A suffixed release is always published as a prerelease, which the in-app update checks skip.
      - id: version
        name: Resolve independent macOS version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/macos/version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in main) suffix= ;; develop) suffix=-beta ;; *) suffix=-alpha ;; esac; echo "release=${version}${suffix}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: brew install nlohmann-json
      # platforms/macos/CMakeLists.txt makes an empty MSIME_SPARKLE_ROOT a FATAL_ERROR, so the
      # configure below cannot run without this. Same pinned version, same digest and same cache key
      # as ci-macos.yml -- the digest lives beside the version in CMakeLists.txt.
      - name: Cache the pinned Sparkle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle-archive
          # Keyed on platforms/macos/CMakeLists.txt, which is where the pinned version and the digest
          # actually live. There is no CMakeLists.txt at the repository root, so hashFiles('CMakeLists.txt')
          # would expand to the empty string and leave a constant key that survives a version bump.
          key: sparkle-2.9.6-${{ runner.os }}-${{ hashFiles('platforms/macos/CMakeLists.txt') }}
      - name: Prepare pinned Sparkle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-archive"
          archive="$RUNNER_TEMP/sparkle-archive/Sparkle-2.9.6.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
              --output "$archive"
          fi
          # Checked on every run rather than only after a download: a restored cache entry is written
          # by earlier runs of this workflow, which is not a stronger provenance than the download.
          printf '%s  %s\n' \
            '52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192' \
            "$archive" | shasum -a 256 --check
          rm -rf "$RUNNER_TEMP/sparkle"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"
          test -d "$RUNNER_TEMP/sparkle/Sparkle.framework"
          echo "MSIME_SPARKLE_ROOT=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Enable pnpm
        # Reads the pnpm version from packageManager in package.json.
        run: corepack enable
      # Signing is optional so that the workflow still produces a package on a fork or before the certificate exists. Without these secrets every signature is ad-hoc and nothing is notarized: Gatekeeper quarantines the downloaded app, which then has to be opened once with right-click Open, and macOS will not register the embedded input method as an input source, so the package only installs for a developer who re-signs it with their own Developer ID through platforms/macos/scripts/install.sh. With them the package gives the Windows-equivalent download, install and type flow.
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_IDENTITY:?MACOS_CERTIFICATE_P12_BASE64 is set but MACOS_SIGNING_IDENTITY is not}"
          keychain="$RUNNER_TEMP/msime-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/msime-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_SIGNING_IDENTITY"
          echo "MSIME_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # stage-resources.sh stages target/offline-glosses when it is there and package-release.sh embeds it.
      - name: Fetch the locked offline candidate glosses
        run: python3 scripts/fetch_offline_glosses.py
      # The same goes for target/character-glosses, target/word-glosses and target/pronunciations: without them single characters and long-tail words have no English gloss, English glosses no IPA, and sentence candidates no word-by-word breakdown.
      - name: Fetch the locked English gloss tables
        run: python3 scripts/fetch_gloss_tables.py
      # Fetches the pinned dictionaries, builds the Release host library, the input method bundle and the Tauri settings app that embeds both, signs them (Developer ID when the secrets are present, ad-hoc otherwise), checks the embedded resources and signatures inside the mounted DMG, notarizes when the Apple ID secrets are present, and writes SHA256SUMS.
      # 包里只带核心词库；日文词典、粤拼/注音词库和手写模型由 App 首次用到时下载。package-release.sh 在编译之前先用 App 的同一个安装器把三个资源包装一遍，地址失效或哈希不符就在这里失败，不会发出一个补不齐数据的包。
      # package-release.sh 按这两个 target 各编一次 Rust 产物再合并；rust-toolchain.toml 只固定编译器版本，不带这两个标准库。
      # 官方插件包（official-plugins 作业构建、核对过哈希的那一份）放到打包脚本找它的位置；MSIME_REQUIRE_OFFICIAL_PLUGINS=1 让缺了它的安装包打不出来。
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: official-plugin-packs-macos
          path: target/plugin-packs
      - name: Add the Rust targets for the universal package
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build macOS package
        env:
          VERSION: "${{ steps.version.outputs.value }}"
          MSIME_REQUIRE_OFFICIAL_PLUGINS: '1'
          APPLE_ID: "${{ secrets.MACOS_NOTARY_APPLE_ID }}"
          APPLE_TEAM_ID: "${{ secrets.MACOS_NOTARY_TEAM_ID }}"
          APPLE_APP_SPECIFIC_PASSWORD: "${{ secrets.MACOS_NOTARY_APP_SPECIFIC_PASSWORD }}"
          MSIME_SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_ED_PRIVATE_KEY }}"
        run: bash platforms/macos/package-release.sh --editions "$MACOS_EDITIONS" "$VERSION" dist
      - name: Remove signing keychain
        if: ${{ always() && env.MSIME_SIGNING_KEYCHAIN != '' }}
        run: security delete-keychain "$MSIME_SIGNING_KEYCHAIN"
      - name: Verify release assets
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          IFS=, read -r -a editions <<< "$MACOS_EDITIONS"
          # 每个版本恰好一个 DMG，名字是该版本的 dmg_prefix 加版本号；full 仍是 msime-macos-VERSION-universal.dmg。
          [[ ${#dmgs[@]} -eq ${#editions[@]} ]]
          for edition in "${editions[@]}"; do
            prefix="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" dmg_prefix)"
            [[ -f "dist/${prefix}-${VERSION}-universal.dmg" ]]
            grep -q " ${prefix}-${VERSION}-universal.dmg\$" dist/SHA256SUMS
          done
          [[ -f dist/SHA256SUMS ]]
          # package-release.sh 剥离发布的可执行文件（输入法、它的 msime-voice-local 辅助程序、设置应用、msime-mcp）之前先写出 dSYM，再打成一个 zip；各版本共用同一组可执行文件，一份覆盖全部版本。它作为发布资产长期保留，用来符号化这个版本的崩溃报告，不像 workflow artifact 那样 90 天后过期。
          [[ -f "dist/msime-macos-${VERSION}-dsym.zip" ]]
          grep -q " msime-macos-${VERSION}-dsym.zip\$" dist/SHA256SUMS
          # 有 Sparkle 私钥时 package-release.sh 给每个版本出一个更新 zip 和一份 appcast；要么全有，要么全无，不能只更新一部分版本。
          appcasts=(dist/appcast-*.xml)
          if [[ ${#appcasts[@]} -gt 0 ]]; then
            [[ ${#appcasts[@]} -eq ${#editions[@]} ]]
            for edition in "${editions[@]}"; do
              prefix="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" dmg_prefix)"
              [[ -f "dist/appcast-${edition}.xml" && -f "dist/${prefix}-${VERSION}-input-method.zip" ]]
              grep -q " ${prefix}-${VERSION}-input-method.zip\$" dist/SHA256SUMS
            done
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS)
          ls -l dist
          for dmg in "${dmgs[@]}"; do
            echo "- $(basename "$dmg"): $(stat -f %z "$dmg") bytes" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-macos-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
      # The build takes the dispatched commit, and the release is tagged at that checked-out commit (git rev-parse HEAD), so publishing has to be asked for rather than implied. Without the gate a build of a feature branch cuts a real public release.
      - name: Publish independent macOS release
        if: ${{ inputs.publish }}
        # RELEASE_PUBLISH_TOKEN (org secret, a fine-grained token with Contents and Workflows write) creates the tag: GitHub refuses GITHUB_TOKEN a new ref whose .github/workflows differs from the default branch, which is the case whenever develop takes a workflow change while the release builds (Release Linux run 37259338700, 403 Resource not accessible by integration). Without the secret, as on a fork, it falls back to GITHUB_TOKEN.
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ steps.version.outputs.value }}", RELEASE: "${{ steps.version.outputs.release }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          tag="macos-v${RELEASE}"
          [[ "$RELEASE" == "$VERSION" ]] || export PRERELEASE=true
          # A re-run for the same version overwrites its release (scripts/publish-release.sh), so the notes start at the release before it rather than at its own tag. A final release starts at the previous final release, a -beta or -alpha one at the latest release of either kind.
          stable='^macos-v[0-9]+\.[0-9]+\.[0-9]+$'; [[ "$RELEASE" == "$VERSION" ]] || stable=.
          start=$(git tag --list 'macos-v*' --sort=-v:refname | grep -vxF "$tag" | grep -E "$stable" | head -1 || true)
          python3 scripts/generate-release-notes.py --platform macos --version "$RELEASE" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output release-notes.md
          shopt -s nullglob
          bash scripts/publish-release.sh "$tag" "$(git rev-parse HEAD)" "macOS ${RELEASE}" release-notes.md dist/*.dmg dist/*-input-method.zip "dist/msime-macos-${VERSION}-dsym.zip" dist/SHA256SUMS
      # Sparkle 读的 appcast 在一个固定的滚动 release（macos-appcast）上，地址不随版本变，写在每个输入法的 SUFeedURL 里。和 Homebrew 一样只有 main 上的正式版才更新它：beta 与 alpha 不推给所有用户。appcast 指向刚发布的 macos-vVERSION 里的更新 zip，所以先确认它们已经在那个 release 上；已发布的 appcast 版本更高时停下，免得重跑旧版本的发布把它退回去。
      - name: Update the Sparkle appcasts
        if: ${{ inputs.publish && !inputs.prerelease && github.ref_name == 'main' }}
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appcasts=(dist/appcast-*.xml)
          if [[ ${#appcasts[@]} -eq 0 ]]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set; the input methods in this release have no Sparkle feed and the appcasts were left as they were"
            exit 0
          fi
          published="$(gh release view "macos-v${VERSION}" --json assets --jq '.assets[].name')"
          for zip in dist/*-input-method.zip; do
            grep -qxF "$(basename "$zip")" <<< "$published"
          done
          if ! gh release view macos-appcast >/dev/null 2>&1; then
            gh release create macos-appcast --prerelease --latest=false --target "$(git rev-parse HEAD)" --title "macOS Sparkle appcasts" \
              --notes "Sparkle feeds for the macOS input method, one appcast-<edition>.xml per edition. Each release from main replaces them; the update archives they point at are on the macos-v releases."
          fi
          mkdir -p "$RUNNER_TEMP/appcast-current"
          gh release download macos-appcast --pattern 'appcast-*.xml' --dir "$RUNNER_TEMP/appcast-current" --clobber || true
          for appcast in "${appcasts[@]}"; do
            current="$RUNNER_TEMP/appcast-current/$(basename "$appcast")"
            new_build="$(sed -n 's:.*<sparkle\:version>\([0-9]*\)</sparkle\:version>.*:\1:p' "$appcast" | head -1)"
            [[ -n "$new_build" ]]
            old_build=""
            if [[ -f "$current" ]]; then old_build="$(sed -n 's:.*<sparkle\:version>\([0-9]*\)</sparkle\:version>.*:\1:p' "$current" | head -1)"; fi
            if [[ -n "$old_build" && "$old_build" -gt "$new_build" ]]; then
              echo "::error::$(basename "$appcast") already offers build $old_build, newer than $new_build"
              exit 1
            fi
          done
          gh release upload macos-appcast "${appcasts[@]}" --clobber
      # brew install --cask metasequoiaime/tap/msime（五笔版 msime-wubi，拼音版 msime-pinyin，日文版 msime-japanese，越南文版 msime-vietnamese，藏文版 msime-tibetan）. Only a notarized final release goes to the tap: an ad-hoc package installs but macOS will not register its input method, and a prerelease (which every release dispatched from a branch other than main is) is not what someone installing from Homebrew asked for. stapler validate checks the ticket in the DMG itself rather than trusting which secrets were set. 每个版本一个 cask，由 platforms/macos/scripts/edition_bundle.py 从同一个模板渲染；full 的渲染结果与原来的 sed 替换相同，只有 full 把 msime-mcp 放上 PATH。
      - name: Update the Homebrew casks
        if: ${{ inputs.publish && !inputs.prerelease && github.ref_name == 'main' }}
        env: {GH_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}", VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew casks were left at their previous versions"
            exit 0
          fi
          gh auth setup-git
          git clone --depth 1 https://github.com/metasequoiaime/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          IFS=, read -r -a editions <<< "$MACOS_EDITIONS"
          updated=()
          for edition in "${editions[@]}"; do
            prefix="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" dmg_prefix)"
            cask="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" cask)"
            dmg="dist/${prefix}-${VERSION}-universal.dmg"
            if ! xcrun stapler validate "$dmg"; then
              echo "::warning::$dmg is not notarized; the $cask cask was left at its previous version"
              continue
            fi
            sha256="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
            python3 platforms/macos/scripts/edition_bundle.py cask --edition "$edition" --version "$VERSION" --sha256 "$sha256" \
              --template platforms/macos/homebrew/msime.rb.in > "$RUNNER_TEMP/tap/Casks/${cask}.rb"
            git -C "$RUNNER_TEMP/tap" add "Casks/${cask}.rb"
            updated+=("$cask")
          done
          cd "$RUNNER_TEMP/tap"
          if [[ ${#updated[@]} -eq 0 ]] || git diff --cached --quiet; then
            echo "The casks are already at ${VERSION}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "${updated[*]} ${VERSION}"
          git push origin HEAD
