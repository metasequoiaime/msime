name: Release macOS
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/macos/version.txt), required: false, type: string}
      build_number: {description: 唯一的 macOS bundle 构建号（缺省由所构建提交的时间算出）, required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a macos-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
  workflow_call:
    inputs:
      version: {description: Semantic version, required: false, default: '', type: string}
      build_number: {description: 唯一的 macOS bundle 构建号, required: false, default: '', type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build, required: false, default: false, type: boolean}
      # nightly.yml 传 nightly：这次构建的 Sparkle 更新发到每日构建通道的 appcast。留空时按分支：develop 是测试版（beta），其他分支是稳定版（stable）的文件名，是否上传见下面的「Resolve independent macOS version」。
      appcast_channel: {description: 'Sparkle 更新通道：nightly，或留空按分支决定', required: false, default: '', type: string}
permissions: {contents: write}
# 编进 msime-client-services 的本构建运行 ID（update_check::BUILD_RUN）：应用内检查更新拿它和发布正文的 msime-build 标记比较同一版本号的构建。nightly.yml 复用这个 workflow 时 github.run_id 就是 nightly 那次运行，与 scripts/publish-nightly.py 记下的 run 相同。
env:
  MSIME_BUILD_RUN: ${{ github.run_id }}
concurrency: {group: release-macos, cancel-in-progress: false}
jobs:
  # 随桌面安装包分发的官方插件包（plugins/official-packs.json），只在这里构建一次，打包作业下载同一份：scripts/build-official-plugins.sh 编出 wasm，并和锁定的内容哈希比对（授权绑定在它上面），所以装进安装包的就是评审过的那一份；锁以这台 ubuntu 的构建为准，和 CI 的 Script plugins 作业一致。打包的 runner 不用装 wasm 目标。
  official-plugins:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Build the official plugin packs
        run: |
          set -euo pipefail
          # 安装 rust-toolchain.toml 钉住的工具链，再给它加上 wasm 目标。
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          bash scripts/build-official-plugins.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-plugin-packs-macos
          path: target/plugin-packs/
          if-no-files-found: error
  release:
    needs: official-plugins
    # 发布包是 universal 的（arm64 + x86_64），在 Apple 芯片的 runner 上交叉编出 x86_64。Rust 引擎不再链接只有 arm64 的 Homebrew 库，C/C++ 部分只用系统 SDK，所以一台机器就能编出两种架构。
    # 留在 GitHub 托管的 runner 上，不要搬到 Depot：这个 job 用到Developer ID 证书、公证用的 Apple ID 密码这些长期凭据。只做构建、不碰长期凭据的 job 才放 Depot。
    runs-on: macos-15
    timeout-minutes: 120
    # Mapped here because secrets.* cannot appear in a step's if:. All are optional; see the signing comment below and platforms/macos/README.md (发布包). The names are the ones the repository's Developer ID secrets were stored under; reading any other name gives an empty string, which silently turns every release into an ad-hoc, un-notarized package.
    #   MACOS_DEVELOPER_ID_CERTIFICATE_BASE64    base64 of the Developer ID Application certificate and key, exported as .p12
    #   MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD  the .p12 export password
    #   MACOS_DEVELOPER_ID_APPLICATION           the identity name, e.g. "Developer ID Application: Name (TEAMID)"
    #   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, MACOS_NOTARY_APP_SPECIFIC_PASSWORD  notarization credentials for xcrun notarytool
    #   HOMEBREW_TAP_TOKEN                       a token that can push to metasequoiaime/homebrew-tap, for the cask update after a release
    #   SPARKLE_ED_PRIVATE_KEY                   对应 platforms/macos/sparkle-public-key.txt 的 Sparkle EdDSA 私钥（2026-10-15 轮换，维护者保留备份；更换它会使所有已安装副本无法更新）；输入法和完整设置应用分别读取 macos-appcast 发布中的独立 appcast，每个更新通道（正式版、测试版、每日构建）各有一组
    env:
      # 钉死 Xcode 26.3（macOS 26 SDK），与 ci-macos.yml、ci-macos-package.yml 和 iOS 的 CI、发布同一个版本；不钉就是镜像默认的 Xcode 16.4，CI 测的就不是发出去的构建。
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # 一次发布打出的版本（shared/contracts/editions.json 的 id）：每个版本一个 DMG、一个 cask，可以同时安装。full 的 DMG 名、cask 和 bundle id 与引入版本之前相同。
      MACOS_EDITIONS: full,wubi,pinyin,japanese,vietnamese,tibetan
      # Signing and notarization follow the secrets, not the publish input: the nightly calls this workflow with publish off, and an ad-hoc DMG is not just quarantined but never registers its input method, so the nightly macOS download was unusable. Publishing the release and pushing the Homebrew casks keep their own publish gates below.
      MACOS_CERTIFICATE_P12_BASE64: "${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}"
      MACOS_CERTIFICATE_PASSWORD: "${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}"
      MACOS_SIGNING_IDENTITY: "${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}"
      # Rust 编译缓存（sccache）存进 GitHub Actions 缓存：托管 runner 没有 Depot Cache。RUSTC_WRAPPER 不在这里设，由下面的「Enable sccache」在 sccache 确实起来之后才写进 GITHUB_ENV。CARGO_INCREMENTAL=0 是因为 sccache 不缓存增量编译；SCCACHE_IGNORE_SERVER_IO_ERROR=1 让构建途中 sccache 服务出错时 rustc 退回本机直接编，不让缓存故障弄坏发版。
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      # 服务默认空闲 600 秒就退出，而六个版本打包时十几分钟不编 Rust；退出后最后的统计步骤会起一个计数为零的新服务（第一次验证运行 39288415598 就这样显示 0 次请求）。runner 用完即弃，让它一直活到 job 结束。
      SCCACHE_IDLE_TIMEOUT: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      # 缓存只为加速，装不上或起不来都不该让发版失败：安装步骤失败时继续，只有 sccache 服务真正启动了才把 RUSTC_WRAPPER 写进环境，否则照常不带缓存编译。读写缓存出错时 sccache 按未命中处理，照样编译。
      # 缓存的可见范围由 GitHub 决定：在 main 上的发布读 main 和默认分支 develop 写的条目，PR 写的条目它看不到，所以 PR 里的改动污染不到发布用的缓存。条目的键是 rustc 的全部输入（编译器版本、参数、源文件和依赖产物的哈希），命中时拿到的就是同样输入编出的同一份产物。
      - name: Install sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ steps.sccache.outcome == 'success' }}
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      # The packages keep the plain X.Y.Z (Info.plist, versionName, Tauri, deb and rpm metadata take nothing else); the release tag and title carry the branch the run was dispatched from: none on main, -beta on develop, -alpha anywhere else. A suffixed release is always published as a prerelease. The in-app update check (crates/client-services/src/update_check.rs) skips it on the stable channel, but on the beta channel it offers -beta releases (never -alpha) and the background check notifies about them, so a -beta release, and a re-run that replaces one in place with a new run ID, reaches every user who chose the beta channel.
      - id: version
        name: Resolve independent macOS version
        env: {REQUESTED: "${{ inputs.version }}", REQUESTED_BUILD_NUMBER: "${{ inputs.build_number }}", REQUESTED_APPCAST_CHANNEL: "${{ inputs.appcast_channel }}", PUBLISH: "${{ inputs.publish }}", PRERELEASE_INPUT: "${{ inputs.prerelease }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/macos/version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          build_number="$REQUESTED_BUILD_NUMBER"
          # 缺省构建号是所构建提交的提交时间距 2026-01-01T00:00:00Z（Unix 时间 1767225600）的分钟数，九位数够用到 3900 年之后。CFBundleVersion 把它放在版本号之后（CMakeLists.txt），Sparkle 按它判断同一版本号的几个构建谁新：用时间而不是运行 ID，测试版、每日构建和正式版之间就按代码的先后排序，同一个提交重跑得到同一个构建号；运行 ID 对 999999999 取模约两个月回绕一次，回绕后的新构建会被 Sparkle 当成降级拒装。
          if [[ -z "$build_number" ]]; then
            committed="$(git log -1 --format=%ct HEAD)"
            build_number=$(( (committed - 1767225600) / 60 ))
            if (( build_number < 1 || build_number > 999999999 )); then
              echo "::error::提交时间 $committed 算出的构建号 $build_number 不在 1 到 999999999 之间；用 build_number 输入指定"
              exit 1
            fi
          fi
          [[ "$build_number" =~ ^[1-9][0-9]{0,8}$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in main) suffix= ;; develop) suffix=-beta ;; *) suffix=-alpha ;; esac; echo "release=${version}${suffix}" >> "$GITHUB_OUTPUT"
          # Sparkle 更新通道（与偏好 update_channel 同名）决定 package-release.sh 产出的 appcast 和更新包文件名。发到 macos-appcast 的只有三种：main 上的正式版发布（stable，与引入通道之前相同）、develop 上的测试版发布（beta）和 develop 上 nightly.yml 的每日构建（nightly）；alpha、从其他分支手动跑的每日构建和不发布的构建只留在 workflow artifact 里。
          channel="$REQUESTED_APPCAST_CHANNEL"
          if [[ -z "$channel" ]]; then
            if [[ "$GITHUB_REF_NAME" == develop ]]; then channel=beta; else channel=stable; fi
          fi
          if [[ ! "$channel" =~ ^(stable|beta|nightly)$ ]]; then
            echo "::error::appcast_channel must be nightly or empty, not '$channel'"
            exit 1
          fi
          feed_publish=false
          if [[ "$channel" == stable && "$PUBLISH" == true && "$PRERELEASE_INPUT" != true && "$GITHUB_REF_NAME" == main ]]; then feed_publish=true; fi
          if [[ "$channel" == beta && "$PUBLISH" == true && "$GITHUB_REF_NAME" == develop ]]; then feed_publish=true; fi
          # 每日构建也只从 develop 推出去：nightly.yml 可以从任意分支手动触发，从功能分支跑一次本来只是想看包能不能编出来，却会让选了每日构建的用户被 Sparkle 静默装上未合并的代码；功能分支的提交通常比 develop 新，「不退回更旧构建」的守卫拦不住。定时触发跑在默认分支 develop 上。
          if [[ "$channel" == nightly && "$GITHUB_REF_NAME" == develop ]]; then feed_publish=true; fi
          if [[ "$channel" == nightly && "$feed_publish" != true ]]; then echo "::notice::每日构建运行在 $GITHUB_REF_NAME 而不是 develop，不更新 macos-appcast 上的每日构建 appcast"; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "feed_publish=$feed_publish" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: brew install nlohmann-json
      # platforms/macos/CMakeLists.txt makes an empty MSIME_SPARKLE_ROOT a FATAL_ERROR, so the
      # configure below cannot run without this. Same pinned version, same digest and same cache key
      # as ci-macos.yml -- the digest lives beside the version in CMakeLists.txt.
      - name: Cache the pinned Sparkle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle-archive
          # Keyed on platforms/macos/CMakeLists.txt, which is where the pinned version and the digest
          # actually live. There is no CMakeLists.txt at the repository root, so hashFiles('CMakeLists.txt')
          # would expand to the empty string and leave a constant key that survives a version bump.
          key: sparkle-2.9.6-${{ runner.os }}-${{ hashFiles('platforms/macos/CMakeLists.txt') }}
      - name: Prepare pinned Sparkle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-archive"
          archive="$RUNNER_TEMP/sparkle-archive/Sparkle-2.9.6.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
              --output "$archive"
          fi
          # Checked on every run rather than only after a download: a restored cache entry is written
          # by earlier runs of this workflow, which is not a stronger provenance than the download.
          printf '%s  %s\n' \
            '52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192' \
            "$archive" | shasum -a 256 --check
          rm -rf "$RUNNER_TEMP/sparkle"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"
          test -d "$RUNNER_TEMP/sparkle/Sparkle.framework"
          echo "MSIME_SPARKLE_ROOT=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Enable pnpm
        # Reads the pnpm version from packageManager in package.json.
        run: corepack enable
      # Signing is optional so that the workflow still produces a package on a fork or before the certificate exists. Without these secrets every signature is ad-hoc and nothing is notarized: Gatekeeper quarantines the downloaded app, which then has to be opened once with right-click Open, and macOS will not register the embedded input method as an input source, so the package only installs for a developer who re-signs it with their own Developer ID through platforms/macos/scripts/install.sh. With them the package gives the Windows-equivalent download, install and type flow.
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_IDENTITY:?MACOS_CERTIFICATE_P12_BASE64 is set but MACOS_SIGNING_IDENTITY is not}"
          keychain="$RUNNER_TEMP/msime-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/msime-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -F "$MACOS_SIGNING_IDENTITY"
          echo "MSIME_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      # stage-resources.sh stages target/offline-glosses when it is there and package-release.sh embeds it.
      - name: Fetch the locked offline candidate glosses
        run: python3 scripts/fetch_offline_glosses.py
      # target/character-glosses、target/word-glosses、target/pronunciations 和 target/target-pronunciations 也一样：没有它们时单字和长尾词没有英文释义，英文释义没有音标，法西俄德韩释义没有读音，整句候选没有逐词拆解。
      - name: Fetch the locked English gloss tables
        run: python3 scripts/fetch_gloss_tables.py
      # 背单词的内置词书：从锁定的 ECDICT 提交生成到 target/wordbooks，stage-resources.sh 暂存、package-release.sh 放进设置应用；MSIME_REQUIRE_WORDBOOKS=1 让缺了它们的包打不出来。
      - name: Build the bundled wordbooks
        run: python3 scripts/fetch_wordbooks.py
      # Fetches the pinned dictionaries, builds the Release host library, the input method bundle and the Tauri settings app that embeds both, signs them (Developer ID when the secrets are present, ad-hoc otherwise), checks the embedded resources and signatures inside the mounted DMG, notarizes when the Apple ID secrets are present, and writes SHA256SUMS.
      # 包里只带核心词库；日文词典、粤拼/注音词库和手写模型由 App 首次用到时下载。package-release.sh 在编译之前先用 App 的同一个安装器把三个资源包装一遍，地址失效或哈希不符就在这里失败，不会发出一个补不齐数据的包。
      # package-release.sh 按这两个 target 各编一次 Rust 产物再合并；rust-toolchain.toml 只固定编译器版本，不带这两个标准库。
      # 官方插件包（official-plugins 作业构建、核对过哈希的那一份）放到打包脚本找它的位置；MSIME_REQUIRE_OFFICIAL_PLUGINS=1 让缺了它的安装包打不出来。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: official-plugin-packs-macos
          path: target/plugin-packs
      - name: Add the Rust targets for the universal package
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build macOS package
        env:
          VERSION: "${{ steps.version.outputs.value }}"
          MSIME_BUILD_NUMBER: "${{ steps.version.outputs.build_number }}"
          MSIME_UPDATE_CHANNEL: "${{ steps.version.outputs.channel }}"
          MSIME_REQUIRE_OFFICIAL_PLUGINS: '1'
          MSIME_REQUIRE_WORDBOOKS: '1'
          APPLE_ID: "${{ secrets.MACOS_NOTARY_APPLE_ID }}"
          APPLE_TEAM_ID: "${{ secrets.MACOS_NOTARY_TEAM_ID }}"
          APPLE_APP_SPECIFIC_PASSWORD: "${{ secrets.MACOS_NOTARY_APP_SPECIFIC_PASSWORD }}"
          MSIME_SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_ED_PRIVATE_KEY }}"
        run: bash platforms/macos/package-release.sh --editions "$MACOS_EDITIONS" "$VERSION" dist
      # 命中率写进摘要，方便看缓存是否真的起作用；只是统计，失败不影响发版。
      - name: Show sccache statistics
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        continue-on-error: true
        run: |
          sccache --show-stats
          { echo '### sccache'; echo; echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing keychain
        if: ${{ always() && env.MSIME_SIGNING_KEYCHAIN != '' }}
        run: security delete-keychain "$MSIME_SIGNING_KEYCHAIN"
      - name: Verify release assets
        env: {VERSION: "${{ steps.version.outputs.value }}", BUILD_NUMBER: "${{ steps.version.outputs.build_number }}", CHANNEL: "${{ steps.version.outputs.channel }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          IFS=, read -r -a editions <<< "$MACOS_EDITIONS"
          # 每个版本恰好一个 DMG，名字是该版本的 dmg_prefix 加版本号；full 仍是 msime-macos-VERSION-universal.dmg。版本发布页上只放这些 DMG 和只列它们的 SHA256SUMS。
          [[ ${#dmgs[@]} -eq ${#editions[@]} ]]
          [[ -f dist/SHA256SUMS ]]
          [[ "$(wc -l < dist/SHA256SUMS | tr -d ' ')" -eq ${#editions[@]} ]]
          for edition in "${editions[@]}"; do
            prefix="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" dmg_prefix)"
            [[ -f "dist/${prefix}-${VERSION}-universal.dmg" ]]
            grep -q " ${prefix}-${VERSION}-universal.dmg\$" dist/SHA256SUMS
          done
          # package-release.sh 剥离发布的可执行文件（输入法、它的 msime-voice-local 辅助程序、设置应用、msime-mcp）之前先写出 dSYM，再打成一个 zip；各版本共用同一组可执行文件，一份覆盖全部版本。它长期保留在 macos-symbols release 上，用来符号化这个版本的崩溃报告，不像 workflow artifact 那样 90 天后过期。
          [[ -f "dist/msime-macos-${VERSION}-dsym.zip" ]]
          # 有 Sparkle 私钥时，每个版本分别提供输入法和完整设置应用的归档与 appcast，必须全部存在；归档的摘要在 sparkle-SHA256SUMS 里，不在 SHA256SUMS 里。文件名随更新通道变（sparkle_feed.py names），appcast 也必须都属于这个通道。
          appcasts=(dist/appcast-*.xml)
          if [[ ${#appcasts[@]} -gt 0 ]]; then
            [[ ${#appcasts[@]} -eq $((${#editions[@]} * 2)) ]]
            [[ "$(wc -l < dist/sparkle-SHA256SUMS | tr -d ' ')" -eq $((${#editions[@]} * 2)) ]]
            python3 platforms/macos/scripts/sparkle_feed.py feeds --channel "$CHANNEL" "${appcasts[@]}" > /dev/null
            for edition in "${editions[@]}"; do
              prefix="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" dmg_prefix)"
              names="$(python3 platforms/macos/scripts/sparkle_feed.py names --channel "$CHANNEL" --edition "$edition" --prefix "$prefix" --version "$VERSION" --build "$BUILD_NUMBER")"
              IFS=$'\t' read -r input_feed settings_feed input_zip settings_zip <<< "$names"
              [[ -f "dist/${input_feed}" && -f "dist/${input_zip}" ]]
              awk -v name="$input_zip" '$2 == name {found = 1} END {exit !found}' dist/sparkle-SHA256SUMS
              [[ -f "dist/${settings_feed}" && -f "dist/${settings_zip}" ]]
              awk -v name="$settings_zip" '$2 == name {found = 1} END {exit !found}' dist/sparkle-SHA256SUMS
            done
            python3 platforms/macos/scripts/sparkle_feed.py verify --archives dist \
              --url-prefix https://github.com/metasequoiaime/msime/releases/download/macos-appcast/ "${appcasts[@]}"
            (cd dist && shasum -a 256 -c sparkle-SHA256SUMS)
          fi
          (cd dist && shasum -a 256 -c SHA256SUMS)
          ls -l dist
          for dmg in "${dmgs[@]}"; do
            echo "- $(basename "$dmg"): $(stat -f %z "$dmg") bytes" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-macos-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
      # The build takes the dispatched commit, and the release is tagged at that checked-out commit (git rev-parse HEAD), so publishing has to be asked for rather than implied. Without the gate a build of a feature branch cuts a real public release.
      - name: Publish independent macOS release
        if: ${{ inputs.publish }}
        # RELEASE_PUBLISH_TOKEN (org secret, a fine-grained token with Contents and Workflows write) creates the tag: GitHub refuses GITHUB_TOKEN a new ref whose .github/workflows differs from the default branch, which is the case whenever develop takes a workflow change while the release builds (Release Linux run 37259338700, 403 Resource not accessible by integration). Without the secret, as on a fork, it falls back to GITHUB_TOKEN.
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ steps.version.outputs.value }}", RELEASE: "${{ steps.version.outputs.release }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          tag="macos-v${RELEASE}"
          [[ "$RELEASE" == "$VERSION" ]] || export PRERELEASE=true
          # A re-run for the same version overwrites its release (scripts/publish-release.sh), so the notes start at the release before it rather than at its own tag. A final release starts at the previous final release, a -beta or -alpha one at the latest release of either kind.
          stable='^macos-v[0-9]+\.[0-9]+\.[0-9]+$'; [[ "$RELEASE" == "$VERSION" ]] || stable=.
          start=$(git tag --list 'macos-v*' --sort=-v:refname | grep -vxF "$tag" | grep -E "$stable" | head -1 || true)
          python3 scripts/generate-release-notes.py --platform macos --version "$RELEASE" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output changes.md
          # 发布说明开头是从版本表生成的下载指引：六个 DMG 各是什么、大多数人该下哪个。Homebrew 只在 main 的正式版之后更新，其他发布不列 brew 命令。
          homebrew=(); [[ "$PRERELEASE" != true && "$GITHUB_REF_NAME" == main ]] && homebrew=(--homebrew)
          python3 platforms/macos/scripts/edition_bundle.py download-guide --editions "$MACOS_EDITIONS" --version "$VERSION" \
            --download-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/" ${homebrew[@]+"${homebrew[@]}"} > release-notes.md
          { echo; cat changes.md; } >> release-notes.md
          # 发布正文末尾的隐藏构建标记（scripts/release-build-marker.py）：应用内检查更新按它的运行 ID 比较同一版本号的构建，测试版通道也靠它分辨 beta 之后发的正式版。
          python3 scripts/release-build-marker.py "$RELEASE" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" >> release-notes.md
          # 版本发布页只放给用户下载的 DMG 和 SHA256SUMS。Sparkle 更新包随 appcast 放在 macos-appcast（下面的「Update the Sparkle appcasts」），dSYM 放在 macos-symbols（下一步）；重跑旧版本时 publish-release.sh 会删掉发布页上不在这份清单里的资产。
          bash scripts/publish-release.sh "$tag" "$(git rev-parse HEAD)" "macOS ${RELEASE}" release-notes.md dist/*.dmg dist/SHA256SUMS
      # 每个发布版本的 dSYM 都长期留在滚动的 macos-symbols release 上，文件名带发布名（预发布带 -beta / -alpha 后缀，免得覆盖同一版本号的正式版）。
      - name: Upload the dSYM to macos-symbols
        if: ${{ inputs.publish }}
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ steps.version.outputs.value }}", RELEASE: "${{ steps.version.outputs.release }}"}
        run: bash platforms/macos/scripts/publish-dsym.sh "dist/msime-macos-${VERSION}-dsym.zip" "msime-macos-${RELEASE}-dsym.zip"
      # 输入法与完整设置应用的 appcast 都放在固定的 macos-appcast release，稳定版的写进各自的 SUFeedURL，测试版和每日构建的由输入法和设置应用按用户选的更新通道从 SUFeedURL 推出（platforms/macos/src/core/UpdateChannelFeed.h）；它们指向的更新 zip 也放在那里，不进版本发布页。三种运行会更新它（见「Resolve independent macOS version」的 feed_publish）：main 上的正式版写稳定版的 appcast，与引入通道之前相同；develop 上的测试版发布写 appcast-beta-*；develop 上 nightly.yml 的每日构建写 appcast-nightly-*（从其他分支手动跑的不写）。alpha 不推给任何人，它的更新 zip 只留在 workflow artifact 里。publish-sparkle-feed.sh 先传 zip 并按公开地址下载核对，确认都下得到之后才传 appcast，再把它复制到构建更旧的更宽通道（正式版也进测试版和每日构建，测试版也进每日构建），最后删掉这个通道不再被任何 appcast 指向的旧 zip；同一通道已发布的 appcast 构建更高时停下，免得重跑旧版本的发布把它退回去，已经是同一个构建时不再传 zip 和本通道的 appcast，只补上更宽通道里还缺的或更旧的 appcast（上一次运行可能在那一步失败）。
      # 每日构建这一步失败（例如 develop 上手工推送的提交时间偏早、构建号比已发布的小，被上面的守卫拦下）不让 macOS 的 nightly 作业失败：那会让 nightly.yml 跳过这个平台的每日构建下载，比 appcast 停在上一次更糟。
      - name: Update the Sparkle appcasts
        if: ${{ steps.version.outputs.feed_publish == 'true' }}
        continue-on-error: ${{ steps.version.outputs.channel == 'nightly' }}
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ steps.version.outputs.value }}", CHANNEL: "${{ steps.version.outputs.channel }}"}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appcasts=(dist/appcast-*.xml)
          if [[ ${#appcasts[@]} -eq 0 ]]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set; the input methods in this release have no Sparkle feed and the appcasts were left as they were"
            exit 0
          fi
          bash platforms/macos/scripts/publish-sparkle-feed.sh dist "$VERSION" "$CHANNEL"
      # brew install --cask metasequoiaime/tap/msime（五笔版 msime-wubi，拼音版 msime-pinyin，日文版 msime-japanese，越南文版 msime-vietnamese，藏文版 msime-tibetan）. Only a notarized final release goes to the tap: an ad-hoc package installs but macOS will not register its input method, and a prerelease (which every release dispatched from a branch other than main is) is not what someone installing from Homebrew asked for. stapler validate checks the ticket in the DMG itself rather than trusting which secrets were set. 每个版本一个 cask，由 platforms/macos/scripts/edition_bundle.py 从同一个模板渲染；full 的渲染结果与原来的 sed 替换相同，只有 full 把 msime-mcp 放上 PATH。
      - name: Update the Homebrew casks
        if: ${{ inputs.publish && !inputs.prerelease && github.ref_name == 'main' }}
        env: {GH_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}", VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew casks were left at their previous versions"
            exit 0
          fi
          gh auth setup-git
          git clone --depth 1 https://github.com/metasequoiaime/homebrew-tap.git "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          IFS=, read -r -a editions <<< "$MACOS_EDITIONS"
          updated=()
          for edition in "${editions[@]}"; do
            prefix="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" dmg_prefix)"
            cask="$(python3 platforms/macos/scripts/edition_bundle.py field --edition "$edition" cask)"
            dmg="dist/${prefix}-${VERSION}-universal.dmg"
            # staple-ticket.sh --validate 核对 DMG 里装订的票据，与装订用同一个断线重试窗口：0.54.0（run 39267138324）这里直接调 stapler validate，碰上 CloudKit 断线（Error 68）就把 full 版当成未公证，msime cask 停在上一版而 job 照样成功。重试用完返回 75，与真正没有公证分开提示。
            validate_status=0
            bash platforms/macos/scripts/staple-ticket.sh --validate "$dmg" || validate_status=$?
            if [[ "$validate_status" -eq 75 ]]; then
              echo "::warning::Apple's ticket service kept dropping the connection while validating $dmg; the $cask cask was left at its previous version and has to be updated by hand"
              continue
            elif [[ "$validate_status" -ne 0 ]]; then
              echo "::warning::$dmg is not notarized; the $cask cask was left at its previous version"
              continue
            fi
            sha256="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
            python3 platforms/macos/scripts/edition_bundle.py cask --edition "$edition" --version "$VERSION" --sha256 "$sha256" \
              --template platforms/macos/homebrew/msime.rb.in > "$RUNNER_TEMP/tap/Casks/${cask}.rb"
            git -C "$RUNNER_TEMP/tap" add "Casks/${cask}.rb"
            updated+=("$cask")
          done
          cd "$RUNNER_TEMP/tap"
          if [[ ${#updated[@]} -eq 0 ]] || git diff --cached --quiet; then
            echo "The casks are already at ${VERSION}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "${updated[*]} ${VERSION}"
          git push origin HEAD
