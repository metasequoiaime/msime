name: Release Linux
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/linux/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a linux-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
      legacy: {description: "Also build the IBus-only legacy .deb for glibc 2.28 systems (Debian 10, UOS 20) and attach it as msime-linux-legacy_VERSION_ARCH.deb", required: false, default: true, type: boolean}
  workflow_call:
    inputs:
      version: {description: Semantic version, required: false, default: '', type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build, required: false, default: false, type: boolean}
      legacy: {description: Build the glibc 2.28 legacy package, required: false, default: false, type: boolean}
permissions: {contents: write}
# 编进 msime-client-services 的本构建运行 ID（update_check::BUILD_RUN）：应用内检查更新拿它和发布正文的 msime-build 标记比较同一版本号的构建。nightly.yml 复用这个 workflow 时 github.run_id 就是 nightly 那次运行，与 scripts/publish-nightly.py 记下的 run 相同。
env:
  MSIME_BUILD_RUN: ${{ github.run_id }}
concurrency: {group: release-linux, cancel-in-progress: false}
jobs:
  # Resolves the dispatched commit up front, so the deb and rpm builds and the publish job (tag target, release notes) use the same source even if the branch moves during the run.
  # 从旧的分支或标签触发时，源码里可能还没有 platforms/linux/packaging/ 的脚本；packaging 输出记下源码里有没有它们，没有时跳过 distro-sources 与 package-definitions，发布只带 deb、rpm 和 tar.gz。
  source:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -f platforms/linux/packaging/make-source-tarballs.sh && -f platforms/linux/packaging/render-definitions.sh ]]; then echo "packaging=true" >> "$GITHUB_OUTPUT"; else echo "packaging=false" >> "$GITHUB_OUTPUT"; echo "::notice::$(git rev-parse --short HEAD) has no platforms/linux/packaging scripts; skipping distro source tarballs and package definitions"; fi
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      packaging: ${{ steps.commit.outputs.packaging }}
  # 随桌面安装包分发的官方插件包（plugins/official-packs.json），只在这里构建一次，deb 和 rpm 两个作业的四台 runner 下载同一份：scripts/build-official-plugins.sh 编出 wasm，并和锁定的内容哈希比对（授权绑定在它上面），所以装进包里的就是评审过的那一份。wasm 与架构无关，x86_64 和 aarch64 的包带的是同一组字节。
  official-plugins:
    needs: source
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - name: Build the official plugin packs
        run: |
          set -euo pipefail
          # 安装 rust-toolchain.toml 钉住的工具链，再给它加上 wasm 目标。
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          bash scripts/build-official-plugins.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: official-plugin-packs-linux
          path: target/plugin-packs/
          if-no-files-found: error
  # Each architecture builds natively on its own runner (package-container.sh builds its images for the host, and the voice runtime is picked by uname -m); there is no cross-compilation.
  deb:
    needs: [source, official-plugins]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: x86_64, runner: depot-ubuntu-24.04-8}
          - {arch: aarch64, runner: depot-ubuntu-24.04-arm-8}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      # The packages keep the plain X.Y.Z (Info.plist, versionName, Tauri, deb and rpm metadata take nothing else); the release tag and title carry the branch the run was dispatched from: none on main, -beta on develop, -alpha anywhere else. A suffixed release is always published as a prerelease. The in-app update check (crates/client-services/src/update_check.rs) skips it on the stable channel, but on the beta channel it offers -beta releases (never -alpha) and the background check notifies about them, so a -beta release, and a re-run that replaces one in place with a new run ID, reaches every user who chose the beta channel.
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/linux/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in main) suffix= ;; develop) suffix=-beta ;; *) suffix=-alpha ;; esac; echo "release=${version}${suffix}" >> "$GITHUB_OUTPUT"
      # The arm64 runner image carries fewer preinstalled tools than the x64 one, so Node is set up explicitly on both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24}
      # The desktop binary embeds the web frontend at compile time; package-container.sh has no Node toolchain and requires this output.
      - name: Build desktop frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @msime/desktop build
      # package-container.sh installs target/offline-glosses when it is there.
      - name: Fetch the locked offline candidate glosses
        run: python3 scripts/fetch_offline_glosses.py
      # package-container.sh installs target/language-dictionaries (Cantonese and Zhuyin, with their licences) when it is there; until a release is pinned the script prints a skipped line.
      - name: Fetch the locked language dictionaries
        run: python3 scripts/fetch_language_dictionaries.py
      # 背单词的内置词书：从锁定的 ECDICT 提交生成到 target/wordbooks，package-container.sh 装进 share/<client>/wordbooks；MSIME_REQUIRE_WORDBOOKS=1 让缺了它们的包打不出来。
      - name: Build the bundled wordbooks
        run: python3 scripts/fetch_wordbooks.py
      # Builds the Release host library and desktop binary, configures the native hosts for /usr with packaging on, runs the same ctest suite the pull-request gate runs (on the Release build, where the tests keep their assertions), then produces the .deb, the .tar.gz and SHA256SUMS. 每个有 Linux 段的版本各出一个包（full 是 msime-linux，其他版本是装在 /opt 下的 msime-linux-<id>），共用同一次构建的宿主库和桌面二进制。
      # 官方插件包（official-plugins 作业构建、核对过哈希的那一份），package-container.sh 把它装进 share/<client>/plugin-packs；MSIME_REQUIRE_OFFICIAL_PLUGINS=1 让缺了它的包打不出来。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: official-plugin-packs-linux
          path: target/plugin-packs
      - name: Build Linux packages
        env: {VERSION: "${{ steps.version.outputs.value }}", MSIME_REQUIRE_OFFICIAL_PLUGINS: '1', MSIME_REQUIRE_WORDBOOKS: '1'}
        run: bash platforms/linux/package-container.sh "$VERSION"
      # Asset names come from CPack (<package>_VERSION_ARCH.deb with dpkg's amd64/arm64, <package>-VERSION-linux-ARCH.tar.gz with x86_64/aarch64, <package> 取自版本表：full 是 msime-linux，其他版本是 msime-linux-<id>). The in-app update check selects releases by the linux-v tag prefix and opens the release page; it shows the digest GitHub computes for the edition's own .deb (else .tar.gz) for the host's architecture, picked by the package name and that architecture part (packages/ui/src/settings/update-manifest.ts).
      - name: Verify Linux packages
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          shopt -s nullglob
          # check-deb-maintainer-scripts.sh lints the maintainer scripts with shellcheck, which the arm64 runner image does not ship.
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          dist=target/linux-package/dist
          debs=("$dist"/*.deb); tarballs=("$dist"/*.tar.gz)
          IFS=, read -r -a editions <<<"$(python3 platforms/linux/scripts/edition_linux.py editions)"
          [[ ${#debs[@]} -eq ${#editions[@]} && ${#tarballs[@]} -eq ${#editions[@]} && -s "$dist/SHA256SUMS" ]] || { echo "expected one .deb and one .tar.gz per edition (${editions[*]}) and SHA256SUMS in $dist" >&2; exit 1; }
          (cd "$dist" && sha256sum -c SHA256SUMS)
          # 按版本逐个核对：每个版本恰好一个 .deb 和一个 .tar.gz，包名、版本与版本表一致；prerm stops the user services on removal and postinst restarts them after an upgrade, so every package must carry them. The runner image ships dpkg-deb and shellcheck.
          edition_debs=()
          for edition in "${editions[@]}"; do
            package=$(python3 platforms/linux/scripts/edition_linux.py field --edition "$edition" package)
            deb=("$dist/${package}_${VERSION}_"*.deb); tarball=("$dist/${package}-${VERSION}-linux-"*.tar.gz)
            [[ ${#deb[@]} -eq 1 && ${#tarball[@]} -eq 1 ]] || { echo "edition $edition: expected ${package}_${VERSION}_*.deb and ${package}-${VERSION}-linux-*.tar.gz in $dist" >&2; exit 1; }
            [[ $(dpkg-deb -f "${deb[0]}" Package) == "$package" && $(dpkg-deb -f "${deb[0]}" Version) == "$VERSION" ]] || { echo "edition $edition: ${deb[0]} is not $package $VERSION" >&2; exit 1; }
            bash platforms/linux/tests/tools/check-deb-maintainer-scripts.sh "${deb[0]}"
            # CPack 写出的是 data.tar.xz 加 control.tar.gz；出现 control.tar.xz 说明 package-container.sh 已经用 xz -9 重新打包了这个 .deb。
            members=$(ar t "${deb[0]}" | tr '\n' ' ')
            [[ $members == "debian-binary control.tar.xz data.tar.xz " ]] || { echo "edition $edition: ${deb[0]} has members $members, not the xz -9 repack" >&2; exit 1; }
            # IBus 和 Fcitx5 二选一（#6401）：Depends 里只能以 `ibus (>= 1.5.20) | fcitx5 (>= 5.0.20)` 出现。单独依赖 IBus 会把它拉进 deepin 这类 Fcitx5 系统；Depends 里另有 fcitx5 或 libfcitx5*，Ubuntu 22.04 这类 Fcitx5 低于 5.0.20 的系统就整包装不上（#6305）；Recommends 里有 fcitx5，apt 会把它拉进 IBus 系统。
            depends=$(dpkg-deb -f "${deb[0]}" Depends); recommends=$(dpkg-deb -f "${deb[0]}" Recommends)
            framework="ibus (>= 1.5.20) | fcitx5 (>= 5.0.20)"; others=${depends//"$framework"/}
            [[ $depends == *"$framework"* && $others != *fcitx5* && $others != *"ibus ("* && $recommends != *fcitx5* ]] || { echo "edition $edition: ${deb[0]} must depend on '$framework' and on neither framework otherwise; Depends: $depends; Recommends: $recommends" >&2; exit 1; }
            # 除了预编译的 sherpa-onnx 和 ONNX Runtime 库按上游构建原样发布外，每个 ELF 文件都已 strip（CMake 目标靠 CPACK_STRIP_FILES，Rust 目标靠 CARGO_PROFILE_RELEASE_STRIP）。
            unpacked=$(mktemp -d)
            dpkg-deb -x "${deb[0]}" "$unpacked"
            unstripped=$(find "$unpacked" -type f ! -name 'libonnxruntime.so*' ! -name 'libsherpa-onnx-c-api.so*' -exec file {} + | grep ': *ELF' | grep -v ', stripped' || true)
            # 发布页的包不带离线手写模型（package-container.sh 以 -DMSIME_BUNDLE_HANDWRITING_MODEL=OFF 配置），由设置应用按需下载。
            bundled_model=$(find "$unpacked" -name 'handwriting-zh_CN.model')
            rm -rf "$unpacked"
            [[ -z $bundled_model ]] || { echo "edition $edition: ${deb[0]} bundles the handwriting model: $bundled_model" >&2; exit 1; }
            [[ -z $unstripped ]] || { echo "edition $edition: unstripped ELF files in ${deb[0]}:" >&2; echo "$unstripped" >&2; exit 1; }
            edition_debs+=("${deb[0]}")
          done
          # 几个版本一起装进同一个 Debian 容器、再逐个卸载：dpkg 不报文件冲突，卸载一个版本不带走另一个版本的文件。
          bash platforms/linux/tests/tools/check-deb-coexistence.sh "${edition_debs[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-linux-deb-${{ matrix.arch }}-${{ steps.version.outputs.value }}
          path: target/linux-package/dist/
          if-no-files-found: error
      - name: 保存 Linux 原生符号和构建清单
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-symbols-linux-deb-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/linux-package/symbols/*.zip
          if-no-files-found: error
          retention-days: 90
      - name: 长期保存发布构建的 Linux 符号
        if: inputs.publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: bash scripts/publish-crash-symbols.sh linux target/linux-package/symbols/*.zip
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
  # The RPM is built separately in a Fedora container rather than converted from the .deb: rpmbuild records the libraries the binaries link as Requires, and Debian's carry sonames and symbol versions no Fedora package provides (#2095).
  rpm:
    needs: [source, official-plugins]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: x86_64, runner: depot-ubuntu-24.04-8}
          - {arch: aarch64, runner: depot-ubuntu-24.04-arm-8}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/linux/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 24}
      - name: Build desktop frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @msime/desktop build
      - name: Fetch the locked offline candidate glosses
        run: python3 scripts/fetch_offline_glosses.py
      # package-container.sh installs target/language-dictionaries (Cantonese and Zhuyin, with their licences) when it is there; until a release is pinned the script prints a skipped line.
      - name: Fetch the locked language dictionaries
        run: python3 scripts/fetch_language_dictionaries.py
      # 背单词的内置词书：从锁定的 ECDICT 提交生成到 target/wordbooks，package-container.sh 装进 share/<client>/wordbooks；MSIME_REQUIRE_WORDBOOKS=1 让缺了它们的包打不出来。
      - name: Build the bundled wordbooks
        run: python3 scripts/fetch_wordbooks.py
      # 官方插件包（official-plugins 作业构建、核对过哈希的那一份），package-container.sh 把它装进 share/<client>/plugin-packs；MSIME_REQUIRE_OFFICIAL_PLUGINS=1 让缺了它的包打不出来。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: official-plugin-packs-linux
          path: target/plugin-packs
      - name: Build Linux RPM
        env: {VERSION: "${{ steps.version.outputs.value }}", MSIME_PACKAGE_FORMAT: rpm, MSIME_REQUIRE_OFFICIAL_PLUGINS: '1', MSIME_REQUIRE_WORDBOOKS: '1'}
        run: bash platforms/linux/package-container.sh "$VERSION"
      # Installs the RPMs into a clean Fedora container and erases them again, which is where an unsatisfiable Requires shows up; every edition's RPM goes in together, and removing one must leave the others' files in place.
      - name: Verify Linux RPM
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          shopt -s nullglob
          dist=target/linux-package-rpm/dist
          rpms=("$dist"/*.rpm)
          IFS=, read -r -a editions <<<"$(python3 platforms/linux/scripts/edition_linux.py editions)"
          [[ ${#rpms[@]} -eq ${#editions[@]} && -s "$dist/SHA256SUMS" ]] || { echo "expected one .rpm per edition (${editions[*]}) and SHA256SUMS in $dist" >&2; exit 1; }
          (cd "$dist" && sha256sum -c SHA256SUMS)
          edition_rpms=()
          for edition in "${editions[@]}"; do
            package=$(python3 platforms/linux/scripts/edition_linux.py field --edition "$edition" package)
            rpm=("$dist/${package}-${VERSION}-"*.rpm)
            [[ ${#rpm[@]} -eq 1 ]] || { echo "edition $edition: expected ${package}-${VERSION}-*.rpm in $dist" >&2; exit 1; }
            edition_rpms+=("${rpm[0]}")
          done
          bash platforms/linux/tests/tools/check-rpm-install.sh "${edition_rpms[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-linux-rpm-${{ matrix.arch }}-${{ steps.version.outputs.value }}
          path: target/linux-package-rpm/dist/
          if-no-files-found: error
      - name: 保存 RPM 原生调试符号
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-symbols-linux-rpm-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/linux-package-rpm/symbols/*.zip
          if-no-files-found: error
          retention-days: 90
      - name: 发布 RPM 长期调试符号
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-crash-symbols.sh linux target/linux-package-rpm/symbols/*.zip
  # glibc 2.28 基线（Debian 10、UOS 20 一类）用的 legacy .deb（#6311），在 buster 容器里构建，两个架构各在原生 runner 上；逻辑在 build-linux-legacy.yml。它的产物名也是 msime-linux-*-VERSION，publish 一并取到并作为附件发布。取消勾选 legacy 时跳过，发布照常进行。
  legacy:
    needs: source
    if: ${{ inputs.legacy }}
    # 写权限只给被调工作流里发布符号的作业，构建作业仍按它自己的顶层设置只读。
    permissions: {contents: write}
    uses: ./.github/workflows/build-linux-legacy.yml
    with:
      ref: ${{ needs.source.outputs.sha }}
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
  # 发行版源码构建要的 tarball（COPR、OBS 与 PPA 用源码与 vendor 包，Gentoo 只用前端包；AUR 的 msime 从 GitHub 的标签归档构建，不用这些）：当前提交的源码、离线构建用的 vendor 包（crate、构建好的前端、按锁文件取回的数据）和单独的前端包，以及只列这三个文件的 msime-VERSION-SHA256SUMS，见 platforms/linux/packaging/make-source-tarballs.sh。用户不会下载它们，所以不进版本发布页：main 上的发布把它们传到滚动的 linux-sources release，各包定义按那里的地址引用它们；其他分支的只留在 workflow artifact 里。只打 full。
  distro-sources:
    needs: source
    if: ${{ needs.source.outputs.packaging == 'true' }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/linux/version.txt)}"; [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; echo "value=$version" >> "$GITHUB_OUTPUT"
      # 文件名都用 .tar.xz，与版本发布页上的 .tar.gz 安装包分得开：应用内更新检查在发布里按包名挑 .deb，没有时找 .tar.gz。
      - name: Build distro source tarballs
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          corepack enable
          bash platforms/linux/packaging/make-source-tarballs.sh "$VERSION" target/distro-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-linux-sources-${{ steps.version.outputs.value }}
          path: target/distro-sources/
          if-no-files-found: error
  # Arch 官方镜像提供 x86_64；沿用已经验证过的 RPM 重新打包，发布页直接附带可安装的 msime-bin。不发布的运行（nightly）里它失败不算整个工作流失败，免得拖住已经构建好的 DEB 和 RPM；发布时仍须成功。
  arch-bin:
    needs: [source, rpm]
    if: ${{ needs.source.outputs.packaging == 'true' }}
    continue-on-error: ${{ !inputs.publish }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/linux/version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msime-linux-rpm-x86_64-${{ steps.version.outputs.value }}
          path: target/arch-rpm
      # RPM artifact 里每个版本各有一个包，msime-bin 只从 full 版本的那一个重新打包，所以按版本表给出的包名精确取，不用通配。
      - name: Build Arch binary package
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          package=$(python3 platforms/linux/scripts/edition_linux.py field --edition full package)
          rpm="target/arch-rpm/${package}-${VERSION}-1.x86_64.rpm"
          [[ -f "$rpm" ]] || { echo "full edition RPM $rpm missing from the artifact" >&2; ls target/arch-rpm >&2; exit 1; }
          bash platforms/linux/packaging/arch/build-bin-release.sh "$VERSION" "$rpm" target/arch-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-linux-arch-${{ steps.version.outputs.value }}
          path: target/arch-package/*.pkg.tar.zst
          if-no-files-found: error
  publish:
    needs: [source, deb, rpm, distro-sources, legacy, arch-bin]
    # distro-sources 被跳过时照样发布（见 source 的说明），它失败时不发布；legacy 同理，没勾选时跳过，勾选了却失败时不发布；Arch 包在有 packaging 脚本时构建，nightly 同样取它的 artifact。
    if: ${{ !cancelled() && inputs.publish && needs.deb.result == 'success' && needs.rpm.result == 'success' && (needs.distro-sources.result == 'success' || needs.distro-sources.result == 'skipped') && (needs.legacy.result == 'success' || needs.legacy.result == 'skipped') && (needs.arch-bin.result == 'success' || needs.arch-bin.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", fetch-depth: 0, persist-credentials: false}
      # 只取要发布的产物：两个架构各自的 msime-linux-deb/rpm/legacy-deb-ARCH-VERSION、x86_64 Arch 包与 msime-linux-sources-VERSION。安装包进版本发布页，源码包进 linux-sources。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: msime-linux-*-${{ needs.deb.outputs.version }}
          path: dist
          merge-multiple: true
      # 先在本地备齐版本发布页的全部内容，任何一处不对（缺一个安装包、指引链接到不存在的文件）都在上传任何东西之前失败。版本发布页放 .deb、.rpm、.tar.gz 与 x86_64 Arch 包，以及只列这些安装包的 SHA256SUMS。每次构建各写了一份 SHA256SUMS，合并 artifact 时只留下一份，这里按要发布的安装包重新算。源码包（.tar.xz 与 msime-VERSION-SHA256SUMS）进 linux-sources，见下一步。
      - name: Prepare the release page
        id: page
        env: {VERSION: "${{ needs.deb.outputs.version }}", RELEASE: "${{ needs.deb.outputs.release }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          dist=dist
          (cd "$dist" && shopt -s nullglob && files=( *.deb *.rpm *.tar.gz *.pkg.tar.zst ) && (( ${#files[@]} > 0 )) && rm -f SHA256SUMS && sha256sum -- "${files[@]}" > SHA256SUMS)
          tag="linux-v${RELEASE}"
          [[ "$RELEASE" == "$VERSION" ]] || PRERELEASE=true
          # A re-run for the same version overwrites its release (scripts/publish-release.sh), so the notes start at the release before it rather than at its own tag. A final release starts at the previous final release, a -beta or -alpha one at the latest release of either kind.
          stable='^linux-v[0-9]+\.[0-9]+\.[0-9]+$'; [[ "$RELEASE" == "$VERSION" ]] || stable=.
          start=$(git tag --list 'linux-v*' --sort=-v:refname | grep -vxF "$tag" | grep -E "$stable" | head -1 || true)
          python3 scripts/generate-release-notes.py --platform linux --version "$RELEASE" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output changes.md
          # 发布说明开头是从版本表生成的下载指引：先按发行版选 deb、rpm、legacy deb 还是 tar.gz，再按 uname -m 选架构，最后每个版本一行，链接的是 dist 里实际要发布的文件，少一个就失败。软件源只在 main 的正式版之后更新，其他发布不指过去。
          repositories=(); [[ "$PRERELEASE" != true && "$GITHUB_REF_NAME" == main ]] && repositories=(--repositories)
          python3 platforms/linux/scripts/edition_linux.py download-guide --version "$VERSION" --dist "$dist" \
            --download-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/" ${repositories[@]+"${repositories[@]}"} > release-notes.md
          { echo; cat changes.md; } >> release-notes.md
          # 发布正文末尾的隐藏构建标记（scripts/release-build-marker.py）：应用内检查更新按它的运行 ID 比较同一版本号的构建，测试版通道也靠它分辨 beta 之后发的正式版。
          python3 scripts/release-build-marker.py "$RELEASE" "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" >> release-notes.md
          { echo "tag=$tag"; echo "prerelease=$PRERELEASE"; } >> "$GITHUB_OUTPUT"
      # 发行版源码包传到滚动的 linux-sources release（预发布、不设为 latest），每个版本一组、文件名带版本号、长期保留，不进版本发布页。只对从 main 发出的版本：下面的 package-definitions、COPR、OBS 与 PPA 也只用它们；beta 与 alpha 的文件名同样不带后缀，传上去会覆盖同一版本号的正式版，所以只留在 workflow artifact 里。放在版本发布页之前，发布页上线时包定义要的源码包已经在了；上传后按 GitHub 记录的摘要逐个核对。
      - name: Upload the distro source tarballs to linux-sources
        if: ${{ needs.source.outputs.packaging == 'true' && github.ref_name == 'main' }}
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ needs.deb.outputs.version }}"}
        run: bash platforms/linux/packaging/publish-sources.sh dist "$VERSION"
      # The build takes the dispatched commit, so publishing has to be asked for rather than implied. Without the gate a build of a feature branch cuts a real public release.
      - name: Publish independent Linux release
        # RELEASE_PUBLISH_TOKEN (org secret, a fine-grained token with Contents and Workflows write) creates the tag: GitHub refuses GITHUB_TOKEN a new ref whose .github/workflows differs from the default branch, which is the case whenever develop takes a workflow change while the release builds (Release Linux run 37259338700, 403 Resource not accessible by integration). Without the secret, as on a fork, it falls back to GITHUB_TOKEN.
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", TAG: "${{ steps.page.outputs.tag }}", RELEASE: "${{ needs.deb.outputs.release }}", PRERELEASE: "${{ steps.page.outputs.prerelease }}"}
        # 重跑旧版本时 publish-release.sh 会删掉发布页上不在这份清单里的资产，包括以前和安装包放在一起的源码包。
        run: |
          shopt -s nullglob
          assets=(dist/*.deb dist/*.rpm dist/*.tar.gz dist/*.pkg.tar.zst)
          [[ ${#assets[@]} -gt 0 ]]
          bash scripts/publish-release.sh "$TAG" "$(git rev-parse HEAD)" "Linux ${RELEASE}" release-notes.md "${assets[@]}" dist/SHA256SUMS
  # 按刚发布的 linux-vVERSION 渲染各发行版的包定义（RPM 规格与 SRPM、Debian 源码包、AUR 的两个 PKGBUILD 与 .SRCINFO、Gentoo overlay），作为构建产物上传，由维护者按 platforms/linux/README.md「包管理器」一节发布到各自的仓库；这里不向任何外部仓库推送。放在发布之后，因为这些定义按发布页（.rpm 与 SHA256SUMS）和 linux-sources（源码包与 msime-VERSION-SHA256SUMS）上的地址取文件，校验值也以那里的为准。
  package-definitions:
    needs: [source, deb, publish]
    # Only for a final release from main: the definitions fetch the assets from linux-vVERSION, which a -beta or -alpha release is not tagged as, and a distribution repository takes final releases only.
    if: ${{ inputs.publish && needs.source.outputs.packaging == 'true' && github.ref_name == 'main' }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.source.outputs.sha }}", persist-credentials: false}
      - name: Render package manager definitions
        env: {VERSION: "${{ needs.deb.outputs.version }}"}
        run: bash platforms/linux/packaging/render-definitions.sh "$VERSION" target/package-definitions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-package-definitions-linux-${{ needs.deb.outputs.version }}
          path: target/package-definitions/
          include-hidden-files: true
          if-no-files-found: error
  # 把同一个版本提交到 openSUSE OBS，由它构建并托管 apt、dnf 与 zypper 软件源。和上面的包定义一样只对从 main 发出的正式版本；逻辑在 publish-linux-obs.yml，提交失败时单独手动触发它即可，不用重新发版。
  obs:
    needs: [deb, package-definitions]
    if: ${{ needs.package-definitions.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/publish-linux-obs.yml
    with:
      version: ${{ needs.deb.outputs.version }}
    secrets: inherit
  # 同一个版本交给 Fedora COPR 构建，用户用 dnf copr enable msime/msime 安装；同样只对从 main 发出的正式版本，逻辑在 publish-linux-copr.yml，失败时单独手动触发它。
  copr:
    needs: [deb, package-definitions]
    if: ${{ needs.package-definitions.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/publish-linux-copr.yml
    with:
      version: ${{ needs.deb.outputs.version }}
    secrets: inherit
  # 同一个版本作为签名源码包上传到 Launchpad PPA，用户用 add-apt-repository ppa:msime/ppa 安装；同样只对从 main 发出的正式版本，逻辑在 publish-linux-ppa.yml，失败时单独手动触发它。
  ppa:
    needs: [deb, package-definitions]
    if: ${{ needs.package-definitions.result == 'success' }}
    permissions: {contents: read}
    uses: ./.github/workflows/publish-linux-ppa.yml
    with:
      version: ${{ needs.deb.outputs.version }}
    secrets: inherit
