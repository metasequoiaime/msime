name: Release Web Engine

# 构建网页内置输入法用的引擎包（msime-engine-wasm 的 wasm、加载代码、裁剪后的拼音库和五笔 86 库、整句模型、NOTICE、清单和校验和），只有 publish 为 true 时才发布为 web-engine-vX.Y.Z release。
#
# TapTapGo 在 data/msime/web-engine.lock.json 里按 sha256 和大小钉住这个 release 的每个文件，构建时下载并逐个校验。因此发布出去的 release 不能删除，附件也不能替换：哪怕只是重新上传同名文件，已经钉住它的每个构建都会校验失败。要修正就发一个新版本号。
#
# 词库和模型按 resources/desktop-dictionary.lock.json 下载并校验。web_article_eval（文章跟打的首选命中率）的输入不在本仓库，这里不跑；发布人在本地运行后把结果那一行补进 release notes。
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version of the web engine release (web-engine-vX.Y.Z), required: true, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as a web-engine-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: false, type: boolean}
      max_p95_ms: {description: "Gate on the p95 of one keys() call in latency.mjs, in milliseconds", required: false, default: '60', type: string}
permissions: {contents: read}
concurrency: {group: release-web-engine, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: version
        env: {REQUESTED: "${{ inputs.version }}", MAX_P95: "${{ inputs.max_p95_ms }}"}
        run: |
          [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "version must be X.Y.Z or X.Y.Z-pre, got '$REQUESTED'" >&2; exit 1; }
          [[ "$MAX_P95" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "max_p95_ms must be a number, got '$MAX_P95'" >&2; exit 1; }
          echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
      # 与 ci-platforms.yml 的 web-engine 作业用同样的两份官方 tarball 和 SHA-256。
      - name: Install LLVM, the wasm target, wasm-bindgen and wasm-opt
        env:
          WASM_BINDGEN_URL: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz
          WASM_BINDGEN_SHA256: b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f
          BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm
          # Installs the toolchain rust-toolchain.toml pins.
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          tools="$RUNNER_TEMP/web-engine-tools"
          mkdir -p "$tools"
          curl -sSfL -o "$tools/wasm-bindgen.tar.gz" "$WASM_BINDGEN_URL"
          echo "$WASM_BINDGEN_SHA256  $tools/wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "$tools/wasm-bindgen.tar.gz" -C "$tools"
          curl -sSfL -o "$tools/binaryen.tar.gz" "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  $tools/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$tools/binaryen.tar.gz" -C "$tools"
          echo "$tools/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "$tools/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # 1. 输入：词库 release 里的 msime-pinyin.db、msime-wubi.db 和 chinese-ime-lm 的整句模型，按锁文件的 URL 下载，长度和 SHA-256 都对上才用。
      - name: Download the pinned dictionary and model
        run: |
          set -euo pipefail
          lock=resources/desktop-dictionary.lock.json
          inputs=target/web-engine/inputs
          mkdir -p "$inputs"
          for name in msime-pinyin.db msime-wubi.db sentence-model.safetensors; do
            url="$(jq -er --arg n "$name" '.artifacts[] | select(.name == $n) | .url' "$lock")"
            sha="$(jq -er --arg n "$name" '.artifacts[] | select(.name == $n) | .sha256' "$lock")"
            size="$(jq -er --arg n "$name" '.artifacts[] | select(.name == $n) | .size' "$lock")"
            curl -sSfL --retry 3 -o "$inputs/$name" "$url"
            actual="$(stat -c %s "$inputs/$name")"
            [[ "$actual" == "$size" ]] || { echo "$name is $actual bytes, the lock says $size" >&2; exit 1; }
            echo "$sha  $inputs/$name" | sha256sum -c -
          done
      # 2. 构建；脚本内部调用 `msime-dict-build web` 裁词库，跑 NOTICE 检查和体积门槛。
      - name: Build the web engine
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          scripts/build-web-engine.sh --version "$VERSION" \
            --pinyin target/web-engine/inputs/msime-pinyin.db --wubi target/web-engine/inputs/msime-wubi.db \
            --model target/web-engine/inputs/sentence-model.safetensors
      # 3. 冒烟测试、按键延迟门槛和校验和。
      - name: Smoke test the built glue and wasm in Node
        run: |
          cargo run --locked -p msime-engine-wasm --example make_fixture -- target/web-engine/fixture/msime.db
          node crates/engine-wasm/tests/smoke.mjs target/web-engine/fixture/msime.db
      - name: Keystroke latency
        env: {MAX_P95: "${{ inputs.max_p95_ms }}"}
        run: node crates/engine-wasm/bench/latency.mjs --max-p95 "$MAX_P95"
      - name: Verify the release files
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          set -euo pipefail
          dist=target/web-engine/dist
          (cd "$dist" && sha256sum -c SHA256SUMS.txt)
          jq -e --arg v "$VERSION" --arg c "$GITHUB_SHA" '.version == $v and .source_commit == $c and ([.artifacts[].role] | sort) == (["glue", "model", "notice", "pinyin", "wasm", "wubi86"])' "$dist/web-engine-manifest.json" > /dev/null || { echo "web-engine-manifest.json does not match this build" >&2; cat "$dist/web-engine-manifest.json" >&2; exit 1; }
          if grep -q '{{source_commit}}' "$dist/NOTICE.md"; then echo "NOTICE.md still has the source commit placeholder" >&2; exit 1; fi
      # 4. 不论是否发布，都上传为 workflow artifact。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-engine-${{ steps.version.outputs.value }}
          path: target/web-engine/dist/
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.value }}
  publish:
    needs: [build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: "web-engine-${{ needs.build.outputs.version }}", path: dist}
      # workflow_dispatch 可以在任何分支上运行，所以发布必须显式要求，不能默认发生；否则在功能分支上点一次就会发出一个公开且不能撤回的 release。
      # 5. 发布 web-engine-vX.Y.Z，带上 dist/ 里的全部文件。不标为 latest：仓库的最新版本应当仍是客户端的发布。
      - name: Publish web engine release
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", VERSION: "${{ needs.build.outputs.version }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          set -euo pipefail
          dist=dist
          (cd "$dist" && sha256sum -c SHA256SUMS.txt)
          jq -r '"Built by scripts/build-web-engine.sh from metasequoiaime/msime \(.source_commit) (pinyin dictionary keeps \(.keep_multi) multi-character words).\n\nInputs: msime-pinyin.db, msime-wubi.db and sentence-model.safetensors as pinned in resources/desktop-dictionary.lock.json at that commit. Licences: NOTICE.md. Checksums: SHA256SUMS.txt; web-engine-manifest.json lists every file with its sha256 and size for data/msime/web-engine.lock.json in TapTapGo.\n\nPublished assets are never replaced or deleted, because TapTapGo pins them by sha256."' "$dist/web-engine-manifest.json" > notes.md
          tag="web-engine-v${VERSION}"; flags=(--latest=false); [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$tag" "$dist"/msime_engine_bg.wasm "$dist"/msime_engine.js "$dist"/msime-pinyin.db.gz "$dist"/msime-wubi86.db.gz "$dist"/sentence-model.safetensors.gz "$dist"/NOTICE.md "$dist"/web-engine-manifest.json "$dist"/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Web engine ${VERSION}" --notes-file notes.md "${flags[@]}"
