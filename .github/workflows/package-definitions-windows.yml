name: Package Definitions Windows
# 按一个已发布的 windows-v 发布渲染 winget、Scoop 与 Chocolatey 的包定义并打出 .nupkg，作为构建产物上传，由维护者按 platforms/windows/packaging/README.md 发布；这里不向任何外部仓库推送。只发 full 的安装包。
#
# 不放进 release-windows.yml：那里发布的是 CI 打的未签名安装包，它的 uiAccess Server 起不来，签名的那一份要维护者用 installer/Package-SimplySign.ps1 打好后替换上去，摘要也随之改变。所以在替换之后手动触发这里。render.py --tag 下载发布页上的安装包，核对它与 GitHub 记录的摘要和 .sha256 一致，并要求 Get-AuthenticodeSignature 报告 Valid，否则失败；在 Windows 上跑既是为了这个检查，也是为了 choco pack。
on:
  workflow_dispatch:
    inputs:
      version: {description: 'Released Windows version (the windows-v tag without its prefix), e.g. 0.1.0', required: true, type: string}
      prerelease: {description: Render even though the release is marked as a prerelease, required: false, default: false, type: boolean}
permissions: {contents: read}
concurrency: {group: package-definitions-windows, cancel-in-progress: false}
jobs:
  render:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Render package manager definitions
        shell: pwsh
        env: {GH_TOKEN: "${{ github.token }}", VERSION: "${{ inputs.version }}", PRERELEASE: "${{ inputs.prerelease }}"}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "version $env:VERSION is not MAJOR.MINOR.PATCH" }
          $flags = @()
          if ($env:PRERELEASE -eq 'true') { $flags += '--allow-prerelease' }
          python platforms/windows/packaging/render.py --tag "windows-v$env:VERSION" --output target/package-managers @flags
          if ($LASTEXITCODE -ne 0) { throw 'render.py failed' }
          choco pack target/package-managers/chocolatey/msime/msime.nuspec --outputdirectory target/package-managers/chocolatey
          if ($LASTEXITCODE -ne 0) { throw 'choco pack failed' }
          Get-ChildItem -Recurse target/package-managers | Format-Table FullName, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msime-package-definitions-windows-${{ inputs.version }}
          path: target/package-managers/
          if-no-files-found: error
