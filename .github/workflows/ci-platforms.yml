name: OCR runtime isolation probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: OCR isolation (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 准备固定 Android 工具链与 KVM
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          { yes || true; } | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            'ndk;28.2.13676358' 'build-tools;35.0.0' 'platforms;android-36' \
            emulator platform-tools 'system-images;android-${{ matrix.api }};default;x86_64' >/dev/null
          test -f "$ANDROID_SDK_ROOT/system-images/android-${{ matrix.api }}/default/x86_64/package.xml"
      - name: 启动专用模拟器
        run: |
          set -euo pipefail
          mkdir -p target/android
          nohup bash platforms/android/tests/device/start-emulator.sh ${{ matrix.api }} > target/android/emulator.log 2>&1 &
          serial="emulator-$((5580 - 2 * (35 - ${{ matrix.api }})))"
          echo "SERIAL=$serial" >> "$GITHUB_ENV"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 600 "$adb" -s "$serial" wait-for-device
          # shellcheck disable=SC2016 # 环境变量由子 shell 读取。
          MSIME_OCR_ADB="$adb" MSIME_OCR_SERIAL="$serial" timeout 600 bash -c 'until [ "$("$MSIME_OCR_ADB" -s "$MSIME_OCR_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 5; done'
      - name: 运行无网络权限的 OCR 与手写共存探针
        run: bash platforms/android/tests/device/ocr-runtime-probe.sh "$SERIAL"
      - name: 收取探针日志
        if: always()
        run: |
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          "$adb" -s "$SERIAL" logcat -d > target/android/ocr-logcat.txt 2>&1 || true
          "$adb" -s "$SERIAL" logcat -d -b crash > target/android/ocr-crash.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ocr-isolation-api${{ matrix.api }}
          path: |
            target/android/ocr-runtime-probe.log
            target/android/ocr-synthetic.png
            target/android/ocr-module-dependencies.txt
            target/android/ocr-logcat.txt
            target/android/ocr-crash.txt
            target/android/emulator.log
            platforms/android/gradle-app/ocr-module/build/reports/lint-results-debug.txt
            platforms/android/gradle-app/ocr-probe/build/reports/lint-results-debug.txt
          if-no-files-found: warn
      - name: 关闭专用模拟器
        if: always()
        run: '"$ANDROID_SDK_ROOT/platform-tools/adb" -s "$SERIAL" emu kill || true'
