name: Linux 首次配置专项验证

# 仅隔离验证分支使用，不进入产品 PR，也不执行发布。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-first-run:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 安装编译与界面验收依赖
        run: |
          set -euo pipefail
          df -h .
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libasound2-dev libssl-dev libcurl4-openssl-dev libxkbcommon-dev libayatana-appindicator3-dev librsvg2-dev libibus-1.0-dev nlohmann-json3-dev cmake ninja-build pkgconf webkit2gtk-driver xvfb xauth xclip dbus-x11 fonts-noto-cjk
          rustup toolchain install
          npm install -g pnpm@11.5.2
          pnpm install --frozen-lockfile --ignore-scripts
      - name: 构建真实前端与原生宿主
        run: |
          set -euo pipefail
          pnpm --filter @msime/desktop build
          TAURI_CONFIG="$(python3 -c 'import json,pathlib; print(json.dumps({"version":pathlib.Path("platforms/linux/version.txt").read_text().strip()}))')"
          export TAURI_CONFIG
          cargo build --locked -p msime-host-api -p msime-desktop --features tauri/custom-protocol
          cmake -S platforms/linux -B target/linux-build-gate/cmake -G Ninja \
            -DBUILD_TESTING=OFF -DMSIME_ENABLE_FCITX5=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/target/linux-build-gate/stage/usr" \
            -DMSIME_HOST_LIBRARY="$PWD/target/debug/libmsime_host_api.so" \
            -DMSIME_DESKTOP_BINARY="$PWD/target/debug/msime-desktop"
          cmake --build target/linux-build-gate/cmake --parallel 8
          cmake --install target/linux-build-gate/cmake
          cargo install tauri-driver --locked --root "$PWD/target/tooling/tauri-driver"
          echo "$PWD/target/tooling/tauri-driver/bin" >> "$GITHUB_PATH"
      - name: 从原生安装入口验证首次配置清单
        run: |
          set -euo pipefail
          profile="$PWD/target/linux-build-gate/ui-profile"
          mkdir -p "$profile/runtime" "$PWD/target/linux-build-gate/ui-evidence"
          chmod 700 "$profile/runtime"
          export XDG_CONFIG_HOME="$profile/config"
          export XDG_DATA_HOME="$profile/data"
          export XDG_CACHE_HOME="$profile/cache"
          export XDG_RUNTIME_DIR="$profile/runtime"
          export MSIME_CLIENT_HOST_OPTIONS="$XDG_CONFIG_HOME/msime-client/runtime-options.json"
          export MSIME_DOWNLOAD_MIRROR='https://mirror.example.invalid/'
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            python3 platforms/linux/tests/tools/first-run-downloads-ui.py \
            target/linux-build-gate/stage/usr target/linux-build-gate/ui-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        if: always()
        with:
          name: linux-first-run-downloads-ui
          path: target/linux-build-gate/ui-evidence/
