name: Native Platform CI

# Native-host gates for the four platforms that do not use the Apple runners.
# Release workflows remain separate; this workflow only builds and tests.
#
# No paths-ignore on purpose: "Android host" is a required check on main and develop, and a workflow skipped by path filtering never reports it, so a documentation-only pull request would sit in "Expected" forever (the trap ci-docs.yml describes). Every job already starts unconditionally and the changes job routes a documentation-only change to each job's "platform unchanged" step, which takes seconds.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Decide platform scope
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.decide.outputs.android }}
      linux: ${{ steps.decide.outputs.linux }}
      harmonyos: ${{ steps.decide.outputs.harmonyos }}
      windows: ${{ steps.decide.outputs.windows }}
      web: ${{ steps.decide.outputs.web }}
      engine: ${{ steps.decide.outputs.engine }}
      ui: ${{ steps.decide.outputs.ui }}
      plugins: ${{ steps.decide.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != pull_request ]] ||
             [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null || ! git cat-file -e "$HEAD_SHA" 2>/dev/null; then
            printf 'android=true\nlinux=true\nharmonyos=true\nwindows=true\nweb=true\nengine=true\nui=true\nplugins=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR 合并或关闭后合并引用被删，签出拿不到 head 提交，下面三个点的 diff 会直接报错（2026-10-02 #3118 合并 13 秒后才开跑的 iOS CI 就红在这里）。PR 已经不在了，不必构建。
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            printf 'android=false\nlinux=false\nharmonyos=false\nwindows=false\nweb=false\nengine=false\nui=false\nplugins=false\n' >> "$GITHUB_OUTPUT"; echo "PR 的 head 提交已取不到（PR 已关闭），跳过。"; exit 0
          fi
          # PR 要比的是它自己从分叉点起改了什么（三个点）。base.sha 是事件发生时目标分支的最新提交，PR 分支往往从更早的 develop 切出；两个点的 diff 比的是两棵树，会把分叉之后 develop 合进来的改动也算成本 PR 的，于是只改一个 workflow 的 PR 也被判成要编译全部平台（2026-10-02 #2902）。push 的 BASE_SHA 是推送前的提交，两个点正好是这次推送带来的改动。
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          else
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          shared=false; ui=false; plugins=false
          android=false; linux=false; harmonyos=false; windows=false; web=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            # 共享设置界面的测试只看界面代码和它的依赖清单，不看 Tauri 原生宿主、Rust 和平台目录。
            case "$path" in
              packages/ui/*|apps/desktop/src/*|apps/desktop/tests/*|apps/desktop/index.html|apps/desktop/package.json|apps/desktop/tsconfig.json|apps/desktop/vite.config.ts|apps/desktop/app-icon.svg|apps/harmony/src/*|apps/harmony/index.html|apps/harmony/package.json|apps/harmony/tsconfig.json|apps/harmony/vite.config.ts|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.nvmrc|.github/workflows/ci-platforms.yml)
                ui=true ;;
            esac
            # 脚本插件合集：插件本身、它们引用的 SDK 与模板、运行它们的沙箱和 msime-pack、几个脚本，以及插件包逐字节复制的 Unicode 许可证和常用字集生成器读的 Unihan 锁。plugins/ 和 docs/ 不在下面任何一条里，没有这一条时只改插件的 PR 什么都不跑；那两个 resources/ 文件在下面只触发 web 或什么都不触发，改了它们包就过期了。
            case "$path" in
              plugins/*|docs/script-plugin-template/*|crates/script-runtime/*|crates/pack-tool/*|scripts/build-script-plugins.sh|scripts/test-script-plugins.sh|scripts/test-script-plugin-data.py|scripts/build-official-plugins.sh|resources/licenses/Unicode-License-V3.txt|resources/character-glosses.lock.json)
                plugins=true ;;
            esac
            case "$path" in
              platforms/android/*) android=true ;;
              platforms/linux/*) linux=true ;;
              platforms/harmony/*) harmonyos=true ;;
              platforms/windows/*) windows=true ;;
              # Telemetry is compiled by the Linux and Windows hosts and DictionaryQuiesceLease.h by Linux and macOS; Android and HarmonyOS build neither, so this is not a shared path. ci-macos.yml covers the macOS side.
              platforms/common/*) linux=true; windows=true ;;
              # 网页引擎只给浏览器用，四个原生宿主都不链接它，所以这几条路径只触发 web-engine 作业，排在下面的共享路径之前。
              crates/engine-wasm/*|packages/web-engine/*|scripts/build-web-engine.sh|scripts/web-engine-notice.sh|resources/licenses/web-engine-NOTICE.md)
                web=true ;;
              # web-engine-NOTICE.md 逐字复制这几份许可证与来源说明（见 scripts/web-engine-notice.sh 的 repo 段），改了它们却不重新生成，NOTICE 就过期了；#6696 只改 LICENSE，没有任何作业被触发，过期的 NOTICE 进了 develop。
              LICENSE|resources/licenses/*|resources/helpcodes/ENGINE-NOTICE.md|resources/helpcodes/NOTICE.md)
                web=true ;;
              # 拆字表编进每个平台的引擎，它的两份锁变了，提交的表就过期了。
              shared/*|crates/*|packages/*|apps/*|scripts/*|.github/workflows/ci-platforms.yml|resources/chaizi.lock.json|resources/character-glosses.lock.json|resources/opencc.lock.json)
                shared=true ;;
              # The workspace manifests, the toolchain pin and the JS workspace: a Dependabot bump touches only these.
              Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.nvmrc)
                shared=true ;;
            esac
          done <<< "$changed"
          if [[ "$shared" == true ]]; then
            android=true; linux=true; harmonyos=true; windows=true; web=true; plugins=true
          fi
          # 引擎作业跟着共享路径走（crates/、工作区清单、工具链等），只改平台目录时不跑。
          printf 'android=%s\nlinux=%s\nharmonyos=%s\nwindows=%s\nweb=%s\nengine=%s\nui=%s\nplugins=%s\n' \
            "$android" "$linux" "$harmonyos" "$windows" "$web" "$shared" "$ui" "$plugins" >> "$GITHUB_OUTPUT"

  android:
    needs: changes
    name: Android host
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ripgrep
        if: ${{ needs.changes.outputs.android == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      # check-host.sh 在装有固定 NDK 时才把 client_jni.cpp 编译到 Android 目标上，核对 Java 的 native 声明和共享 FFI 签名一致；缺 NDK 时这一步会跳过。ubuntu-24.04 镜像 20261002 起不再预装 28.2.13676358，这里缓存并按需安装，免得这项检查悄悄失效。
      # Depot 的 ubuntu 镜像预装了 28.2.13676358，目录归 root：照旧恢复缓存会先下载 651 MB，再在解压时撞上几百个 Cannot utime: Operation not permitted，最后按未命中处理。镜像里已经有这个版本时就不碰缓存，GitHub 的 ubuntu-24.04 上照旧恢复。
      - name: Check for a preinstalled Android NDK
        id: ndk
        if: ${{ needs.changes.outputs.android == 'true' }}
        run: |
          if grep -qs '28.2.13676358' /usr/local/lib/android/sdk/ndk/28.2.13676358/source.properties; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the pinned Android NDK
        if: ${{ needs.changes.outputs.android == 'true' && steps.ndk.outputs.present != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-ndk-28.2.13676358-${{ runner.os }}
      - name: Install the pinned Android NDK
        if: ${{ needs.changes.outputs.android == 'true' }}
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          ndk="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if ! grep -qs '28.2.13676358' "$ndk/source.properties"; then
            # sdkmanager 退出后 yes 再写会收到 SIGPIPE（退出码 141），在 pipefail 下让整步失败；它的退出码不算数，装没装上由下一行的版本核对判断。
            { yes || true; } | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' >/dev/null
          fi
          grep -q '28.2.13676358' "$ndk/source.properties"
      - name: Check Android host contracts and JVM smoke tests
        if: ${{ needs.changes.outputs.android == 'true' }}
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: bash platforms/android/check-host.sh
      # check-host.sh 的 javac 不编译 home/（那里用到 Gradle 生成的 R），于是一个只动了 home/ import 的重构能通过这里的全部检查，却在发版时让 Gradle 编译失败：2026-10-06 的 Release Android 就是这样整轮失败的。这里用发版同一个 Gradle 工程只编译各版本的 Java，不需要原生库和词库。
      - name: Compile Android host Java for every edition
        if: ${{ needs.changes.outputs.android == 'true' }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: >-
          apps/desktop/src-tauri/gen/android/gradlew --project-dir platforms/android/gradle-app --console=plain
          compileFullReleaseJavaWithJavac compilePinyinReleaseJavaWithJavac compileWubiReleaseJavaWithJavac
          compileJapaneseReleaseJavaWithJavac compileVietnameseReleaseJavaWithJavac compileTibetanReleaseJavaWithJavac
      # 编译通过不代表能在 minSdk 的设备上运行：javac 按 compileSdk 解析，0.2.0 调用的 Path.of 要 API 34，Android 9 到 12 上准备词库直接 NoSuchMethodError。lint 在 gradle-app 里只开了 NewApi，这一步专门拦高于 minSdk 的调用。
      - name: Check Android API levels against minSdk
        if: ${{ needs.changes.outputs.android == 'true' }}
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: apps/desktop/src-tauri/gen/android/gradlew --project-dir platforms/android/gradle-app --console=plain lintFullRelease
      - name: Android platform unchanged
        if: ${{ needs.changes.outputs.android != 'true' }}
        run: echo 'No Android or shared-platform changes; platform gate skipped.'
  # 上面只证明编译得过；这里在 API 28 和 35 的模拟器上真正运行 client-base、client-core、client-providers、client-services 单测和 APK。0.3.0 的三个设备上才出现的问题（词库准备失败、匿名账号写不进、Android 9 启动崩溃）全过了上面那个 job。
  # 打 APK、起两台模拟器是打包级的验收，不在 PR 上跑：合进 develop 后的 push 跑一次，Release Android 发版前用同一个提交再跑一次（见 .agents/notes/implemented/process/2026-10-09-no-packaging-on-pull-requests.md）。
  android-device:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/android-device.yml

  linux:
    needs: changes
    name: Linux native host
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build IBus and Fcitx5 hosts in the pinned container
        if: ${{ needs.changes.outputs.linux == 'true' }}
        run: bash platforms/linux/build-container.sh
      - name: Linux platform unchanged
        if: ${{ needs.changes.outputs.linux != 'true' }}
        run: echo 'No Linux or shared-platform changes; platform gate skipped.'

  # 上面的容器构建只测 core 几个 crate，设置应用（msime-desktop）在 Linux 上没有任何地方编译过：首次配置页 linux_setup.rs 的测试从未在 CI 里跑过，Linux 专属的 clippy 警告也攒到了几十条。这里补上它的 clippy 和全部单元测试。
  linux-desktop:
    needs: changes
    name: Linux settings app
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Depot 的 runner 启动时已把 SCCACHE_WEBDAV_ENDPOINT 指向 Depot Cache，rustc 的产物跨运行缓存，不需要 token。缓存只为加速：sccache 装不上或服务起不来时（Depot Cache 一时连不上，#9658 的 Web engine 就这样在 cargo 第一步退出）照常不带缓存编译，只有服务真正启动了，「Enable sccache」才把 RUSTC_WRAPPER 写进环境；SCCACHE_IGNORE_SERVER_IO_ERROR=1 让构建途中服务出错时退回直接编译。CARGO_INCREMENTAL=0 是因为 sccache 不缓存增量编译。
      - name: Install sccache
        id: sccache
        if: ${{ needs.changes.outputs.linux == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ needs.changes.outputs.linux == 'true' && steps.sccache.outcome == 'success' }}
        shell: bash
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      - name: Install the Tauri build dependencies
        if: ${{ needs.changes.outputs.linux == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libasound2-dev libssl-dev libxkbcommon-dev libayatana-appindicator3-dev librsvg2-dev libibus-1.0-dev pkgconf
          # Installs the toolchain rust-toolchain.toml pins, with its clippy component.
          rustup toolchain install
      # Tauri 的构建脚本要求 frontendDist 目录存在；单元测试用不到页面，放一个空页面即可，省掉 pnpm 构建。
      - name: Clippy and unit tests for msime-desktop
        if: ${{ needs.changes.outputs.linux == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/dist
          [ -e apps/desktop/dist/index.html ] || : > apps/desktop/dist/index.html
          cargo clippy --locked -p msime-desktop --all-targets -- -D warnings
          cargo test --locked -p msime-desktop
          # 复用已构建的 Rust 依赖，检查共享 UI 的静态语音目录没有漂移。
          cargo run --quiet --locked -p msime-client-providers --example export_voice_provider_catalog -- --check
          cargo run --quiet --locked -p msime-client-providers --example export_polish_prompt_catalog -- --check
          cargo run --quiet --locked -p msime-client-providers --example export_ai_provider_catalog -- --check
      - name: Linux platform unchanged
        if: ${{ needs.changes.outputs.linux != 'true' }}
        run: echo 'No Linux or shared-platform changes; platform gate skipped.'

  # msime-engine 的单元测试和 golden 基准此前没有任何 CI 作业运行：上面的 Linux 容器只测 client-base、client-core、client-providers、client-services、input-runtime 和 host-api，提交前的 `verify-local.sh --quick` 不跑 Rust 测试，只有很少有人跑的全量 `verify-local.sh` 才跑。引擎里钉死精确次数的分配预算测试因此在 develop 上红了好几个 PR 都没人发现（见 .agents/notes/implemented/testing/2026-10-10-engine-tests-in-ci.md）。这里以 runner 的普通用户运行；整句模型不在仓库里，依赖它的测试会自行跳过并说明原因。
  engine:
    needs: changes
    name: Rust engine
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sccache
        id: sccache
        if: ${{ needs.changes.outputs.engine == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ needs.changes.outputs.engine == 'true' && steps.sccache.outcome == 'success' }}
        shell: bash
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      # 拆字表（crates/engine/src/local/chaizi*.tsv）由生成器从锁定的 kfcd/chaizi 和 Unihan 生成并提交。MSIME_FETCH=1 让契约检查在缓存里没有输入时按锁下载并逐字节核对，而不是打印 skip；输入按两份锁的摘要缓存，锁不变就不重新下载。
      - name: Restore the pinned chaizi sources
        if: ${{ needs.changes.outputs.engine == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/chaizi-cache
          key: chaizi-sources-${{ hashFiles('resources/chaizi.lock.json', 'resources/character-glosses.lock.json') }}
      - name: Chaizi tables match the generator
        if: ${{ needs.changes.outputs.engine == 'true' }}
        env:
          MSIME_FETCH: '1'
        run: python3 scripts/test-chaizi-table.py
      - name: Unit and golden tests for msime-engine
        if: ${{ needs.changes.outputs.engine == 'true' }}
        run: |
          set -euo pipefail
          # 安装 rust-toolchain.toml 钉住的工具链。
          rustup toolchain install
          cargo test --locked -p msime-engine
      - name: Engine unchanged
        if: ${{ needs.changes.outputs.engine != 'true' }}
        run: echo 'No engine or shared changes; engine tests skipped.'

  # plugins/script/ 下的脚本插件：编成 wasm、用 msime-pack 校验，按各自的夹具运行并和 expected.jsonl 核对（scripts/test-script-plugins.sh）。插件 crate 没有依赖，几秒就编完，时间主要花在 msime-pack 上，所以和别的 Rust 作业一样走 sccache。MSIME_REQUIRE_SCRIPT_PLUGINS=1 让缺 wasm 目标时失败，而不是像本机那样跳过。MSIME_FETCH=1 让 gen_common_chars.py --check 在缓存里没有 Unihan zip 时下载它（按锁校验大小和 sha256），而不是打印 skip：不这样的话 CI 从来不核对 common-chars.bin，手改或过期的字表照样通过。zip 按锁的摘要缓存，锁不变就不重新下载。
  script-plugins:
    needs: changes
    name: Script plugins
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sccache
        id: sccache
        if: ${{ needs.changes.outputs.plugins == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ needs.changes.outputs.plugins == 'true' && steps.sccache.outcome == 'success' }}
        shell: bash
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      - name: Restore the pinned Unihan zip
        if: ${{ needs.changes.outputs.plugins == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/script-plugins/cache
          key: script-plugins-unihan-${{ hashFiles('resources/character-glosses.lock.json') }}
      - name: Build and test the script plugins
        if: ${{ needs.changes.outputs.plugins == 'true' }}
        env:
          MSIME_REQUIRE_SCRIPT_PLUGINS: '1'
          MSIME_FETCH: '1'
        run: |
          set -euo pipefail
          # 安装 rust-toolchain.toml 钉住的工具链，再给它加上 wasm 目标。
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo test --locked -p msime-script-runtime
          # SDK 之外，命令行退出码、包校验和事件夹具也有独立集成测试。
          cargo test --locked -p msime-pack-tool
          bash scripts/test-script-plugins.sh
          # 随桌面安装包分发的官方插件包：重新构建，核对 latex-symbols 的生成器没有漂移、每个包过 msime-pack validate --builtin、uuid 的内容哈希等于 plugins/official-packs.json 锁定的值。锁以这台 ubuntu 的构建为准，和发版工作流的 official-plugins 作业相同；工具链或插件源码一变哈希就变，所有用户的授权随之作废，这一步让它在 PR 里变红、在 diff 里看得见。
          bash scripts/build-official-plugins.sh --check
      - name: Script plugins unchanged
        if: ${{ needs.changes.outputs.plugins != 'true' }}
        run: echo 'No script plugin, SDK, runtime or shared changes; script plugin tests skipped.'

  harmonyos:
    needs: changes
    name: HarmonyOS host
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The settings page below is built with the same toolchain contributors and the release build run; the runner's default Node is not pinned to anything.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.changes.outputs.harmonyos == 'true' }}
        with:
          node-version-file: .nvmrc
      - name: Install Node dependencies
        if: ${{ needs.changes.outputs.harmonyos == 'true' }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check and run Harmony keyboard logic tests
        if: ${{ needs.changes.outputs.harmonyos == 'true' }}
        run: bash platforms/harmony/tests/run.sh
      # The settings window is a WebView over a page built from packages/ui by platforms/harmony/stage-settings.sh before every HAP build. It used to be committed, and every shared-UI pull request then conflicted on it; this checks it stays uncommitted and still builds into the one file the WebView can read. This job already runs for every shared-UI change and already has pnpm, which is all the check needs.
      - name: Check the settings page builds and is not committed
        if: ${{ needs.changes.outputs.harmonyos == 'true' }}
        run: python3 scripts/test-harmony-settings-bundle.py
      - name: HarmonyOS platform unchanged
        if: ${{ needs.changes.outputs.harmonyos != 'true' }}
        run: echo 'No HarmonyOS or shared-platform changes; platform gate skipped.'

  # 共享设置界面（packages/ui，鸿蒙、各平台的设置窗口都画它）的 lint、类型检查和 vitest。之前没有任何门禁跑 vitest：推送前钩子跑的 verify-local.sh --quick 在 typescript 阶段之前就退出了，一个让测试失败的改动就这样合进了 develop。和别的平台 job 一样，没动界面时照样跑完并说明跳过：这是必需检查，跳过的状态会挡住合并。
  ui:
    needs: changes
    name: Shared settings UI
    runs-on: depot-ubuntu-24.04
    # 完整测试已接近 20 分钟；为依赖安装、类型检查和结果上传保留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.ui == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.changes.outputs.ui == 'true' }}
        with:
          node-version-file: .nvmrc
      - name: Install Node dependencies
        if: ${{ needs.changes.outputs.ui == 'true' }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        if: ${{ needs.changes.outputs.ui == 'true' }}
        run: pnpm run lint
      - name: Type-check the settings shells
        if: ${{ needs.changes.outputs.ui == 'true' }}
        run: |
          (cd apps/desktop && ./node_modules/.bin/tsc --noEmit -p tsconfig.json)
          (cd apps/harmony && ./node_modules/.bin/tsc --noEmit -p tsconfig.json)
      # 用项目自己的 vitest，不用 npx：npx 的那份从自己的缓存解析 jsdom，起不来 jsdom worker 却照样报成功（见 verify-local.sh 的 typescript 阶段）。
      - name: Run the shared UI tests
        if: ${{ needs.changes.outputs.ui == 'true' }}
        run: cd apps/desktop && ./node_modules/.bin/vitest run --maxWorkers=2 --reporter=verbose --reporter=junit --outputFile=../../target/shared-ui-junit.xml
      - name: Upload shared UI test results
        if: ${{ always() && needs.changes.outputs.ui == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-ui-junit
          path: target/shared-ui-junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Shared UI unchanged
        if: ${{ needs.changes.outputs.ui != 'true' }}
        run: echo 'No shared UI changes; UI tests skipped.'

  windows:
    needs: changes
    name: Windows GNU cross build
    runs-on: depot-ubuntu-24.04-16
    # Ubuntu 24.04 的 MinGW 缺少 `msimeui` 使用的 `d2d1_3.h`，因此沿用交叉镜像的 Debian 系统依赖与线程模型，`checkout` 后复用同一别名脚本。
    container: debian:trixie-slim
    timeout-minutes: 90
    steps:
      - name: Install MinGW cross toolchain
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64 build-essential cmake ninja-build pkg-config curl ca-certificates git zip unzip tar python3
          # The unsuffixed compiler defaults to the win32 thread model, whose C++ library has no std::thread.
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Checked out after git is installed, so the tree is a real repository rather than an API download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare MinGW header aliases
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: |
          python3 platforms/windows/cross/add-header-aliases.py \
            /usr/share/mingw-w64/include /usr/x86_64-w64-mingw32/include
      - name: Build Windows host, TSF DLL and native tests
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: |
          # The workspace is owned by the runner user, not the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Installs the toolchain rust-toolchain.toml pins.
          rustup toolchain install
          bash platforms/windows/build-cross.sh x64
      # 候选皮肤截图工具在这里随整棵树一起交叉编译，由下面的 windows-skin-gallery 作业在 Windows runner 上运行。只带它和它加载的 DLL，去掉调试信息：Debug 构建的 host DLL 带着整个引擎的调试信息。
      - name: Stage the candidate skin gallery tool
        if: ${{ needs.changes.outputs.windows == 'true' }}
        run: |
          stage=target/windows-candidate-skin-gallery-tool
          mkdir -p "$stage"
          for file in msime-candidate-skin-gallery.exe windows-candidate-image-animation.exe windows-candidate-canvas-preview.exe msime_host_api.dll libstdc++-6.dll libwinpthread-1.dll libgcc_s_seh-1.dll; do
            x86_64-w64-mingw32-strip --strip-debug -o "$stage/$file" "target/windows-full/x64/$file"
          done
          ls -l "$stage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.changes.outputs.windows == 'true' }}
        with:
          name: windows-candidate-skin-gallery-tool
          path: target/windows-candidate-skin-gallery-tool/
          if-no-files-found: error
          retention-days: 3
      - name: Windows platform unchanged
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo 'No Windows or shared-platform changes; platform gate skipped.'

  # 候选皮肤截图：上面交叉编译的截图工具用 Server 的候选窗把 crates/client-services/tests/fixtures/candidate-skins 里的每款皮肤（和不带皮肤的基线）按横竖排、浅深色画在一页假候选上，从这台 runner 的桌面截下来，作为 windows-candidate-skin-gallery 产物上传，没有 Windows 机器也能看皮肤画得对不对。皮肤加载失败、截图失败或截到空白时这一步失败。
  windows-skin-gallery:
    needs: [changes, windows]
    name: Windows candidate skin gallery
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.changes.outputs.windows == 'true' }}
        with:
          name: windows-candidate-skin-gallery-tool
          path: target/windows-candidate-skin-gallery-tool
      # 托管 runner 的桌面缺省 1024 宽，候选窗最多占工作区一半宽，九个候选加释义挤在一起，英文释义被折成半个单词。调到 1920x1080，截图才像用户的屏幕；调不了只记一行，截图照样进行（工具日志里有实际的工作区）。
      - name: Raise the desktop resolution
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: powershell
        run: |
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
            Write-Host 'Desktop resolution set to 1920x1080'
          } catch {
            Write-Host "Desktop resolution unchanged: $($_.Exception.Message)"
          }
      - name: Render the candidate skins
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          & target/windows-candidate-skin-gallery-tool/windows-candidate-canvas-preview.exe
          if ($LASTEXITCODE -ne 0) { throw "Candidate canvas preview tests failed with exit code $LASTEXITCODE" }
          & target/windows-candidate-skin-gallery-tool/windows-candidate-image-animation.exe
          if ($LASTEXITCODE -ne 0) { throw "Candidate image animation tests failed with exit code $LASTEXITCODE" }
          & target/windows-candidate-skin-gallery-tool/msime-candidate-skin-gallery.exe --verify-image-animation --skins crates/client-services/tests/fixtures/candidate-skins --output target/windows-candidate-skin-gallery
          # -1073741515 (0xC0000135) means a DLL the tool imports is missing from the staged directory.
          if ($LASTEXITCODE -ne 0) { throw "Candidate skin gallery failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.changes.outputs.windows == 'true' }}
        with:
          name: windows-candidate-skin-gallery
          path: target/windows-candidate-skin-gallery/
          if-no-files-found: warn
      - name: Windows platform unchanged
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo 'No Windows or shared-platform changes; skin gallery skipped.'

  # WinUI 3 不在 MinGW 的编译范围内；直接使用发布设置工程做 MSVC 编译。
  windows-settings:
    needs: changes
    name: Windows native settings
    runs-on: windows-2025
    # 完整 WinUI、Win7 设置、手写及多版本门禁已实测耗时 39 分钟，保留冷构建余量。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the settings host
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          cargo build --locked -p msime-host-api -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Settings host library build failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = @(& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\amd64\MSBuild.exe')
          if ($msbuild.Count -lt 1) { throw 'MSBuild not found' }
          # 使用与发布脚本相同的完整 Build，确保 Windows SDK 引用和 WinRT 投影均已初始化。
          $output = "$env:GITHUB_WORKSPACE/target/windows-full/x64/settings/"
          & $msbuild[0] platforms/windows/settings/MSIME.Settings.vcxproj /restore /t:Build /p:Configuration=RelWithDebInfo /p:Platform=x64 /p:TargetName=msime-client-settings /p:HostApiLibrary="$env:GITHUB_WORKSPACE/target/debug/msime_host_api.dll.lib" /p:OutDir="$output" /p:IntDir="$env:GITHUB_WORKSPACE/target/windows-full/x64/settings-obj/" /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Settings host build failed' }
          Copy-Item target/debug/msime_host_api.dll $output
      - name: Build and test the compatibility settings host
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path -LiteralPath $toolchain -PathType Leaf)) { throw 'vcpkg toolchain not found' }
          $output = 'target/windows-full/x64/win7-settings'
          # 使用同一提交的普通核心验证 HWND 和持久化；Win7 目标与实机另做验收。
          cmake -S platforms/windows/settings/win7 -B $output -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/target/windows-native-deps/win7-settings" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md "-DMSIME_HOST_LIBRARY=$env:GITHUB_WORKSPACE/target/debug/msime_host_api.dll.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility settings configuration failed' }
          cmake --build $output --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility settings build failed' }
          Copy-Item target/debug/msime_host_api.dll "$output/RelWithDebInfo/"
          ctest --test-dir $output -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility settings tests failed' }
          cmake -S platforms/windows/compat -B target/windows7-compat/x64 -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility API configuration failed' }
          cmake --build target/windows7-compat/x64 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility API build failed' }
          ctest --test-dir target/windows7-compat/x64 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility API tests failed' }
          & ./platforms/windows/tests/tools/windows7_imports.ps1
      - name: Build and test Windows 7 handwriting host
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p msime-host-windows --lib ink::
          if ($LASTEXITCODE -ne 0) { throw 'Windows handwriting backend tests failed' }
          cargo test --locked -p msime-host-api --lib windows_handwriting::
          if ($LASTEXITCODE -ne 0) { throw 'Windows handwriting ABI tests failed' }
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          $output = 'target/windows-full/x64/win7-panels'
          # 复用设置窗口的最小依赖清单；普通核心验证控件，Win7 目标另做兼容验收。
          cmake -S platforms/windows/panels/win7 -B $output -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE/platforms/windows/settings/win7" "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/target/windows-native-deps/win7-settings" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md "-DMSIME_HOST_LIBRARY=$env:GITHUB_WORKSPACE/target/debug/msime_host_api.dll.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Windows 7 handwriting configuration failed' }
          cmake --build $output --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows 7 handwriting build failed' }
          Copy-Item target/debug/msime_host_api.dll "$output/RelWithDebInfo/"
          ctest --test-dir $output -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows 7 handwriting controls tests failed' }
      - name: Check Windows 7 product editions
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          foreach ($edition in @('wubi', 'japanese')) {
            foreach ($surface in @('settings', 'panels')) {
              $output = "target/windows-$edition/x64/win7-$surface"
              cmake -S "platforms/windows/$surface/win7" -B $output -A x64 "-DMSIME_EDITION=$edition" "-DCMAKE_TOOLCHAIN_FILE=$toolchain" "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE/platforms/windows/settings/win7" "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/target/windows-native-deps/win7-settings" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md "-DMSIME_HOST_LIBRARY=$env:GITHUB_WORKSPACE/target/debug/msime_host_api.dll.lib"
              if ($LASTEXITCODE -ne 0) { throw "Windows 7 $edition $surface configuration failed" }
              cmake --build $output --config RelWithDebInfo --parallel 2
              if ($LASTEXITCODE -ne 0) { throw "Windows 7 $edition $surface build failed" }
              Copy-Item target/debug/msime_host_api.dll "$output/RelWithDebInfo/"
              ctest --test-dir $output -C RelWithDebInfo --output-on-failure
              if ($LASTEXITCODE -ne 0) { throw "Windows 7 $edition $surface tests failed" }
            }
          }
      - name: Inspect native settings pages
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: powershell
        run: |
          & platforms/windows/tests/tools/settings_ui.ps1 -Program target/windows-full/x64/settings/msime-client-settings.exe -OutputDirectory target/windows-full/x64/settings-screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Settings UI smoke failed' }
      - name: Inspect custom voice recorder
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: powershell
        run: |
          & platforms/windows/tests/tools/settings_ui.ps1 -Program target/windows-full/x64/settings/msime-client-settings.exe -OutputDirectory target/windows-full/x64/settings-screenshots/voice-hotkey -VoiceHotkeyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Voice hotkey UI smoke failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && needs.changes.outputs.windows == 'true' }}
        with:
          name: windows-native-settings-screenshots
          path: target/windows-full/x64/settings-screenshots/
          if-no-files-found: warn
      - name: Windows settings unchanged
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo 'No Windows settings changes; native gate skipped.'

  windows-scripts:
    needs: changes
    name: Windows release script tests
    # The release scripts are PowerShell run on Windows, and the cross-build container above has no pwsh, so their probe tests run on a Windows runner. None of them compiles anything.
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run release script tests
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          foreach ($test in 'portable_executable', 'runtime_dependencies', 'collect_notices', 'build_client') {
            Write-Host "== $test"
            & pwsh -NoProfile -File "platforms/windows/tests/tools/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
      - name: Verify Server manifest modes and unsigned launch
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: ./platforms/windows/tests/server-manifest/verify.ps1
      # The installer script itself cannot be compiled here, so these read msime_setup.iss for its lifecycle contracts. watchdog-task also registers the logon task's exact /TR text with Task Scheduler under a throwaway name and reads back what schtasks stored; the hosted runner is elevated, which that round trip needs.
      - name: Run installer script tests
        if: ${{ needs.changes.outputs.windows == 'true' }}
        shell: pwsh
        run: |
          foreach ($test in 'lifecycle', 'watchdog-task', 'tauri-layout', 'tsf-registration', 'signpath-payload', 'installer_entry') {
            Write-Host "== $test"
            & pwsh -NoProfile -File "platforms/windows/installer/tests/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
      - name: Windows platform unchanged
        if: ${{ needs.changes.outputs.windows != 'true' }}
        run: echo 'No Windows or shared-platform changes; platform gate skipped.'

  web-engine:
    needs: changes
    name: Web engine (wasm)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install sccache
        id: sccache
        if: ${{ needs.changes.outputs.web == 'true' }}
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Enable sccache
        if: ${{ needs.changes.outputs.web == 'true' && steps.sccache.outcome == 'success' }}
        shell: bash
        run: |
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache did not start; the Rust build runs without the compile cache"
          fi
      # wasm-bindgen CLI 必须和 crates/engine-wasm 钉住的 wasm-bindgen crate 同为 0.2.128，wasm-opt 用 binaryen version_133；两个官方 tarball 的 SHA-256 记在这里，下载后先校验再用。release-web-engine.yml 用同样的两份。
      - name: Install LLVM, the wasm target, wasm-bindgen and wasm-opt
        if: ${{ needs.changes.outputs.web == 'true' }}
        env:
          WASM_BINDGEN_URL: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz
          WASM_BINDGEN_SHA256: b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f
          BINARYEN_URL: https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm
          # Installs the toolchain rust-toolchain.toml pins.
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          tools="$RUNNER_TEMP/web-engine-tools"
          mkdir -p "$tools"
          curl -sSfL -o "$tools/wasm-bindgen.tar.gz" "$WASM_BINDGEN_URL"
          echo "$WASM_BINDGEN_SHA256  $tools/wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf "$tools/wasm-bindgen.tar.gz" -C "$tools"
          curl -sSfL -o "$tools/binaryen.tar.gz" "$BINARYEN_URL"
          echo "$BINARYEN_SHA256  $tools/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$tools/binaryen.tar.gz" -C "$tools"
          echo "$tools/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "$tools/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.changes.outputs.web == 'true' }}
        with:
          node-version-file: .nvmrc
      # 不带词库和模型：它们是 release 才下载的大文件。NOTICE 的 --check 在脚本里跑。
      - name: Build the web engine
        if: ${{ needs.changes.outputs.web == 'true' }}
        run: scripts/build-web-engine.sh --no-data
      - name: Smoke test the built glue and wasm in Node
        if: ${{ needs.changes.outputs.web == 'true' }}
        run: |
          cargo run --locked -p msime-engine-wasm --example make_fixture -- target/web-engine/fixture/msime.db
          node crates/engine-wasm/tests/smoke.mjs target/web-engine/fixture/msime.db
      # SDK（@msime/web-engine）：test/ 下全部 *.test.mjs 单元测试（按键映射、皮肤解析等，glob 由 Node 自己展开），对构建脚本组装出的 npm 包做的端到端冒烟，以及在 runner 自带的 google-chrome 里跑的候选栏和 attachInput 接线检查（candidates.browser.mjs）。
      - name: Test the web engine SDK
        if: ${{ needs.changes.outputs.web == 'true' }}
        run: |
          node --test 'packages/web-engine/test/*.test.mjs'
          node packages/web-engine/test/smoke.mjs target/web-engine/fixture/msime.db
          node packages/web-engine/test/candidates.browser.mjs
      # 包括 routing.rs 和 notice.rs；parity.rs 与 rerank_routing.rs 需要真实词库，没有 MSIME_EVAL_RESOURCES 时跳过。
      - name: Test msime-engine-wasm
        if: ${{ needs.changes.outputs.web == 'true' }}
        run: cargo test --locked -p msime-engine-wasm
      # bindings.rs 只在 wasm32 上编译，只有这一步会 lint 到它。
      - name: Clippy on the wasm target
        if: ${{ needs.changes.outputs.web == 'true' }}
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo clippy --locked -p msime-engine-wasm --target wasm32-unknown-unknown -- -D warnings
      # PR 上只验证能构建，不出产物。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.changes.outputs.web == 'true' && github.event_name != 'pull_request' }}
        with:
          name: web-engine-${{ github.sha }}
          path: target/web-engine/dist/
          if-no-files-found: error
      - name: Web engine unchanged
        if: ${{ needs.changes.outputs.web != 'true' }}
        run: echo 'No web engine or shared changes; web engine gate skipped.'
