name: Offline ASR verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    name: Real offline ASR (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      MSIME_ANDROID_ABIS: x86_64
      SERIAL: emulator-5580
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools and the pinned NDK
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libxml2-utils pulseaudio pulseaudio-utils espeak-ng
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          rustup toolchain install
          rustup target add x86_64-linux-android
          { yes || true; } | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            'ndk;28.2.13676358' 'build-tools;35.0.0' 'platforms;android-35' 'platforms;android-36' \
            emulator platform-tools 'system-images;android-35;default;x86_64' >/dev/null
          grep -q '28.2.13676358' "$ANDROID_SDK_ROOT/ndk/28.2.13676358/source.properties"
          mkdir -p target/android
      - name: Build the native product and test APKs
        run: |
          set -euo pipefail
          bash platforms/windows/bootstrap-vcpkg.sh
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources --locked -- target/resources)"
          bash platforms/android/build-apk.sh "$resource_dir"
          bash platforms/android/tests/device/build-editor.sh
          sha256sum target/android/msime-android.apk target/android/editor-test.apk > target/android/asr-apk-sha256.txt
      - name: Prepare only synthetic microphone audio and the locked model
        run: |
          set -euo pipefail
          umask 077
          # 独立托管 runner 只暴露本任务的空音频设备，不接宿主实体麦克风。
          socket="$PWD/target/android/pulse-native"
          pulseaudio -n --daemonize=yes --exit-idle-time=-1 \
            --load="module-native-protocol-unix socket=$socket auth-anonymous=1" \
            --load='module-null-sink sink_name=msime_synthetic' \
            --log-target="file:$PWD/target/android/pulse.log"
          export PULSE_SERVER="unix:$socket"
          pactl set-default-source msime_synthetic.monitor
          printf 'PULSE_SERVER=%s\nPULSE_SOURCE=msime_synthetic.monitor\n' "$PULSE_SERVER" >> "$GITHUB_ENV"
          pactl list short sources > target/android/asr-host-sources.txt
          espeak-ng -v en-us -s 135 -w target/android/synthetic-greeting.wav 'Hello world. Hello world.'
          # 下载归档严格复用产品模型目录的大小与摘要，不自行选择模型版本。
          python3 - <<'PYMODEL'
          import hashlib, json, urllib.request
          from pathlib import Path
          model = next(m for m in json.loads(Path('resources/local-asr-models.json').read_text())['models'] if m['id'] == 'x-asr-zh-en-streaming')
          archive = model['archive']
          path = Path('target/android/synthetic-offline-model.tar.bz2')
          urllib.request.urlretrieve(archive['url'], path)
          if path.stat().st_size != archive['size'] or hashlib.sha256(path.read_bytes()).hexdigest() != archive['sha256']:
              raise SystemExit('固定语音模型归档校验失败')
          print('Pinned model size and SHA-256 matched')
          PYMODEL
      - name: Boot a dedicated AVD with its synthetic PulseAudio source
        run: |
          set -euo pipefail
          avd_home="$PWD/target/android/avd-home"
          mkdir -p "$avd_home"
          tools_marker="$ANDROID_SDK_ROOT/cmdline-tools/msime-avd-test"
          mkdir -p "$tools_marker"
          printf 'no\n' | ANDROID_AVD_HOME="$avd_home" AVDMANAGER_OPTS="-Dcom.android.sdkmanager.toolsdir=\"$tools_marker\"" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd --name msime-client-test \
            --package 'system-images;android-35;default;x86_64' --path "$avd_home/msime-client-test.avd" --device pixel_6
          "$ANDROID_SDK_ROOT/emulator/emulator" -help-allow-host-audio > target/android/asr-audio-option.txt
          nohup env ANDROID_AVD_HOME="$avd_home" QEMU_AUDIO_DRV=pa \
            "$ANDROID_SDK_ROOT/emulator/emulator" -avd msime-client-test -port 5580 \
            -no-window -no-snapshot -no-metrics -gpu swiftshader -memory 2560 \
            -allow-host-audio -audio-in pa -audio-out none > target/android/emulator.log 2>&1 &
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 600 "$adb" -s "$SERIAL" wait-for-device
          timeout 600 bash -c "until [ \"\$('$adb' -s $SERIAL shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r')\" = 1 ]; do sleep 5; done"
          "$adb" -s "$SERIAL" emu avd hostmicon
          "$adb" -s "$SERIAL" shell input keyevent 82
      - name: Import the model through the actual product and recognize offline
        run: |
          set -euo pipefail
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          "$adb" -s "$SERIAL" install --no-streaming --no-incremental target/android/msime-android.apk
          "$adb" -s "$SERIAL" install --no-streaming --no-incremental target/android/editor-test.apk
          "$adb" -s "$SERIAL" push target/android/synthetic-offline-model.tar.bz2 /data/local/tmp/msime-synthetic-offline-model.tar.bz2
          component=app.msime.android.test/.VoiceRecognitionLifecycleDeviceSmoke
          "$adb" -s "$SERIAL" shell am instrument -w -r -e scenario offline-prepare "$component" | tee target/android/asr-prepare.log
          grep -q '^INSTRUMENTATION_CODE: -1' target/android/asr-prepare.log
          "$adb" -s "$SERIAL" shell pm grant app.msime.android android.permission.RECORD_AUDIO
          "$adb" -s "$SERIAL" shell cmd connectivity airplane-mode enable
          "$adb" -s "$SERIAL" shell svc wifi disable
          "$adb" -s "$SERIAL" shell svc data disable
          [[ $("$adb" -s "$SERIAL" shell settings get global airplane_mode_on | tr -d '\r') == 1 ]]
          # 只循环合成问候；产品仍须实际 AudioRecord、JNI 模型、音量界面和原生回传全部通过。
          timeout 90 bash -c 'while :; do paplay --device=msime_synthetic target/android/synthetic-greeting.wav; sleep 1; done' > target/android/asr-audio-feed.log 2>&1 &
          feed_pid=$!
          trap 'kill "$feed_pid" 2>/dev/null || true; wait "$feed_pid" 2>/dev/null || true' EXIT
          timeout 120 "$adb" -s "$SERIAL" shell am instrument -w -r -e scenario offline-asr "$component" | tee target/android/asr-result.log
          grep -q '^INSTRUMENTATION_CODE: -1' target/android/asr-result.log
          grep -q 'Offline voice boundary passed: offline-asr' target/android/asr-result.log
      - name: Collect only the dedicated synthetic device evidence
        if: always()
        run: |
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          "$adb" -s "$SERIAL" logcat -d > target/android/logcat.txt 2>&1 || true
          "$adb" -s "$SERIAL" logcat -d -b crash > target/android/crash.txt 2>&1 || true
          timeout 20 "$adb" -s "$SERIAL" exec-out screencap -p > target/android/asr-final.png || true
          timeout 20 pactl list short source-outputs > target/android/asr-host-capture.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: offline-asr-api35-evidence
          path: |
            target/android/asr-*.log
            target/android/asr-*.txt
            target/android/asr-*.png
            target/android/emulator.log
            target/android/pulse.log
            target/android/logcat.txt
            target/android/crash.txt
          if-no-files-found: ignore
      - name: Stop the dedicated AVD and audio daemon
        if: always()
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$SERIAL" emu avd hostmicoff || true
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s "$SERIAL" emu kill || true
          pulseaudio --kill || true
