name: macOS CI

# macOS 的构建、测试与 sanitizer。iOS 的改动不该让 macOS 的编译器跑起来,反过来也一样 —— 这两半原来同在 ci.yml 里,任何一次改动都要两边都编一遍。
#
# 触发条件不按路径过滤,而是文件内部先算一遍改动范围,再决定重活跑不跑。分支保护是按 job 名字要求检查的:workflow 整个没被触发时它什么都不上报,PR 就永远卡在等一个不会来的检查上;而在 workflow 内部被 `if:` 跳过的 job 会上报 skipped,那是算通过的。

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - CHANGELOG.md
      - PRIVACY.md
      - README.md
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - PRIVACY.md
      - README.md
  workflow_dispatch:

  merge_group:

  # 每天在默认分支上完整构建并跑一遍 CTest。push 和 PR 只在改动碰到 macOS 相关路径时才跑 Test，其余改动带进来的回归（2026-10-02 一次攒到 9 项）要等到下一个碰巧触发构建的 PR 才暴露；定时运行不走路径判断，最多隔一天就会报出来。
  schedule:
    - cron: "17 18 * * *"

concurrency:
  # Keyed by event as well as branch: promote-release-branch.sh and merge-release-pr.sh dispatch this workflow and wait on that exact run, so a pull_request run on the same branch must not cancel it.
  #
  # 拉取请求那一半按 PR 号而不是 head 分支名:head.ref 是 head 仓库上的裸名字,这是个公开仓库,fork 里的 `fix/foo` 和本仓的 `fix/foo` 会落进同一个组、互相取消。非 PR 事件仍旧回退到 ref_name,行为不变。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  #
  # Only pull_request runs cancel their superseded predecessor. A push run on develop or main is the check run on that commit, and a release branch is cut from a develop commit: if the next develop push cancelled it, the release PR would carry those cancelled runs as failed checks (ci.yml, ci-docs.yml, ci-ios.yml and ci-platforms.yml follow the same rule).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Decide whether macOS needs building
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed paths
        id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # 手动触发和合并队列一律构建:前者是有人明确要这一次,后者是合并前最后一道,两种情况都不该由路径来猜。
          if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 拿不到可比的两端时也构建。范围算不出来不等于没有改动,而少构建一次的代价是把问题放过去。
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR 要比的是它自己从分叉点起改了什么（三个点）。base.sha 是事件发生时目标分支的最新提交，PR 分支往往从更早的 develop 切出；两个点的 diff 比的是两棵树，会把分叉之后 develop 合进来的改动也算成本 PR 的，于是只改一个 workflow 的 PR 也被判成要编译全部平台（2026-10-02 #2902）。push 的 BASE_SHA 是推送前的提交，两个点正好是这次推送带来的改动。
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          else
            changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          printf '改动文件:\n%s\n' "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              platforms/macos/*|LICENSE|THIRD_PARTY_NOTICES.txt)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "macOS 改动: $path"; exit 0 ;;
              shared/*|platforms/common/*|.github/workflows/ci-macos.yml)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "共享输入改动: $path"; exit 0 ;;
              # 工作区清单与工具链:Dependabot 的 cargo 分组只改这几个。crates/ 只列这条构建真正编译的:
              # CMakeLists.txt 直接编 host-macos/native,cargo build -p msime-host-api 带上它依赖的三个 crate。
              # host-windows、mcp-server 等改动重编 macOS 不会多发现什么,理由同下面 scripts/ 那段。
              Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|crates/host-macos/*|crates/host-api/*|crates/client-core/*|crates/engine/*|crates/input-runtime/*)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "Rust 输入改动: $path"; exit 0 ;;
              # scripts/ 里只有这些进得了 macOS 的构建。其余七十来个是各平台自己的契约检查,由 Core CI
              # 和 verify-local.sh 跑,改它们重编一次 macOS 不会多发现任何东西 —— 而 `scripts/*` 让每一个
              # 都触发双架构构建加 Sanitizers:一个 test-android-preference-keys.py 的改动要三台 macOS
              # 机器,公开仓库的 macOS 并发额度是个位数,队列因此堵过。
              #
              # fetch_voice_runtime.py 和它读的 voice-runtime.lock.json 决定打进包里的 sherpa-onnx 运行库,由 platforms/macos/CMakeLists.txt 在构建时调用。build_backend_swift.sh、install.sh 等 macOS 专用脚本在 platforms/macos/scripts/ 下,已由 platforms/macos/* 覆盖。下面格式检查步骤引用的 scripts/format.sh 目前不存在,不再触发构建。
              resources/voice-runtime.lock.json|scripts/fetch_voice_runtime.py)
                echo "build=true" >> "$GITHUB_OUTPUT"; echo "构建脚本改动: $path"; exit 0 ;;
            esac
          done <<< "$changed"
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "本次改动不涉及macOS,跳过构建。"

  macos:
    needs: changes
    # 这个 job 总是启动,重活才按 changes 跳过。放在 job 级的 `if:` 会让矩阵根本不展开:GitHub 上报的是字面量 `macOS 15 ${{ matrix.architecture }}` 这一个 check,而分支保护等的是 `macOS 15 arm64` 和 `macOS 15 x86_64` —— 它们永远不会出现,于是只动 platforms/ios 的 PR 一个都合不进 main,报错只有一句「the base branch policy prohibits the merge」。
    name: macOS 15 ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    # 只有真要构建时才落到 macOS runner 上。要出现的 check 名字由 `name:` 决定,和跑在哪台机器无关,
    # 所以分支保护照样等到 `macOS 15 arm64` 和 `macOS 15 x86_64`,上面那段注释说的问题不会回来。
    #
    # 不这样的话,每个分支不论改了什么都占住两台 macOS runner —— 其中 macos-15-intel 尤其紧俏 ——
    # 而 build=false 时它们只做一次签出:格式检查那一步在本仓库走的是 scripts/format.sh 不存在的分支,
    # 只 echo 一行。公开仓库的 macOS 并发额度本来就只有个位数,iOS CI 还和它抢同一批机器,于是十来个
    # 活跃分支就能把队列堵死,而堵住队列的绝大多数 job 什么也没做。
    runs-on: ${{ needs.changes.outputs.build == 'true' && matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      # Cheap and runs before the build so a formatting slip fails in seconds rather than after the full compile. Formatting is architecture independent, so only one leg checks it. Same pinned formatter version as MSIME-Linux.
      - name: Check formatting
        if: ${{ matrix.architecture == 'arm64' }}
        run: if [[ -x scripts/format.sh ]]; then scripts/format.sh --check; else echo 'format script is not present in this branch; skipped'; fi
      # runner 上下文在 job 级 env 里不可用,所以在这里写进 GITHUB_ENV,后面的步骤都能读到。
      - name: Point the Sparkle download at the cache
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: echo "METASEQUOIA_SPARKLE_CACHE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Cache the pinned Sparkle archive
        if: ${{ needs.changes.outputs.build == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle-archive
          # 版本和摘要写在 platforms/macos/CMakeLists.txt 里,键要指向那个文件。仓库根目录没有 CMakeLists.txt,而 hashFiles 对不存在的路径返回空串 —— 原来的键因此是常量 `sparkle-macOS-`,版本一动它也不动,恰好是这条注释说要避免的情况。
          key: sparkle-2.9.6-${{ runner.os }}-${{ hashFiles('platforms/macos/CMakeLists.txt') }}
      - name: Prepare pinned Sparkle
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-archive"
          archive="$RUNNER_TEMP/sparkle-archive/Sparkle-2.9.6.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
              --output "$archive"
          fi
          # 每次都校验,不只在下载之后:缓存条目是先前的运行写进去的,来源并不比一次下载更可信。
          printf '%s  %s\n' \
            '52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192' \
            "$archive" | shasum -a 256 --check
          rm -rf "$RUNNER_TEMP/sparkle"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"
          test -d "$RUNNER_TEMP/sparkle/Sparkle.framework"
          echo "MSIME_SPARKLE_ROOT=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Remove unused runner taps
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: if brew tap | grep -Fxq aws/tap; then brew untap aws/tap; fi
      - name: Install dependencies
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: brew install nlohmann-json
      # Against /usr/bin/python3 specifically, which is the Command Line Tools interpreter a
      # contributor gets by default and is several minor versions behind the runner's python3. A
      # PEP 701 f-string shipped in fetch_dictionary.py and broke build.sh on a clean machine while
      # CI stayed green, because CI never ran it under that interpreter.
      - name: Check the tooling parses under the stock macOS interpreter
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: /usr/bin/python3 -m compileall -q scripts platforms/macos/tests platforms/ios/scripts platforms/ios/tests
      - name: Build the Rust host library
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: cargo build --locked -p msime-host-api
      # The unit tests run against a fixture rather than the released database: they assert behaviour
      # around composition, not dictionary content, and downloading 100 MB per run to do it would buy
      # nothing. The release build is what verifies the real data, against the digests in the lock.
      - name: Create test dictionary
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: python3 platforms/macos/tests/create_fixture_dictionary.py "$RUNNER_TEMP/msime.db"
      - name: Type-check registration helper
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: |
          if [[ -f platforms/macos/scripts/register_input_source.swift ]]; then
            xcrun swiftc -typecheck platforms/macos/scripts/register_input_source.swift
          else
            echo 'register_input_source.swift is not present in this branch; skipped.'
          fi
      - name: Configure
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: cmake -S platforms/macos -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)" -DMSIME_SPARKLE_ROOT="$MSIME_SPARKLE_ROOT" -DMETASEQUOIA_IME_DICTIONARY="$RUNNER_TEMP/msime.db"
      # An explicit job count: with the Makefile generator a bare `--parallel` becomes `make -j` with no limit, which starts every ready compile at once. Once whisper and ggml were linked into the input method (4737c9651) that was enough to run the 7 GB arm64 runner out of memory, and the step sat swapping until the 60-minute job limit cancelled it on every run that built.
      - name: Build
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"
      # On the Intel runner every view SwiftUI draws through RenderBox aborted inside Metal: loading RenderBox's precompiled binary archive asks the paravirtual GPU for an architecture it does not report ("Target device architecture is nil"), and nothing of ours is on that stack. RenderBox's own switches skip the archive and the GPU, so these tests still lay out and draw there, on the CPU.
      - name: Test
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: |
          if [[ "$(uname -m)" == x86_64 ]]; then export RB_USE_BINARY_ARCHIVE=0 RB_DISABLE_GPU=1; fi
          ctest --no-tests=error --test-dir build --output-on-failure --timeout 20
      # A test that aborts inside a system framework prints only the assertion; the stack is in the crash report, which the runner discards with the machine.
      - name: Upload crash reports
        if: ${{ failure() && needs.changes.outputs.build == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-reports-${{ matrix.architecture }}
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
          retention-days: 7
      # The build leaves the bundle as the linker signed it, which codesign rejects as a bundle; scripts/install.sh re-signs a staged copy before anything registers it. Do the same here with an ad-hoc identity, so what is checked is that the bundle can be sealed - a flattened framework or stray file breaks exactly that. The product is built for the runner's architecture only; nothing here produces a universal binary.
      - name: Verify input method bundle
        if: ${{ needs.changes.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/verify/水杉输入法.app"
          mkdir -p "$RUNNER_TEMP/verify"
          ditto build/水杉输入法.app "$staged"
          codesign --force --deep --options runtime --entitlements platforms/macos/resources/VoiceInput.entitlements --sign - "$staged"
          codesign --verify --deep --strict --verbose=2 "$staged"
          lipo "$staged/Contents/MacOS/水杉输入法" -verify_arch "$(uname -m)"
          # On-device voice models run in the bundled msime-voice-local helper, which loads the sherpa-onnx runtime from Contents/Frameworks. Both have to be sealed with the bundle and built for this architecture.
          lipo "$staged/Contents/MacOS/msime-voice-local" -verify_arch "$(uname -m)"
          lipo "$staged/Contents/Frameworks/libsherpa-onnx-c-api.dylib" -verify_arch "$(uname -m)"
          # The helper's first line says whether it found and loaded the runtime. Asked of the build tree, not the staged copy: under the hardened runtime an ad-hoc signature has no Team ID, so library validation refuses the runtime there, where a Developer ID signature on both passes it.
          hello=$(build/水杉输入法.app/Contents/MacOS/msime-voice-local < /dev/null | head -n 1)
          echo "$hello"
          python3 -c 'import json, sys; hello = json.loads(sys.argv[1]); sys.exit(0 if hello.get("type") == "hello" and hello.get("available") is True else 1)' "$hello"
          plist="$staged/Contents/Info.plist"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "app.msime.inputmethod.MetasequoiaIME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :InputMethodServerControllerClass' "$plist")" = "MSIMEInputController"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsInputModeListKey:app.msime.inputmethod.MetasequoiaIME.Hans:TISInputSourceID' "$plist")" = "app.msime.inputmethod.MetasequoiaIME.Hans"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ComponentInputModeDict:tsInputModeListKey:app.msime.inputmethod.MetasequoiaIME.Hans:tsInputModeScriptKey' "$plist")" = "smSimpChinese"

  # MSIME-Linux's ci.yml already reasons this out: "the frontend layer had none -- and that is the
  # layer that parses untrusted input", written after an audit of a sibling frontend turned up a
  # batch of races and null dereferences that no Debug build would have caught. Linux acted on it;
  # this repository had no sanitizer coverage at all, and it is the cheapest of the three to add
  # because clang is native here and there is no package manager tree to rebuild.
  #
  # arm64 only: this catches memory and undefined-behaviour bugs, which are not architecture
  # specific, and a second sanitized leg would double a 60-plus-minute job for very little.
  sanitizers:
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    name: Sanitizers
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runner 上下文在 job 级 env 里不可用,所以在这里写进 GITHUB_ENV,后面的步骤都能读到。
      - name: Point the Sparkle download at the cache
        run: echo "METASEQUOIA_SPARKLE_CACHE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Cache the pinned Sparkle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sparkle-archive
          # 版本和摘要写在 platforms/macos/CMakeLists.txt 里,键要指向那个文件。仓库根目录没有 CMakeLists.txt,而 hashFiles 对不存在的路径返回空串 —— 原来的键因此是常量 `sparkle-macOS-`,版本一动它也不动,恰好是这条注释说要避免的情况。
          key: sparkle-2.9.6-${{ runner.os }}-${{ hashFiles('platforms/macos/CMakeLists.txt') }}
      - name: Prepare pinned Sparkle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sparkle-archive"
          archive="$RUNNER_TEMP/sparkle-archive/Sparkle-2.9.6.tar.xz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 \
              https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz \
              --output "$archive"
          fi
          # 每次都校验,不只在下载之后:缓存条目是先前的运行写进去的,来源并不比一次下载更可信。
          printf '%s  %s\n' \
            '52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192' \
            "$archive" | shasum -a 256 --check
          rm -rf "$RUNNER_TEMP/sparkle"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"
          test -d "$RUNNER_TEMP/sparkle/Sparkle.framework"
          echo "MSIME_SPARKLE_ROOT=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - name: Remove unused runner taps
        run: if brew tap | grep -Fxq aws/tap; then brew untap aws/tap; fi
      - name: Install dependencies
        run: brew install nlohmann-json
      - name: Create test dictionary
        run: |
          mkdir -p "$RUNNER_TEMP/dictionary"
          if [[ -f platforms/macos/tests/create_fixture_dictionary.py ]]; then python3 platforms/macos/tests/create_fixture_dictionary.py "$RUNNER_TEMP/dictionary/msime.db"; else touch "$RUNNER_TEMP/dictionary/msime.db"; fi
      - name: Build the Rust host library
        run: cargo build --locked -p msime-host-api
      # OBJCXX is its own CMake language here, so CXX flags alone left every .mm unsanitized. Templates such as vector<uint8_t> are instantiated on both sides, and the linker keeping one copy from each can let instrumented code check container annotations the uninstrumented half never wrote - a container-overflow inside nlohmann's lexer.
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: >
          cmake -S platforms/macos -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DMSIME_SPARKLE_ROOT="$MSIME_SPARKLE_ROOT"
          -DMETASEQUOIA_IME_DICTIONARY="$RUNNER_TEMP/dictionary/msime.db"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_OBJCXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        # Explicit job count for the same reason as the Release leg: a bare `--parallel` is an unbounded `make -j`.
        run: cmake --build build-sanitizers --parallel "$(sysctl -n hw.logicalcpu)"
      # detect_leaks is off because Apple's runtime ships no LeakSanitizer.
      - name: Test memory safety and undefined behavior
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --no-tests=error --test-dir build-sanitizers --output-on-failure --timeout 300
