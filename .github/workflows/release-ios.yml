name: Release iOS
on:
  workflow_dispatch:
    inputs:
      version: {description: Semantic version (defaults to platforms/ios/version.txt), required: false, type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build as an ios-v release (otherwise it is only uploaded as a workflow artifact), required: false, default: true, type: boolean}
      testflight: {description: 签名归档并上传 App Store Connect（内部测试组自动拿到）, required: false, default: true, type: boolean}
      testflight_external: {description: 上传后加入外部测试组并提交 TestFlight 审核（不发布时，这个版本号已有 ios-v release 才送外部组）, required: false, default: true, type: boolean}
  workflow_call:
    inputs:
      version: {description: Semantic version, required: false, default: '', type: string}
      prerelease: {description: Mark as prerelease, required: false, default: false, type: boolean}
      publish: {description: Publish the build, required: false, default: false, type: boolean}
      testflight: {description: Upload to TestFlight, required: false, default: false, type: boolean}
      testflight_external: {description: Submit external TestFlight review, required: false, default: false, type: boolean}
    outputs:
      testflight_group: {description: The TestFlight group the build went to (external or internal; empty without an upload), value: "${{ jobs.release.outputs.testflight_group }}"}
permissions: {contents: write}
concurrency: {group: release-ios, cancel-in-progress: false}
jobs:
  release:
    # 留在 GitHub 托管的 runner 上，不要搬到 Depot：这个 job 用到签名证书和 App Store Connect 凭据这些长期凭据。只做构建、不碰长期凭据的 job 才放 Depot。
    runs-on: macos-15
    # 模拟器包之外还要再编一次真机版并上传 App Store Connect。
    timeout-minutes: 120
    outputs:
      testflight_group: ${{ steps.testers.outputs.group }}
    # The same Xcode ci-ios.yml builds and tests with; the image default is older and is not what the project is verified against.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      # The packages keep the plain X.Y.Z (Info.plist, versionName, Tauri, deb and rpm metadata take nothing else); the release tag and title carry the branch the run was dispatched from: none on main, -beta on develop, -alpha anywhere else. A suffixed release is always published as a prerelease, which the in-app update checks skip.
      - id: version
        name: Resolve independent iOS version
        env: {REQUESTED: "${{ inputs.version }}"}
        run: |
          version="${REQUESTED:-$(tr -d '[:space:]' < platforms/ios/version.txt)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF_NAME" in main) suffix= ;; develop) suffix=-beta ;; *) suffix=-alpha ;; esac; echo "release=${version}${suffix}" >> "$GITHUB_OUTPUT"
      # build-app.sh takes the directory install_resources verified and unpacked, not the repository's
      # resources/ directory -- that one holds the lock files install_resources reads. ci-ios.yml
      # resolves it the same way before every Xcode build.
      # stage-resources.sh stages target/offline-glosses when it is there.
      - name: Fetch the locked offline candidate glosses
        run: python3 scripts/fetch_offline_glosses.py
      # 背单词的内置词书：从锁定的 ECDICT 提交生成到 target/wordbooks，stage-resources.sh 放进键盘扩展、EngineResources 的同级；MSIME_REQUIRE_WORDBOOKS=1 让缺了它们的构建失败。
      - name: Build the bundled wordbooks
        run: python3 scripts/fetch_wordbooks.py
      # build-app.sh generates the Xcode project with xcodegen, and build-native.sh refuses to start without the simulator Rust target; rust-toolchain.toml installs neither, and the runner image has no xcodegen.
      - name: Install xcodegen and the simulator Rust target
        run: |
          set -euo pipefail
          brew install xcodegen
          bash scripts/rustup-install.sh aarch64-apple-ios-sim
      # 发布只带核心词库，日语及粤拼、注音、笔画由 App Group 资源包按需下载。
      - name: Build native iOS host
        env: {MSIME_IOS_OMIT_ON_DEMAND: "1", MSIME_REQUIRE_WORDBOOKS: "1"}
        run: |
          set -euo pipefail
          mkdir -p target/resources
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources -- target/resources)"
          bash platforms/ios/build-app.sh "$resource_dir" simulator
      # 这个归档是未签名的模拟器构建，用户装不了；名字里写明这一点，因为叫 msime-ios-<version> 的发布附件会被当成 iOS 的下载包（用户从 TestFlight / App Store 获取应用，安装大小以 App Store Connect 报告的为准）。
      - name: Package iOS release
        env: {VERSION: "${{ steps.version.outputs.value }}"}
        run: |
          mkdir -p dist
          ditto target/ios/derived-simulator/Build/Products/Release-iphonesimulator/MSIMEApp.app "dist/MSIMEApp-${VERSION}.app"
          tar -czf "dist/msime-ios-simulator-${VERSION}.tar.gz" -C dist "MSIMEApp-${VERSION}.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msime-ios-simulator-${{ steps.version.outputs.value }}
          path: dist/msime-ios-simulator-${{ steps.version.outputs.value }}.tar.gz
          if-no-files-found: error
      # 以下把同一份代码签名上传 TestFlight。流程取自 2026-09 的旧 release-ios.yml 与 #518 的修正：内部测试组自动拿到每个上传的构建，不能也不必再加；外部组要显式加入并提交审核；分发前要等 App Store Connect 处理完。
      - name: Prepare iOS signing and App Store Connect credentials
        if: ${{ inputs.testflight }}
        id: signing
        env:
          IOS_API_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYBOARD_PROFILE_BASE64: ${{ secrets.IOS_KEYBOARD_PROVISIONING_PROFILE_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGNING_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in IOS_API_KEY_BASE64 IOS_API_KEY_ID IOS_APP_PROFILE_BASE64 IOS_KEYBOARD_PROFILE_BASE64 IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_KEYCHAIN_PASSWORD IOS_TEAM_ID; do
            [[ -n "${!name:-}" ]] || { echo "Secret behind $name is not set" >&2; exit 1; }
          done
          dir="$RUNNER_TEMP/ios-signing"
          mkdir -p "$dir" && chmod 700 "$dir"
          printf '%s' "$IOS_API_KEY_BASE64" | base64 -D > "$dir/AuthKey_${IOS_API_KEY_ID}.p8"
          printf '%s' "$IOS_APP_PROFILE_BASE64" | base64 -D > "$dir/app.mobileprovision"
          printf '%s' "$IOS_KEYBOARD_PROFILE_BASE64" | base64 -D > "$dir/keyboard.mobileprovision"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$dir/distribution.p12"
          chmod 600 "$dir"/*
          keychain="$RUNNER_TEMP/msime-ios-signing.keychain-db"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$dir/distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain" | grep -Fq 'Apple Distribution:' \
            || { echo 'The certificate holds no Apple Distribution identity with its private key' >&2; exit 1; }
          # 描述文件必须对上 bundle id 与 App Group，否则要到归档末尾才失败。
          check_profile() {
            local profile=$1 bundle=$2
            security cms -D -i "$profile" | plutil -extract Entitlements.application-identifier raw -o - - | grep -Fxq "${IOS_TEAM_ID}.${bundle}" \
              || { echo "$profile is not for $bundle" >&2; exit 1; }
            security cms -D -i "$profile" | plutil -extract Entitlements xml1 -o - - | plutil -convert json -o - - \
              | jq -e '."com.apple.security.application-groups" | index("group.app.msime.ios")' >/dev/null \
              || { echo "$profile lacks group.app.msime.ios" >&2; exit 1; }
          }
          check_profile "$dir/app.mobileprovision" app.msime.ios
          check_profile "$dir/keyboard.mobileprovision" app.msime.ios.keyboard
          printf 'dir=%s\nkeychain=%s\n' "$dir" "$keychain" >> "$GITHUB_OUTPUT"
      # nightly 和手动发布各有自己的 run_number，不能用它生成共享的 TestFlight 构建号。以 2020 年起的秒数编号，两条入口共用 release-ios 并发组，重跑也取新编号。
      - name: Choose the build number
        id: build-number
        if: ${{ inputs.testflight }}
        run: echo "value=$(($(date -u +%s) - 1577836800))" >> "$GITHUB_OUTPUT"
      - name: Upload the signed build to App Store Connect
        if: ${{ inputs.testflight }}
        env:
          MSIME_IOS_OMIT_ON_DEMAND: "1"
          MSIME_IOS_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MSIME_IOS_AUTH_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
          MSIME_IOS_AUTH_KEY_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          SIGNING_DIR: ${{ steps.signing.outputs.dir }}
          MSIME_IOS_VERSION: ${{ steps.version.outputs.value }}
          # 每次上传的构建号必须比同一版本已上传的大，见上一步。
          MSIME_IOS_BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
        run: |
          set -euo pipefail
          bash scripts/rustup-install.sh aarch64-apple-ios
          command -v pod >/dev/null || brew install cocoapods
          export MSIME_IOS_AUTH_KEY_PATH="$SIGNING_DIR/AuthKey_${MSIME_IOS_AUTH_KEY_ID}.p8"
          export MSIME_IOS_APP_PROFILE_PATH="$SIGNING_DIR/app.mobileprovision"
          export MSIME_IOS_KEYBOARD_PROFILE_PATH="$SIGNING_DIR/keyboard.mobileprovision"
          resource_dir="$(cargo run --quiet -p msime-client-core --example install_resources -- target/resources)"
          bash platforms/ios/build-app.sh "$resource_dir" testflight
      # upload-testflight.sh 从归档里打出的 dSYM 留 90 天，用来符号化遥测崩溃里的「二进制 + 偏移」；App Store Connect 那边另有 uploadSymbols 传上去的一份，供 Xcode Organizer 用。不像 macos-symbols 那样放滚动 release：nightly 在版本号已发布后也送外部组，同一版本号每天都有新构建，release 的附件会无限增长，而排查用到的是最近几个月的构建。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.testflight }}
        with:
          name: msime-ios-${{ steps.version.outputs.value }}-${{ steps.build-number.outputs.value }}-dsym
          path: target/ios/testflight/msime-ios-*-dsym.zip
          if-no-files-found: warn
          retention-days: 90
      - name: Hand the build to its testers
        id: testers
        if: ${{ inputs.testflight }}
        env:
          BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
          IOS_API_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ID }}
          IOS_API_KEY_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          SIGNING_DIR: ${{ steps.signing.outputs.dir }}
          IOS_APP_ID: ${{ vars.IOS_APP_STORE_CONNECT_APP_ID }}
          IOS_INTERNAL_GROUP: ${{ vars.IOS_TESTFLIGHT_INTERNAL_GROUP }}
          IOS_EXTERNAL_GROUP: ${{ vars.IOS_TESTFLIGHT_EXTERNAL_GROUP }}
          EXTERNAL: ${{ inputs.testflight_external }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # 外部测试者在 TestFlight 里看到的版本号，必须是官网和发布页上已经有的版本号：官网读最新的 ios-v release。不发布的构建（nightly）只有在这个版本号已经发布过时才送外部组，否则只留在内部组，等正式发版。0.52.0 曾由 nightly 送外部组一周多而没有 ios-v0.52.0，官网一直显示 0.51.5。
          if [[ "$EXTERNAL" == true && "$PUBLISH" != true && -z "$(git tag --list "ios-v${VERSION}" "ios-v${VERSION}-*")" ]]; then
            echo "::warning::ios-v${VERSION} has not been released; this build goes to the internal TestFlight group only"
            EXTERNAL=false
          fi
          if [[ "$EXTERNAL" == true ]]; then echo group=external; else echo group=internal; fi >> "$GITHUB_OUTPUT"
          if [[ "$EXTERNAL" == true ]]; then group=$IOS_EXTERNAL_GROUP; review=--submit-review; else group=$IOS_INTERNAL_GROUP; review=; fi
          [[ -n "$IOS_APP_ID" && -n "$group" ]] || { echo 'IOS_APP_STORE_CONNECT_APP_ID and the TestFlight group variables must be set' >&2; exit 1; }
          # runner 的 Homebrew Python 是 externally-managed（PEP 668），不加 --break-system-packages 就拒绝安装。
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages 'pyjwt[crypto]==2.10.1'
          python3 platforms/ios/scripts/submit_testflight_review.py \
            --app "$IOS_APP_ID" --build-version "$BUILD_NUMBER" --group "$group" ${review:+$review} \
            --key-id "$IOS_API_KEY_ID" --issuer-id "$IOS_API_KEY_ISSUER_ID" --key-path "$SIGNING_DIR/AuthKey_${IOS_API_KEY_ID}.p8"
      - name: Remove the signing keychain and keys
        if: ${{ always() && steps.signing.outputs.keychain != '' }}
        env: {KEYCHAIN: "${{ steps.signing.outputs.keychain }}", SIGNING_DIR: "${{ steps.signing.outputs.dir }}"}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf -- "$SIGNING_DIR"
      # The build takes the dispatched commit, and the release is tagged at that checked-out commit (git rev-parse HEAD), so publishing has to be asked for rather than implied. Without the gate a build of a feature branch cuts a real public release.
      - name: Publish independent iOS release
        if: ${{ inputs.publish }}
        # RELEASE_PUBLISH_TOKEN (org secret, a fine-grained token with Contents and Workflows write) creates the tag: GitHub refuses GITHUB_TOKEN a new ref whose .github/workflows differs from the default branch, which is the case whenever develop takes a workflow change while the release builds (Release Linux run 37259338700, 403 Resource not accessible by integration). Without the secret, as on a fork, it falls back to GITHUB_TOKEN.
        env: {GH_TOKEN: "${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}", VERSION: "${{ steps.version.outputs.value }}", RELEASE: "${{ steps.version.outputs.release }}", PRERELEASE: "${{ inputs.prerelease }}", EVERYAPI_RELEASE_NOTES_TOKEN: "${{ secrets.EVERYAPI_RELEASE_NOTES_TOKEN }}", EVERYAPI_RELEASE_NOTES_MODEL: "${{ vars.EVERYAPI_RELEASE_NOTES_MODEL }}"}
        run: |
          tag="ios-v${RELEASE}"
          [[ "$RELEASE" == "$VERSION" ]] || export PRERELEASE=true
          # A re-run for the same version overwrites its release (scripts/publish-release.sh), so the notes start at the release before it rather than at its own tag. A final release starts at the previous final release, a -beta or -alpha one at the latest release of either kind.
          stable='^ios-v[0-9]+\.[0-9]+\.[0-9]+$'; [[ "$RELEASE" == "$VERSION" ]] || stable=.
          start=$(git tag --list 'ios-v*' --sort=-v:refname | grep -vxF "$tag" | grep -E "$stable" | head -1 || true)
          python3 scripts/generate-release-notes.py --platform ios --version "$RELEASE" --start-tag "$start" --end-ref "$(git rev-parse HEAD)" --output release-notes.md
          bash scripts/publish-release.sh "$tag" "$(git rev-parse HEAD)" "iOS ${RELEASE}" release-notes.md "dist/msime-ios-simulator-${VERSION}.tar.gz"
