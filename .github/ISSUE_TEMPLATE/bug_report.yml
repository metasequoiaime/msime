name: Bug 反馈
description: 遇到出错、打不出字或显示异常？
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        反馈会公开显示，请不要填写密码、账号、聊天内容等个人信息。如果发现的是安全漏洞，请不要在这里提交，改用私下报告。
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题
      placeholder: 例如：在备忘录里切换到水杉输入法后，候选字显示成方框，看不出是什么字。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 怎样操作会出现
      description: 按顺序写下你做了什么，方便我们重现这个问题。
      placeholder: |-
        1. 打开备忘录，切换到水杉输入法
        2. 输入拼音 nihao
        3. 候选字显示成方框
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
      placeholder: 例如：候选字应该正常显示为汉字。
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: 系统与输入法版本
      description: 输入法版本可以在输入法的设置或「关于」页面里找到。Android 版在「关于」或「帮助与反馈」里点「复制设备信息」，整段粘贴到这里即可。
      placeholder: 例如：macOS 15.3，水杉输入法 1.2.0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 其他信息（可选）
      description: 例如多久出现一次、是不是在所有软件里都会出现。
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿（可选）
      options:
        - label: 我愿意自己尝试修复或实现这个问题（这只是告诉维护者，不代表必须做）
          required: false
