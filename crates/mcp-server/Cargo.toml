[package]
name = "msime-mcp-server"
description = "Model Context Protocol server over stdio that lets a local agent read and, when allowed, manage the input method's quick phrases, preferences and typing statistics."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "msime-mcp"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[dependencies]
msime-client-core = { path = "../client-core" }
msime-client-services = { path = "../client-services" }
msime-host-api = { path = "../host-api" }
# 读代理给的本机文件时拒绝路径上的符号链接，规则与皮肤图片和插件导入相同。
msime-path-trust = { path = "../path-trust" }
# client: the command line calls the server in process, as an MCP client would.
rmcp = { version = "3.4.1", default-features = false, features = ["server", "client", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# The local time the diagnostic log's timestamps are in, so an agent can turn "a few minutes ago" into a time to read from.
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true, features = ["rt", "macros", "io-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
msime-host-macos = { path = "../host-macos" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Where the Windows Server keeps its runtime options.
[target.'cfg(windows)'.dependencies]
msime-host-windows = { path = "../host-windows" }

[dev-dependencies]
rmcp = { version = "3.4.1", default-features = false, features = ["client", "transport-io"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }
rusqlite.workspace = true

[lints]
workspace = true
