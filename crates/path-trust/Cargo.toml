[package]
name = "msime-path-trust"
description = "The one list of system symbolic links a storage path may pass through, and the walk that rejects every other link on the way to it."
version.workspace = true
edition.workspace = true
# 和 msime-engine 一样用 MPL-2.0（不附 Exhibit B），不随仓库其余部分的 GPL-3.0-only：引擎依赖它，可嵌入的引擎库要连它一起发布（README 的「许可证」一节）。字段不从工作区继承：工作区的 license 是 GPL。
license = "MPL-2.0"
repository.workspace = true
rust-version.workspace = true

[target.'cfg(unix)'.dependencies]
# geteuid 和 fstatat：判断多链接文件所在的目录是否只有 root 或当前用户能写（`multi_link_is_trusted`）。
libc.workspace = true

[features]
# 给检查本 crate 拒绝行为的其他 crate 的测试用，只在它们的 dev-dependencies 里打开。
test-support = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
