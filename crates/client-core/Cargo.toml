[package]
name = "msime-client-core"
description = "Host-agnostic client core: local preferences and generational installation of pinned resources."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tempfile.workspace = true
unicode-general-category.workspace = true
unicode-segmentation.workspace = true
sha2.workspace = true
hmac = "0.13"
hex = "0.4"
md-5 = "0.11"
base64 = "0.23"
flate2 = "1"
uuid = { workspace = true, features = ["serde", "v4"] }
# `formatting` for the strftime placeholders a command-table pack's templates are checked against, the same the Engine expands them with.
time = { workspace = true, features = ["formatting"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { workspace = true, features = ["rt", "net", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
# On-device speech models: the catalog archives are tar.bz2. bzip2 0.6 defaults to the pure-Rust libbz2-rs-sys backend, so no C toolchain is needed on any host.
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
# Toneless pinyin for hotword post-correction of recognizers without native hotword support.
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
# Plugin packs picked as a .zip archive. Only the flate2 deflate backend: stored and deflated members are what every archiver writes, and flate2 is already here.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
# Notice bodies are simple Markdown; HarmonyOS's RichText gets HTML rendered here (raw HTML escaped, unsafe links dropped). Only the HTML writer: the default `getopts` feature is for the crate's command-line binary.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# 候选窗口皮肤的图片在安装、发布和补预览图之前完整解码一遍，和服务端重新编码时一样；只看签名会放过截断的图。只开 PNG 和 JPEG 两种解码器，包里只允许这两种格式。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# `image` 固定用宽松模式解码 JPEG，截断的 JPEG 也能“解码成功”，所以 JPEG 直接用严格模式的 `zune-jpeg` 解码。版本和特性与 `image` 依赖的那份相同，不引入新的 crate。
zune-jpeg = "0.5.15"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
