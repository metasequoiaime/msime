[package]
name = "msime-pack-tool"
description = "msime-pack: checks extension packs (sound, music, command table, effect, script) by exactly the rules the input method imports them by, runs a desktop script plugin against a fixture of events, and scaffolds, builds and packs a script plugin crate, for pack authors and the community pack repository's CI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "msime-pack"
path = "src/main.rs"

[dependencies]
# Every rule lives in client-services' plugins module; this tool only reports what `plugins::validate` answers.
msime-client-services = { path = "../client-services" }
# `new` 按导入的同一条规则检查插件 id（`text::safe_id`）。
msime-client-base = { path = "../client-base" }
# `run` 读夹具、写一行一个事件的 JSON。两者都已是工作区依赖，不新增第三方 crate。
serde.workspace = true
serde_json.workspace = true
# `build` 从清单里读模块的文件名和 memory_pages。工作区依赖，client-services 读清单用的也是它。
toml.workspace = true
# `pack` 写确定的、不压缩的 zip。和 client-services 读写插件包用的是同一个 crate、同一个版本，不新增第三方 crate；只写 stored 条目，不要 deflate。
zip = { version = "9.0", default-features = false }

# `run` 用输入法进程里同一个沙箱运行时执行脚本插件。只在桌面编译，条件与 client-services、host-api 引用它的那段相同。
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
msime-script-runtime = { path = "../script-runtime" }

[dev-dependencies]
tempfile.workspace = true

# 测试用 WAT 写模块（`test-support` 导出 `compile_text`），和 host-api 的脚本插件测试一样；仓库不提交 `.wasm`。
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dev-dependencies]
msime-script-runtime = { path = "../script-runtime", features = ["test-support"] }

[lints]
workspace = true
