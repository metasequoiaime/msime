[package]
name = "msime-host-windows"
description = "Windows TSF/Server host support for the shared client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dev-dependencies]
msime-client-core = { path = "../client-core" }

# The desktop shell forbids unsafe code, so the few Win32 calls the shared
# panels need live here behind safe wrappers.
[target.'cfg(windows)'.dependencies]
msime-client-core = { path = "../client-core" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_Security",
] }
# Windows Ink handwriting recognition is WinRT, which windows-sys does not
# project; this is the same InkRecognizerContainer the reference panel uses.
windows = { version = "0.62", features = [
  "UI_Input_Inking",
  "Foundation",
  "Foundation_Collections",
] }
# The 0.62 projection takes these from their own crates, and they have to be the versions windows 0.62 itself uses: a Matrix3x2 or an IIterable from a different windows-numerics / windows-collections is a different type to the compiler, however identical it looks.
windows-numerics = "0.3"
windows-collections = "0.3"

[lints]
workspace = true
