[package]
name = "msime-host-api"
description = "Versioned C ABI for native input-method hosts: thread-bound session handles and explicit response release."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
msime-client-core = { path = "../client-core" }
msime-path-trust = { path = "../path-trust" }
msime-engine = { path = "../engine" }
msime-input-runtime = { path = "../input-runtime" }
hex = "0.4"
lru = "0.18"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
sha2.workspace = true
time.workspace = true

# Microphone capture for `voice_capture_pcm` and `voice_capture_devices`. The iOS keyboard records through AVAudioEngine and HarmonyOS through its own audio kit, so neither links a capture backend (OpenHarmony reports target_os = "linux" and has no ALSA to link).
[target.'cfg(not(any(target_os = "ios", target_env = "ohos")))'.dependencies]
cpal = "0.18"
rubato = "5"

# Key sounds, the typing melody, commit and achievement sounds and background music (`key_sound`), for the desktop hosts only. kira mixes, pitches and streams over the cpal above (the same 0.18, not a second copy); symphonia is the decoder kira already uses, named here so samples are decoded under the pack bounds rather than whole. Android and iOS keep their own key feedback, and HarmonyOS plays packs natively from the paths `msime_client_key_sound_pack` and `msime_client_music_pack` resolve.
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_env = "ohos")))'.dependencies]
kira = { version = "0.12.5", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis"] }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "ogg", "vorbis"] }

[dev-dependencies]
msime-path-trust = { path = "../path-trust", features = ["test-support"] }
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Graphics_Gdi", "Win32_Globalization"] }

# Only linux_catalog uses rustix, and that module excludes OpenHarmony, which reports target_os = "linux" as well.
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
