[package]
name = "msime-engine"
description = "Pure Rust input engine: composition state, schemes, dictionaries and learning. Replaces the C++ MSIME-Engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chinese-ime-lm = { git = "https://github.com/metasequoiaime/chinese-ime-lm", rev = "7e02487323ee5047a07a36b6e20d766d7c2f381d" }
chinese-number = { version = "0.8", default-features = false, features = ["std", "number-to-chinese"] }
exmex = "0.21"
hex = "0.4"
lru = "0.16"
lunar-lite = "1.3"
memmap2 = "0.9"
# V-mode unit conversion. MPL-2.0, used unmodified, so shipping the licence text (resources/licenses/MPL-2.0.txt) and naming the crate is all it asks. `bundle-files` embeds definitions.units; the live currency data, the one part that would need the network, is never loaded.
rink-core = { version = "0.9.0", default-features = false, features = ["bundle-files"] }
rusqlite = { workspace = true, features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "local-offset"] }
unicode-segmentation.workspace = true
# Vietnamese Telex and VNI transforms. MIT; pinned exactly because the uppercase workaround in vietnamese/scheme.rs is written against this version's output.
vi = "=0.8.0"
wana_kana = "5"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
