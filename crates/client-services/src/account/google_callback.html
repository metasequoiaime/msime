<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}} · 水杉输入法</title>
<style>
:root {
  --bg: #f4f5f2;
  --card: #ffffff;
  --text: #1d1d1f;
  --sub: #6b6f68;
  --hair: rgba(0, 0, 0, 0.08);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.06);
  --success: #3a8a2e;
  --neutral: #6b6f68;
  --warning: #c2570c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161716;
    --card: #222322;
    --text: #f2f3f0;
    --sub: #a3a79f;
    --hair: rgba(255, 255, 255, 0.08);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
    --success: #a8df8e;
    --neutral: #a3a79f;
    --warning: #f5a05f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%;
  max-width: 400px;
  padding: 40px 32px 28px;
  border: 1px solid var(--hair);
  border-radius: 20px;
  background: var(--card);
  box-shadow: var(--shadow);
  text-align: center;
  animation: rise 0.36s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.mark {
  position: relative;
  width: 64px;
  height: 64px;
  margin: 0 auto 24px;
}
.mark > svg { display: block; width: 64px; height: 64px; }
.status {
  position: absolute;
  right: -10px;
  bottom: -6px;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 3px solid var(--card);
  border-radius: 50%;
  background: var(--tone);
}
.status svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: var(--card);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.success { --tone: var(--success); }
.neutral { --tone: var(--neutral); }
.warning { --tone: var(--warning); }
h1 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.01em;
}
p { margin: 0; color: var(--sub); }
.return {
  display: block;
  margin-top: 24px;
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--tone);
  color: var(--card);
  font-weight: 600;
  text-decoration: none;
}
.return:active { opacity: 0.8; }
footer {
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1px solid var(--hair);
  color: var(--sub);
  font-size: 13px;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  main { animation: none; }
}
</style>
</head>
<body>
<main class="{{tone}}">
  <div class="mark">
    <svg viewBox="0 0 110 110" aria-hidden="true">
      <rect x="5" y="5" width="100" height="100" rx="22" fill="#252525" stroke="#A8DF8E" stroke-width="5"/>
      <path d="M70.7787 22.2L39.1201 34.3382L70.7787 43.4418L39.1201 58.6144C69.0496 63.672 97.1824 67.8192 37.4 87" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <span class="status" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="{{icon}}"/></svg></span>
  </div>
  <h1>{{title}}</h1>
  <p>{{message}}</p>
  {{return}}
  <footer>可以关闭此页面了</footer>
</main>
</body>
</html>
