# 验证皮肤「紫藤」：catalog 接受的每一个候选颜色键（含细分文字槽位、预编辑底色与分隔线、翻页分隔线、材质参数）、右键菜单 `[candidate.*.menu]` 和悬浮工具栏 `[toolbar.*]` 的每一个颜色键都写了，七种写法混用：`#RGB`、`#RGBA`、`#RRGGBB`、`#RRGGBBAA`（含小写）、`rgb()`、`rgba()` 和 `transparent`。
