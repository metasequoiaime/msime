# 验证皮肤「竹框」：`canvas` 全贴图基底的另一组写法，补 `verify-canvas` 没用到的键。面板只有一张图（深浅共用，没有 light_source），切片用 stretch_dip 盖过 slice_dip、两值简写，不写 width_dip（边宽取切片的数值当 DIP），fill = false 让中心留空；不写 content_insets_dip、outer_insets_dip 和 line_gap_dip，内容离面板外缘的距离是边宽加宿主自己的内边距，伸出面板的挂件由宿主自己留出窗口空白。
# 面板图中心涂成品红：fill = false 时它不该出现在任何截图里；按 slice_dip = 20 切的话四角会带出品红，所以截图里四角也不能有品红。
# 四个挂件：面板后居中的水印（z_index = 0，从空着的中心透出来）、左边探出去的星星（4 帧 GIF）、压在顶边上的缎带（z_index = 5）、右下角探出去的竹叶。
# 所有图片由同级目录的 generate.py 生成。

schema_version = 2
id = "verify-canvas-frame"
name = "竹框 · 画布"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "验证皮肤：中心留空的竹色九宫格框、面板后的水印、探出框外的 GIF 星星、顶边缎带和右下角竹叶。"
base = "canvas"
preview = "preview.png"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 200
item_corner_radius_dip = 4

# 48×40 的 1 倍图。slice_dip = 20 被 stretch_dip 盖过：上下切 10、左右切 14 像素，四边按同样的数值画成 DIP。
[candidate_window.border_image]
source = "assets/frame.png"
slice_dip = [20]
stretch_dip = [10, 14]
fill = false

# 水印：z_index = 0，画在面板之下，只从空着的中心透出来。
[[candidate_window.decorations]]
image = "assets/seal.png"
anchor = "center"
width_dip = 56
height_dip = 56
z_index = 0

# 星星：4 帧 GIF，左边探出面板 16 DIP。宿主不播 GIF 时只画第一帧。
[[candidate_window.decorations]]
image = "assets/stars.gif"
anchor = "left"
offset_x_dip = -16
width_dip = 24
height_dip = 24

# 缎带：贴着顶边居中，往上探出 10 DIP，压在面板之上。
[[candidate_window.decorations]]
image = "assets/ribbon.png"
anchor = "top"
offset_y_dip = -10
width_dip = 60
height_dip = 16
z_index = 5

# 竹叶：右下角往右、往下各探出 12 DIP。
[[candidate_window.decorations]]
image = "assets/leaf.png"
anchor = "bottom-right"
offset_x_dip = 12
offset_y_dip = 12
width_dip = 28
height_dip = 28
z_index = 1

[candidate.dark]
accent = "#86EFAC"
selected = "rgba(134, 239, 172, 0.22)"
hover = "rgba(134, 239, 172, 0.12)"
