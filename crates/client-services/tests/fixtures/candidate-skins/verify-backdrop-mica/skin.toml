# 验证皮肤「青瓷」：`backdrop = "mica"`，卡片背后是系统云母（取样桌面壁纸；Windows 11 之前按亚克力画），深浅两套材质参数都写出：`backdrop_opacity` 是 `surface` 色调盖在材质上的不透明度，`backdrop_luminosity` 是亮度层的不透明度。画不出系统材质的宿主（或系统关闭透明效果时）按 msime-windows 的回退把半透明的 `surface` 补成不透明。
