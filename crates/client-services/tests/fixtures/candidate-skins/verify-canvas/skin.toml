# 验证皮肤「星河」：`canvas` 全贴图基底（只能配 schema_version = 2）。卡片外观来自九宫格面板图，深浅两套各一张；内容内边距、挂件外留白、预编辑行与候选的行距，加上三个自由挂件：面板后的月亮、面板上闪烁的星光（6 帧 APNG）、面板下缘的云。
# 没有贴图绘制能力的宿主画 `canvas` 外观的不透明底色，候选颜色换成那套外观的可读配色（只保留强调色和右键菜单），能画贴图的宿主从 `panelCandidate` 取下面写的原配色。
# 所有图片都是 2 倍图，由同级目录的 generate.py 生成。

schema_version = 2
id = "verify-canvas"
name = "星河 · 画布"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "验证皮肤：深靛 / 浅藕荷九宫格面板，面板后探出的月亮、闪烁的星光（APNG）和面板下缘的云。"
base = "canvas"
preview = "preview.png"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 180
item_corner_radius_dip = 6
# 预编辑行与候选之间的距离，0–100 DIP。
line_gap_dip = 5

# 两张面板都是 64×64：切片按源图像素写 16，边框按屏幕 DIP 画 8 宽。四角的小星点落在切片之内，面板怎么拉伸都不变形。
[candidate_window.border_image]
source = "assets/panel-dark.png"
light_source = "assets/panel-light.png"
slice_dip = [16]
width_dip = [8]
fill = true

[candidate_window.content_insets_dip]
top = 10
right = 14
bottom = 10
left = 14

# 挂件伸出卡片的部分需要的透明留白。
[candidate_window.outer_insets_dip]
top = 18
right = 18
bottom = 12
left = 10

# 月亮：z_index < 1，画在面板之后，只露出右上角伸出去的那一截。
[[candidate_window.decorations]]
image = "assets/moon.png"
anchor = "top-right"
offset_x_dip = 18
offset_y_dip = -18
width_dip = 40
height_dip = 40
z_index = -1

# 星光：6 帧、每帧 120 ms、无限循环的 APNG，画在面板与文字之上；系统关闭动画效果时只显示第一帧。
[[candidate_window.decorations]]
image = "assets/twinkle.png"
anchor = "top-left"
offset_x_dip = -10
offset_y_dip = -12
width_dip = 24
height_dip = 24
z_index = 3

# 云：贴着面板下缘居中，稍微探出去一点。
[[candidate_window.decorations]]
image = "assets/cloud.png"
anchor = "bottom"
offset_x_dip = 40
offset_y_dip = 10
width_dip = 48
height_dip = 20
z_index = 1

[candidate.dark]
accent = "#A78BFA"
selected = "rgba(167, 139, 250, 0.22)"
hover = "rgba(167, 139, 250, 0.12)"
text = "#EDE9FE"
number = "rgba(237, 233, 254, 0.6)"
translation = "#C4B5FD"
preedit_text = "#DDD6FE"
selected_text = "#FFFFFF"
selected_bar = "#FDE68A"

[candidate.light]
accent = "#7C3AED"
selected = "rgba(124, 58, 237, 0.14)"
hover = "rgba(124, 58, 237, 0.07)"
text = "#2E1065"
number = "rgba(46, 16, 101, 0.55)"
translation = "#6D5BA8"
preedit_text = "#5B21B6"
selected_text = "#4C1D95"
selected_bar = "#F59E0B"

[candidate.dark.menu]
background = "#1E1B4B"
border = "rgba(167, 139, 250, 0.35)"
text = "#EDE9FE"
hover = "rgba(167, 139, 250, 0.16)"

[candidate.light.menu]
background = "#FBFAFF"
border = "rgba(124, 58, 237, 0.3)"
text = "#2E1065"
hover = "rgba(124, 58, 237, 0.1)"

[toolbar]
corner_radius_dip = 10

[toolbar.dark]
background = "#1E1B4B"
border = "rgba(167, 139, 250, 0.35)"
handle = "#A78BFA"
divider = "rgba(167, 139, 250, 0.22)"
icon = "#EDE9FE"
hover = "rgba(167, 139, 250, 0.16)"

[toolbar.light]
background = "#FBFAFF"
border = "rgba(124, 58, 237, 0.3)"
handle = "#7C3AED"
divider = "rgba(124, 58, 237, 0.2)"
icon = "#2E1065"
hover = "rgba(124, 58, 237, 0.1)"

# 显隐与选择的动效预设；canvas 基底上同样生效。
[animation]
enter = "fade_scale"
exit = "fade"
selection = "glow"
duration_ms = 220
stagger_ms = 18

