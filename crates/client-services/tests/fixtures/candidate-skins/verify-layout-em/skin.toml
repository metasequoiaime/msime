# 验证皮肤「竹影」：候选窗版式用 em 长度书写（`"0.5em"` 即候选字号的一半，宿主乘候选字号后取整），横排、竖排两张表各自盖过共享表里的几项，竖排表里的数字是固定 DIP。
# 图片由同级目录的 generate.py 生成。

schema_version = 1
id = "verify-layout-em"
name = "竹影 · em 版式"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "验证皮肤：竹青配色，内边距、行距、序号位置、选中竖条都按候选字号的 em 书写，横排与竖排分别覆盖。"
base = "system"
preview = "preview.png"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 200
corner_radius_dip = 10
item_corner_radius_dip = 6
# 共享表：两种排列都用这些值，除非下面的横排、竖排表另写。
padding = "0.5em"
item_gap = "0.6em"
item_extra_height = "0.25em"
number_inset = "0.3em"
number_gap = "0.2em"
number_scale = 0.8
item_padding_right = "0.4em"
item_min_width = "2.5em"
selected_bar_width = "0.2em"
selected_bar_height_em = 0.9
selected_bar_inside = true
item_corners_follow_card = true
trim_hidden_preedit_gap = true
# 上、右、下、左四个值。
preedit_margin_dip = [2, 4, 6, 8]

# 横排：列间距改成固定 10 DIP，序号再小一点，并把一行多出来的宽度均分给各列。
[candidate_window.horizontal]
item_gap = 10
number_scale = 0.75
justify_rows = true
# 两个值：上下、左右。
preedit_margin_dip = [4, 6]

# 竖排：内边距放大到 0.75em，行高多加 6 DIP，选中竖条改成 3 DIP 宽并画在高亮左缘之外。
[candidate_window.vertical]
padding = "0.75em"
item_extra_height = 6
selected_bar_width = 3
selected_bar_inside = false
# 一个值：四边相同。
preedit_margin_dip = [6]

[candidate.light]
surface = "#F4F8F1"
border = "#CFE0C6"
text = "#23361F"
number = "#6B8A5E"
accent = "#3E8E41"
selected = "#DCEFD5"
hover = "#EAF4E5"
translation = "#7A8F70"
preedit_text = "#4E6B46"
selected_text = "#1F5E22"
selected_bar = "#3E8E41"
show_selected_bar = true

[candidate.dark]
surface = "#18221A"
border = "#2C3D2E"
text = "#DDEBD8"
number = "#8FB386"
accent = "#7CC47F"
selected = "#26402A"
hover = "#1F3022"
translation = "#93A88B"
preedit_text = "#A9C7A2"
selected_text = "#B8F0BA"
selected_bar = "#9BD99E"
show_selected_bar = true

