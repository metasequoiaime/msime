# 验证皮肤「雾凇」：schema_version = 2 配 `base = "system"`，却写了五个只属于 `canvas` 的键（九宫格、内容内边距、行距、外留白、自由挂件）。它们在非 canvas 基底上不校验、不生效，包照常加载，只多一条提示，`[animation]` 照常生效。
# 下面引用的 assets/panel.png 和 assets/widget.png 故意不放进这个目录：这些键要是被校验了，包就会因为找不到图片被拒绝。
# 预览图由同级目录的 generate.py 生成。

schema_version = 2
id = "verify-canvas-keys-ignored"
name = "雾凇 · 画布键忽略"
version = "1.0.0"
author = "Metasequoia IME contributors"
description = "验证皮肤：雾凇冷灰蓝配色；写在 system 基底上的 canvas 专属键被忽略并给出提示，动效照常。"
base = "system"
preview = "preview.png"

[supports]
layouts = ["horizontal", "vertical"]
themes = ["dark", "light"]

[candidate_window]
min_width_dip = 200
corner_radius_dip = 8
item_corner_radius_dip = 5
line_gap_dip = 6

[candidate_window.border_image]
source = "assets/panel.png"
slice_dip = [16]
width_dip = [8]

[candidate_window.content_insets_dip]
top = 10
right = 12
bottom = 10
left = 12

[candidate_window.outer_insets_dip]
top = 12
right = 12
bottom = 12
left = 12

[[candidate_window.decorations]]
image = "assets/widget.png"
anchor = "top-right"
width_dip = 24
height_dip = 24

[candidate.light]
surface = "#F7FAFC"
border = "#C9D6E2"
text = "#1E2A36"
number = "#6A7F93"
accent = "#2F7FBF"
selected = "#DDEBF7"
hover = "#ECF3FA"
translation = "#71849A"
selected_text = "#1B5E94"
selected_bar = "#2F7FBF"
show_selected_bar = true

[candidate.dark]
surface = "#151B22"
border = "#2C3846"
text = "#DCE6F0"
number = "#8296AA"
accent = "#6CB4F0"
selected = "#22344A"
hover = "#1B2632"
translation = "#8A9CB0"
selected_text = "#A9D5FA"
selected_bar = "#6CB4F0"
