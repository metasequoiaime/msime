[package]
name = "msime-clipboard-relay"
description = "Reference self-hosted relay for the end-to-end encrypted cloud clipboard: stores ciphertext only, one space per static token (docs/cloud-clipboard-relay.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "msime-clipboard-relay"
path = "src/main.rs"

[dependencies]
# 请求的解析和不依赖状态的校验与客户端的 WebDAV 后端共用 `cloud::clipboard_log` 那一份。
msime-client-core = { path = "../client-core" }
# 只用来当 HTTP 服务器：路由和接口逻辑都在不碰网络的 `store` 里，这里只要 tokio 上的 HTTP/1。维护者在 #6787 同意为参考中继引入它。
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
# 一个文件存放全部空间、设备、封装和条目；bundled 让二进制不依赖系统的 SQLite。
rusqlite = { workspace = true, features = ["bundled"] }
serde_json.workspace = true
sha2.workspace = true
hex = "0.4"
base64 = "0.23"
getrandom = "0.4"
time = { workspace = true, features = ["formatting"] }

[dev-dependencies]
# 端到端测试用真正的客户端驱动连这个中继。
msime-client-services = { path = "../client-services" }
tempfile.workspace = true
# `tests/webdav_flow.rs` 让客户端的 WebDAV 后端对着一个真实的 WebDAV 服务端跑完整流程；只用内存文件系统。维护者同意作为测试依赖引入。放在这里而不是客户端的 crate，是因为这里已经有 axum 和 tokio 能把它跑起来。
dav-server = { version = "0.11", default-features = false, features = ["memfs"] }
# 让 `dav-server` 一次只处理一个请求（它的 MOVE 是先查后改）。
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
