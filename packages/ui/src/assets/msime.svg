<!-- 单独显示的水杉标志：一块深色圆角正方形，5 宽的绿边就是它的边，上面一笔白色折线。折线取自母版 apps/desktop/app-icon.svg，以外框中心为原点缩到 80%、线宽不变，四周留出边距；圆角半径是边长的 22%。各平台单独显示标志的位图（Windows 的 msime.ico、macOS 输入法和设置 App 的 icns、Linux 的 hicolor 图标、鸿蒙的 app_icon.png、Tauri 图标、iOS 启动屏）都从这张渲染。 -->
