<!doctype html>
<!--
候选栏和 attachInput 的浏览器自动检查页，由 test/candidates.browser.mjs 在无头 Chrome 里打开，不需要引擎：attachInput 接的是一个按脚本回帧的假引擎。检查全部在页面里跑，跑完把 document.body 的 data-result 设成 ok，失败时设成 fail，并把每条失败写进 #log。也可以手动打开（以 packages/web-engine 为根的静态服务器，先跑一次 `node packages/web-engine/tools/theme-catalog.mjs`），在页面上看结果。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'none'; img-src 'self' data: http://localhost:*" />
    <title>@msime/web-engine 候选栏检查</title>
  </head>
  <body>
    <pre id="log"></pre>
    <textarea id="field"></textarea>
    <dialog id="modal"><textarea id="inside"></textarea></dialog>
    <script type="module">
      import { CANDIDATE_BAR_TAG, createCandidateBar } from "../src/candidates.js";
      import { attachInput } from "../src/input.js";
      import { KeyKind, packKey } from "../src/keys.js";
      import { resolveSkin } from "../src/skin.js";
      import { factoryLayouts } from "../src/theme-catalog.js";

      const log = document.getElementById("log");
      const failures = [];
      let current = "";
      const check = (ok, message) => {
        if (!ok) failures.push(`${current}: ${message}`);
      };
      const equal = (actual, expected, message) => check(Object.is(actual, expected), `${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      const tick = () => new Promise((resolve) => setTimeout(resolve, 0));

      const frame = (fields) => ({ out: [], composing: false, preedit: "", caret: 0, page: [], pageIndex: 0, hasPrev: false, hasNext: false, highlight: 0, emptyCode: false, english: false, modelOn: false, rerankMs: 0, ...fields });
      const composingFrame = (preedit, words, highlight = 0) => frame({ composing: true, preedit, caret: preedit.length, page: words.map((text) => ({ text, code: "" })), highlight, hasNext: true });
      const commitFrame = (text) => frame({ out: [{ t: "commit", text }] });

      // 候选栏的内部结构：宿主元素、Shadow DOM 里的根元素和候选。
      const parts = (host) => {
        const root = host.shadowRoot.querySelector(".candidate");
        return { root, cands: [...root.querySelectorAll("[data-index]")], first: root.querySelector(".first") };
      };
      const visible = (host) => host.isConnected && !parts(host).root.hidden && getComputedStyle(parts(host).root).display !== "none";
      const rgb = (hex) => `rgb(${[1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(", ")})`;

      // 按脚本回帧的假引擎：keys 收到的键依次记下，回 replies 里排着的下一帧；replies 里放的是函数时由它决定回什么（可以返回一个手动 resolve 的 Promise）。
      function fakeEngine() {
        const engine = {
          sent: [],
          picks: [],
          resets: 0,
          replies: [],
          keys(key) {
            engine.sent.push(key);
            const next = engine.replies.shift() ?? frame({});
            return typeof next === "function" ? next() : Promise.resolve(next);
          },
          pick(slot) {
            engine.picks.push(slot);
            const next = engine.replies.shift() ?? frame({});
            return Promise.resolve(next);
          },
          reset() {
            engine.resets += 1;
            return Promise.resolve();
          },
        };
        return engine;
      }
      const press = (el, key, code) => el.dispatchEvent(new KeyboardEvent("keydown", { key, code, bubbles: true, cancelable: true }));
      const barHost = () => document.querySelector(CANDIDATE_BAR_TAG) ?? document.getElementById("modal").querySelector(CANDIDATE_BAR_TAG);

      async function candidateBar() {
        current = "createCandidateBar";
        const picks = [];
        const bar = createCandidateBar({ skin: "wechat", dark: false, onPick: (i) => picks.push(i) });
        const host = bar.element;
        equal(host.parentNode, document.body, "mounted in body");
        check(!visible(host), "hidden before the first frame");
        bar.render(composingFrame("ni", ["你", "呢", "尼", "妮", "泥", "逆"], 2), { left: 20, top: 20, bottom: 40 });
        check(visible(host), "visible while composing");
        const { cands, first } = parts(host);
        equal(cands.length, 6, "candidate count");
        equal(first?.dataset.index, "2", "highlighted candidate");
        check(first?.getAttribute("part")?.split(" ").includes("highlight"), "highlight part");
        // wechat 的高亮候选是绿底白字（Windows 版样式表），皮肤的取值确实写进了样式。
        equal(getComputedStyle(first).backgroundColor, rgb("#07C160"), "wechat selected fill");
        equal(getComputedStyle(first.querySelector(".cand-content")).color, rgb("#FFFFFF"), "wechat selected text");
        equal(getComputedStyle(cands[0].querySelector(".cand-content")).color, rgb("#333333"), "wechat plain text");

        // 按下鼠标被拦住（不让文本框失焦），点击把下标交给 onPick。
        const down = new MouseEvent("mousedown", { bubbles: true, cancelable: true, composed: true });
        equal(cands[4].dispatchEvent(down), false, "mousedown is prevented");
        cands[4].querySelector(".cand-content").dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
        equal(picks.join(), "4", "click picks the candidate");

        bar.render(frame({}), null);
        check(!visible(host), "a non-composing frame hides the bar");
        bar.render(composingFrame("ni", ["你", "呢"]), { left: 20, top: 20, bottom: 40 });
        bar.hide();
        check(!visible(host), "hide() hides the bar");

        // 换皮肤、排布和明暗：graphite 深色竖排，选中只靠字色。
        bar.setSkin("graphite");
        bar.setLayout("vertical");
        bar.setDark(true);
        bar.render(composingFrame("ni", ["你", "呢"]), { left: 20, top: 20, bottom: 40 });
        const after = parts(host);
        check(after.root.classList.contains("wnd-v"), "vertical layout class");
        equal(after.root.dataset.theme, "dark", "dark theme");
        equal(after.root.style.getPropertyValue("--cand-bg"), resolveSkin("graphite", { dark: true }).palette.surface, "graphite surface");
        equal(getComputedStyle(after.first.querySelector(".cand-content")).color, rgb("#F1F3F5"), "graphite selected text");
        let threw = null;
        try {
          bar.setSkin("nope");
        } catch (error) {
          threw = error;
        }
        check(threw instanceof TypeError, "unknown skin throws TypeError");
        equal(after.root.style.getPropertyValue("--cand-bg"), resolveSkin("graphite", { dark: true }).palette.surface, "a failed setSkin keeps the skin");

        // system 画平台默认配色：浅色的选中底是灰色，字是普通文字色。
        bar.setSkin("system");
        bar.setDark(false);
        bar.render(composingFrame("ni", ["你", "呢"]), { left: 20, top: 20, bottom: 40 });
        equal(getComputedStyle(parts(host).first).backgroundColor, rgb("#E8E8E8"), "system selected fill");
        equal(getComputedStyle(parts(host).first.querySelector(".cand-content")).color, rgb("#1A1A1A"), "system selected text");

        // 辅助码提示：帧里有 hint 就显示它（自带括号）；helpcode 选项只管没有提示的行要不要显示编码。
        const hinted = frame({ composing: true, preedit: "ni", caret: 2, page: [{ text: "你", code: "ni", hint: "(AA)" }, { text: "呢", code: "ne", hint: "" }] });
        const notes = (target) => parts(target).cands.map((cand) => cand.querySelector(".cand-helpcode")?.textContent ?? "").join("|");
        bar.render(hinted, { left: 20, top: 20, bottom: 40 });
        equal(notes(host), "(AA)|", "hints show without the helpcode option");
        const coded = createCandidateBar({ helpcode: true });
        coded.render(hinted, { left: 20, top: 20, bottom: 40 });
        equal(notes(coded.element), "(AA)|(ne)", "the helpcode option fills rows without a hint with their code");
        coded.destroy();

        bar.destroy();
        check(!host.isConnected, "destroy() removes the host");
        bar.render(composingFrame("ni", ["你"]), null);
        check(!host.isConnected, "render after destroy does nothing");
      }

      async function attached() {
        current = "attachInput";
        const field = document.getElementById("field");
        const engine = fakeEngine();
        const frames = [];
        const detach = attachInput(field, engine, { skin: "light", onFrame: (f) => frames.push(f) });
        field.focus();

        engine.replies.push(composingFrame("n", ["你", "呢", "尼"]));
        press(field, "n", "KeyN");
        await tick();
        equal(engine.sent[0], packKey(KeyKind.Letter, "n".charCodeAt(0)), "the key reaches the engine");
        const host = barHost();
        check(host && visible(host), "the bar shows while composing");
        equal(frames.length, 1, "onFrame sees the frame");

        // 点第二个候选：交给 engine.pick，上屏后候选栏隐藏，文本框不失焦。
        engine.replies.push(commitFrame("呢"));
        const target = parts(host).cands[1];
        equal(target.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, composed: true })), false, "mousedown on a candidate is prevented");
        target.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
        await tick();
        equal(engine.picks.join(), "1", "a click picks through the engine");
        equal(field.value, "呢", "the pick is committed");
        check(!visible(host), "the bar hides after the commit");
        equal(document.activeElement, field, "the text box keeps focus");

        // 失焦放弃组字：候选栏隐藏，引擎被重置。
        engine.replies.push(composingFrame("n", ["你"]));
        press(field, "n", "KeyN");
        await tick();
        check(visible(host), "composing again shows the bar");
        field.dispatchEvent(new FocusEvent("blur"));
        check(!visible(host), "blur hides the bar");
        equal(engine.resets, 1, "blur resets the engine");

        // 解除绑定时还在路上的帧被丢弃：不写进文本框，不调 onFrame。
        let release;
        engine.replies.push(() => new Promise((resolve) => (release = resolve)));
        press(field, " ", "Space");
        const before = frames.length;
        detach();
        check(!host.isConnected, "detach removes the bar");
        equal(engine.resets, 2, "detach with a key in flight resets the engine");
        release(commitFrame("你好"));
        await tick();
        equal(field.value, "呢", "a late frame is not written after detach");
        equal(frames.length, before, "a late frame does not reach onFrame after detach");
      }

      async function insideModal() {
        current = "attachInput in a modal dialog";
        const dialog = document.getElementById("modal");
        const inside = document.getElementById("inside");
        // 绑定在打开对话框之前：显示时才按当时的状态选挂载点。
        const engine = fakeEngine();
        const detach = attachInput(inside, engine, { skin: "light" });
        dialog.showModal();
        inside.focus();
        engine.replies.push(composingFrame("n", ["你", "呢"]));
        press(inside, "n", "KeyN");
        await tick();
        const host = dialog.querySelector(CANDIDATE_BAR_TAG);
        check(host !== null, "the bar is mounted inside the modal dialog");
        if (host) {
          check(visible(host), "the bar is visible");
          const box = parts(host).cands[0].getBoundingClientRect();
          // 顶层元素之外的东西点不到；挂进对话框后，候选位置上命中的是候选栏本身。
          equal(document.elementFromPoint(box.left + box.width / 2, box.top + box.height / 2), host, "the candidate is hit-testable above the modal");
        }
        detach();
        dialog.close();

        current = "attachInput with options.container";
        const holder = document.createElement("div");
        document.body.append(holder);
        const field = document.getElementById("field");
        const other = fakeEngine();
        const undo = attachInput(field, other, { container: holder });
        equal(holder.querySelector(CANDIDATE_BAR_TAG)?.localName, CANDIDATE_BAR_TAG, "the bar goes into options.container");
        other.replies.push(composingFrame("n", ["你"]));
        press(field, "n", "KeyN");
        await tick();
        check(holder.querySelector(CANDIDATE_BAR_TAG) !== null, "an explicit container is kept while composing");
        undo();
        holder.remove();
      }

      // 即使旧皮肤显式声明动效，候选显隐和高亮也立即呈现。
      async function motionReplay() {
        current = "schema v2 motion";
        const bar = createCandidateBar({ skin: { schemaVersion: 2, base: "system", animation: { enter: "fade_scale", exit: "fade", selection: "spring", durationMs: 600, staggerMs: 80 } }, dark: false });
        const host = bar.element;
        const anchor = { left: 20, top: 20, bottom: 40 };
        const selecting = () => parts(host).cands.filter((cand) => cand.dataset.selecting !== undefined).map((cand) => cand.dataset.index).join();
        bar.render(composingFrame("n", ["你", "呢", "尼"]), anchor);
        check(parts(host).root.getAnimations({ subtree: true }).length === 0, "首次显示不播放进场或逐行浮现");
        equal(selecting(), "", "showing the bar is not a selection change");
        bar.render(composingFrame("ni", ["你", "呢", "尼"]), anchor);
        check(parts(host).root.dataset.entering === undefined, "typing does not replay the row reveal");
        equal(selecting(), "", "typing under the same highlight does not replay the selection preset");
        bar.render(composingFrame("ni", ["你", "呢", "尼"], 1), anchor);
        equal(selecting(), "", "高亮移动不挂载选中动画");
        equal(parts(host).root.getAnimations({ subtree: true }).length, 0, "显式选中预设也不播放动画");
        bar.render(composingFrame("nin", ["您", "宁", "拧"], 1), anchor);
        equal(selecting(), "", "the moved highlight does not animate again on the next keystroke");
        bar.hide();
        bar.render(composingFrame("n", ["你", "呢"], 1), anchor);
        equal(parts(host).root.getAnimations({ subtree: true }).length, 0, "再次显示不播放进场");
        equal(selecting(), "", "新组字不播放选中动画");
        bar.render({ composing: false }, anchor);
        check(parts(host).root.hidden, "组字结束立即隐藏，显式退场预设不保留旧候选");
        bar.destroy();
      }

      // 从 DevTools 取得真实合成结果后在页面里读像素，验证九块实际画到了正确的位置。
      async function screenshotPixels(points) {
        await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
        return await new Promise((done) => {
          window.finishPixelCheck = async (data) => {
            const image = new Image(); image.src = `data:image/png;base64,${data}`;
            await image.decode();
            const canvas = document.createElement("canvas");
            canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
            const ctx = canvas.getContext("2d"); ctx.drawImage(image, 0, 0);
            const pixels = [];
            for (const point of points) {
              const pixel = [...ctx.getImageData(Math.round(point.x), Math.round(point.y), 1, 1).data].slice(0, 3);
              pixels.push(pixel);
              if (point.rgb) equal(pixel.join(), point.rgb.join(), point.name);
            }
            delete document.body.dataset.pixelRequest;
            delete window.finishPixelCheck;
            done(pixels);
          };
          document.body.dataset.pixelRequest = "true";
        });
      }

      async function setReduced(value) {
        await new Promise((done) => {
          window.finishMotionCheck = () => { delete document.body.dataset.motionRequest; delete window.finishMotionCheck; done(); };
          document.body.dataset.motionRequest = value ? "reduce" : "no-preference";
        });
        await new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(done)));
      }

      async function canvasSkin() {
        current = "canvas rendering";
        const waitFor = async (predicate, message) => {
          const deadline = performance.now() + 3000;
          while (!predicate() && performance.now() < deadline) await new Promise((done) => setTimeout(done, 10));
          check(predicate(), message);
        };
        const png = (paint, width = 6, height = 6) => {
          const canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height;
          paint(canvas.getContext("2d")); return canvas.toDataURL();
        };
        const colours = ["#ff0000", "#00ff00", "#0000ff", "#ffff00", "#ff00ff", "#00ffff", "#880000", "#008800", "#000088"];
        const panelUrl = png((ctx) => colours.forEach((color, i) => { ctx.fillStyle = color; ctx.fillRect((i % 3) * 2, Math.floor(i / 3) * 2, 2, 2); }));
        const green = png((ctx) => { ctx.fillStyle = "#119922"; ctx.fillRect(0, 0, 6, 6); });
        const cyan = png((ctx) => { ctx.fillStyle = "#11aacc"; ctx.fillRect(0, 0, 6, 6); });
        const skin = { schemaVersion: 2, base: "canvas", animation: { enter: "none", exit: "none", selection: "none" }, minWidthDip: 220,
          borderImage: { source: panelUrl, sliceDip: [2], widthDip: [8], fill: true },
          contentInsetsDip: { top: 20, right: 20, bottom: 20, left: 20 }, outerInsetsDip: { top: 16, right: 16, bottom: 16, left: 16 }, lineGapDip: 6,
          candidate: { light: { text: "#f5ecff", preedit_text: "#ffc4dc", selected_text: "#fff", selected_bar: "#ffd27a" } },
          decorations: [{ image: green, anchor: "top-left", offsetXDip: -30, offsetYDip: -10, widthDip: 50, heightDip: 30, zIndex: 0 },
            { image: cyan, anchor: "top-right", offsetXDip: 10, offsetYDip: -10, widthDip: 30, heightDip: 30, zIndex: 1 }] };
        skin.background = { image: cyan, fit: "stretch" };
        const picks = [];
        const bar = createCandidateBar({ skin, dark: false, onPick: (i) => picks.push(i) });
        bar.render(composingFrame("ni", ["示例甲", "示例乙"]), { left: 40, top: 180, bottom: 200 });
        const root = parts(bar.element).root;
        const card = root.querySelector(".container");
        const panel = root.querySelector(".skin-panel");
        equal(getComputedStyle(parts(bar.element).first.querySelector(".cand-content")).color, rgb("#1A1A1A"), "the loading fallback is readable");
        await waitFor(() => card.dataset.panel !== undefined && panel.style.borderImageSource !== "" && [...root.querySelectorAll(".skin-picture > img")].every((img) => img.complete), "the panel and widgets load");
        equal(getComputedStyle(parts(bar.element).first.querySelector(".cand-content")).color, rgb("#FFFFFF"), "loaded panel uses its selected text colour");
        equal(getComputedStyle(root.querySelector(".pinyin .text")).color, rgb("#FFC4DC"), "preedit colour slot");
        equal(card.dataset.background, undefined, "panel takes priority over the legacy background image");
        equal(getComputedStyle(card).paddingLeft, "20px", "content insets from the panel edge");
        check(Math.abs(root.querySelector(".candidate-items").getBoundingClientRect().top
          - root.querySelector(".pinyin").getBoundingClientRect().bottom - 6) < 1, "canvas final line gap remains six pixels with factory layout");
        const box = card.getBoundingClientRect();
        const all = root.getBoundingClientRect();
        equal(box.left - all.left, 16, "outer left inset affects the popup bounds");
        equal(box.top - all.top, 16, "outer top inset affects the popup bounds");
        await screenshotPixels([
          { x: box.left + 4, y: box.top + 4, rgb: [255, 0, 0], name: "top left source corner keeps its destination width" },
          { x: box.left + box.width / 2, y: box.top + 4, rgb: [0, 255, 0], name: "top source edge stretches" },
          { x: box.left + 25, y: box.bottom - 12, rgb: [255, 0, 255], name: "centre fill stretches behind content" },
          { x: box.left - 5, y: box.top - 5, rgb: [17, 153, 34], name: "back widget extends into outer inset" },
          { x: all.left - 2, y: box.top - 5, rgb: [255, 255, 255], name: "widgets are clipped to the reserved popup bounds" },
          { x: box.right - 4, y: box.top + 4, rgb: [17, 170, 204], name: "z index one widget is above the panel" },
        ]);
        await setReduced(true);
        equal(panel.querySelectorAll("canvas").length, 1, "reduced motion freezes the panel");
        equal(root.querySelectorAll(".skin-picture canvas").length, 2, "reduced motion freezes the widgets");
        await screenshotPixels([{ x: box.left + 4, y: box.top + 4, rgb: [255, 0, 0], name: "the frozen panel keeps its source corner" }]);
        await setReduced(false);
        equal(panel.querySelectorAll("canvas").length, 0, "the live motion preference restores the panel image");
        equal(root.querySelectorAll(".skin-picture img").length, 2, "the live motion preference restores widget images");
        // 两张程序生成的纯色帧验证原生 APNG/GIF 时钟与首帧回退；没有第三方图片。
        const movingImages = {"png": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAMCAYAAABWdVznAAAACGFjVEwAAAACAAAAAPONk3AAAAAaZmNUTAAAAAAAAAAMAAAADAAAAAAAAAAAALQD6AAA8a7+pwAAABxJREFUeJxj/M/A8J+BBMBEimIQGNVADBgOoQQArIUCFiFVnUUAAAAaZmNUTAAAAAEAAAAMAAAADAAAAAAAAAAAALQD6AAAat0UcwAAACBmZEFUAAAAAnicY2Rg+P+fgQTARIpiEBjVQAwYDqEEAKqHAhZF3Mt4AAAAAElFTkSuQmCC", "gif": "data:image/gif;base64,R0lGODlhDAAMAIEAAP8AAAAAAAAAAAAAACH/C05FVFNDQVBFMi4wAwEAAAAh+QQAEgAAACwAAAAADAAMAAAIFgABCBxIsKDBgwgTKlzIsKHDhxARBgQAIfkEARIAAQAsAAAAAAwADACBAAD/AAAAAAAAAAAACBYAAQgcSLCgwYMIEypcyLChw4cQEQYEADs="};
        for (const [format, image] of Object.entries(movingImages)) {
          bar.setSkin({ ...skin, borderImage: { source: image, sliceDip: [4], widthDip: [8] }, decorations: [{ image, widthDip: 12, heightDip: 12, anchor: "top-left", offsetXDip: -12, zIndex: 2 }] });
          await waitFor(() => card.dataset.panel !== undefined && root.querySelector(".skin-picture img")?.complete, `${format} loads`);
          const rect = card.getBoundingClientRect();
          const points = [{ x: rect.left + 3, y: rect.top + 3 }, { x: rect.left - 6, y: rect.top + 6 }];
          const seen = [new Set(), new Set()];
          for (let i = 0; i < 6; i++) {
            const pixels = await screenshotPixels(points);
            pixels.forEach((pixel, n) => seen[n].add(pixel.join()));
            await new Promise((done) => setTimeout(done, 80));
          }
          check(seen[0].size > 1, `${format} panel actually plays frames`);
          check(seen[1].size > 1, `${format} widget actually plays frames`);
          await setReduced(true);
          for (let i = 0; i < 2; i++) {
            await screenshotPixels(points.map((point) => ({ ...point, rgb: [255, 0, 0], name: `${format} freezes on the first frame` })));
            await new Promise((done) => setTimeout(done, 200));
          }
          await setReduced(false);
        }
        // 改主机名形成不同 origin；服务器不返回 CORS 头，冻结路径不能读取或导出图片像素。
        const crossOrigin = new URL("/test/canvas-panel.svg", location.href); crossOrigin.hostname = "localhost";
        bar.setSkin({ ...skin, borderImage: { source: crossOrigin.href, sliceDip: [4] }, decorations: [{ image: crossOrigin.href, widthDip: 12, heightDip: 12, anchor: "top-left", offsetXDip: -12 }] });
        await waitFor(() => card.dataset.panel !== undefined && root.querySelector(".skin-picture img")?.complete, "cross origin images load without CORS");
        await setReduced(true);
        const crossRect = card.getBoundingClientRect();
        await screenshotPixels([{ x: crossRect.left + 3, y: crossRect.top + 3, rgb: [255, 0, 0], name: "cross origin panel freezes without reading its pixels" },
          { x: crossRect.left - 6, y: crossRect.top + 6, rgb: [255, 0, 0], name: "cross origin widget freezes without reading its pixels" }]);
        await setReduced(false);
        bar.setSkin(skin);
        await waitFor(() => card.dataset.panel !== undefined && root.querySelector(".skin-picture img")?.complete, "restore the static skin");
        // 挂件和面板不拦截候选点击，旧节点的迟到事件也不能改变新皮肤。
        const target = parts(bar.element).cands[1];
        const targetRect = target.getBoundingClientRect();

        barHost().shadowRoot.querySelector(".expand-toggle").click();
        await tick();
        barHost().shadowRoot.querySelector('[data-global][data-index="20"]').click();
        await tick();
        equal(field.value, "示例20", "attachInput commits a global grid selection through the engine");
        equal(JSON.stringify(picks.at(-1)), JSON.stringify([20, "synthetic:2", "示例20"]), "attachInput preserves global selection identity");
        engine.replies.push(initial);
        press(field, "n", "KeyN");
        await tick();
        engine.setCandidateExpansion = () => { check(false, "a destroyed bar must not start a deferred expansion"); return Promise.resolve(opened); };
        barHost().shadowRoot.querySelector(".expand-toggle").click();
        detach();
        await tick();
        field.value = "";
      }

      async function builtinFactoryLayout() {
        current = "built-in factory layout";
        const bar = createCandidateBar({ skin: "microsoft", dark: false });
        const shown = composingFrame("ni", ["甲", "乙"]);
        bar.render(shown, { left: 20, top: 20, bottom: 40 });
        const root = parts(bar.element).root;
        const card = root.querySelector(".container");
        const font = parseFloat(getComputedStyle(root).fontSize);
        equal(getComputedStyle(card).minWidth, "160px", "Windows factory card floor is independent of font size");
        check(Math.abs(parseFloat(getComputedStyle(card).paddingLeft) - font * .3) < 1, "Microsoft factory padding reaches the card without a catalog");
        check(root.querySelector(".cand").getBoundingClientRect().width >= font * 3.5 - 1, "Microsoft horizontal factory candidate width is applied");
        equal(root.querySelector(".page-next").textContent, "▶", "Microsoft factory arrows use triangles");
        check(getComputedStyle(card).boxShadow.includes("0.18"), "unspecified Windows shadow uses the normal two-pass recipe");
        root.style.setProperty("--cand-font-size", "20px");
        window.dispatchEvent(new Event("resize"));
        check(root.querySelector(".cand").getBoundingClientRect().width >= 69, "factory em lengths follow the candidate font at runtime");
        bar.setSkin("willow_green");
        equal(getComputedStyle(card).paddingLeft, "0px", "Willow factory zero padding replaces Microsoft padding");
        equal(getComputedStyle(root.querySelector(".pinyin")).marginRight, "5px", "horizontal factory margins are applied");
        equal(getComputedStyle(root.querySelector(".cand")).paddingTop, "5px", "horizontal factory extra height is applied once");
        bar.setLayout("vertical");
        equal(getComputedStyle(root.querySelector(".pinyin")).marginRight, "7px", "direction switch replaces factory margins");
        equal(getComputedStyle(root.querySelector(".cand")).paddingTop, "4px", "vertical factory extra height remains distinct");
        bar.setSkin({ base: "willow_green", fitContent: true, shadow: "none", geometry: { padding: { value: 0, em: false },
          itemExtraHeight: { value: 0, em: false }, preeditMarginDip: { top: 0, right: 0, bottom: 0, left: 0 } } });
        equal(getComputedStyle(root.querySelector(".cand")).paddingTop, "0px", "raw common zero overrides factory direction defaults");
        equal(getComputedStyle(root.querySelector(".pinyin")).marginRight, "0px", "raw zero margins override factory margins");
        equal(getComputedStyle(card).boxShadow, "none", "raw shadow switch reaches painting");
        equal(getComputedStyle(card).minWidth, "0px", "raw fit-content removes the factory floor");
        bar.setSkin("system");
        check(!root.hasAttribute("data-layout"), "global theme restores native layout");
        equal(getComputedStyle(card).paddingLeft, "2px", "global theme restores native vertical padding");
        bar.destroy();
      }

      try {
        await candidateBar();
        await decorationCandidates();
        await expandedCandidates();
        await factoryGeometry();
        await layoutControls();
        await builtinFactoryLayout();
        await motionReplay();
        await canvasSkin();
        await attached();
        await insideModal();
      } catch (error) {
        failures.push(`${current}: threw ${error?.stack ?? error}`);
      }
      log.textContent = failures.length === 0 ? "ok" : failures.join("\n");
      document.body.dataset.result = failures.length === 0 ? "ok" : "fail";
    </script>
  </body>
</html>
