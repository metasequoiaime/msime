[workspace]
members = ["crates/path-trust", "crates/client-core", "crates/engine", "crates/engine-wasm", "crates/input-runtime", "crates/host-api", "crates/host-windows", "crates/host-macos", "crates/tauri-mobile-platform", "crates/ios-native-ffi", "crates/mcp-server", "crates/dict-builder", "crates/backend-engine", "crates/pack-tool", "apps/desktop/src-tauri"]
# Everything except the desktop app: a bare `cargo test` should cover the
# libraries, and msime-desktop needs a built frontend and a packaged platform
# bundle before its build script will run.
default-members = [
    "crates/path-trust",
    "crates/client-core",
    "crates/engine",
    "crates/engine-wasm",
    "crates/input-runtime",
    "crates/host-api",
    "crates/host-windows",
    "crates/host-macos",
    "crates/tauri-mobile-platform",
    "crates/ios-native-ffi",
    "crates/mcp-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
repository = "https://github.com/metasequoiaime/msime"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tempfile = "3"
unicode-general-category = "1.1"
unicode-segmentation = "1.13"
sha2 = "0.11"
rusqlite = "0.40"
time = "0.3"
tokio = "1"
rustix = "1.1"
libc = "0.2"
uuid = "1"
tauri = "2"

# Inherited by every member through `[lints] workspace = true`. `deny` rather
# than `forbid` on purpose: the five FFI crates cannot honour an unoverridable
# ban, and under `forbid` their only option was to inherit nothing at all - so
# the policy covered four of nine members and every future lint added here
# would have missed the same five. Each exemption is now a documented
# `#![allow(unsafe_code)]` at the crate root instead of an absence.
[workspace.lints.rust]
unsafe_code = "deny"

# Smallest dev build tree rather than fastest rebuild: the repo is developed through many parallel worktrees, each with its own target/, and together they fill the disk. No debug info (backtraces keep symbol names but lose file and line) and no incremental cache (about a fifth of target/debug per worktree; edits recompile the whole crate instead). Raise either locally when you need a debugger or faster iteration.
[profile.dev]
debug = 0
incremental = false

# 网页输入法的 wasm 构建（`scripts/build-web-engine.sh`）：体积优先。wasm 上 panic 只能终止实例，unwind 只会增加体积；模块在浏览器 Worker 里运行，宿主靠 `last_panic` 读出 panic 信息，所以 abort 不丢任何东西。
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# 整句模型的整数点积在每个按键上运行，按 opt-level "z" 编译时 wasm 里的重排比原生慢约七倍，按键延迟 p95 贴着发布门槛；只把这个 crate 换成按速度优化，其余仍按体积优化。
[profile.wasm-release.package.chinese-ime-lm]
opt-level = 3

# Local installs of an input method are dev builds (the macOS CMake default links target/debug), and two dependencies sit on the path of every keystroke: the sentence reranker runs on the main thread per key, and every view crosses the host ABI as JSON. Unoptimised, the reranker's integer dot products alone took most of the main thread while typing and stalled the candidate window for seconds. Optimising just these keeps workspace crates quick to rebuild.
[profile.dev.package.chinese-ime-lm]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

# The key-sound mixer renders in the audio callback and decodes music as it plays, so an unoptimised build glitches audibly; kira's documentation asks for these. Local macOS installs are dev builds (above).
[profile.dev.package.kira]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-format-riff]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
