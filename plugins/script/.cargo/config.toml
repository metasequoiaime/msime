# plugins/script/ 下每个插件 crate 共用的构建设置。cargo 从当前目录向上查找 .cargo/config.toml，所以要在插件目录里运行 cargo（scripts/build-script-plugins.sh 就是这样做的）；从仓库根用 --manifest-path 调用时这里不生效。

[build]
target = "wasm32-unknown-unknown"
# 相对这个 .cargo 目录的上一级，即仓库根的 target/script-plugins/cargo。所有插件共用一个产物目录，不在各自目录下留 target/。
target-dir = "../../target/script-plugins/cargo"

# Rust 默认给 wasm 留 1 MiB 的栈，线性内存因此至少 17 页，超过清单默认的 16 页。插件只需要很小的栈。
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=65536"]

# 体积优先：模块不能超过 256 KiB，进程内存总账也按模块字节的 128 倍估算。panic 直接 trap，不带格式化代码。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
